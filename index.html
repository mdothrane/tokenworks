   srcNote:'Hover er en af de tilstande, Curtis nævner: default, hover, press eller active, focus, disabled, visited og error.'},
  {type:'op',kind:'addr',example:true,src:'curtis',start:'',target:'button.primary.background.pressed',val:{t:'blue-700',hex:'#3892f3'},tokens:KT.concat([['button.primary.background.hover',{t:'blue-800',hex:'#147af3'}]]),
   tips:['På denne tavle svarer et navn på fire spørgsmål: hvilken komponent, hvilken variant, hvilken egenskab og hvilken tilstand. Find de fire svar i opgaven.','Det er den primære knap, det er baggrunden, og det er, når knappen trykkes ned. Vælg ét led i hver gruppe.','Vælg `button`, `primary`, `background` og `pressed`, og opret tokenet.'],
   q:'Når den primære knap trykkes ned, skal baggrunden være `blue-700`. Byg navnet fra bunden.',done:'`button.primary.background.pressed` er oprettet.',
   why:'Fire led, fire svar: komponenten er `button`, varianten `primary`, egenskaben `background` og tilstanden `pressed`. Skifter du ét led ud, peger navnet på en anden del.',
   srcNote:'Curtis kalder tilstanden press eller active. `pressed` er dette systems ord for den.'},
  {type:'op',kind:'addr',example:true,src:'curtis',start:'',target:'button.secondary.border',val:{t:'1px grey-600',hex:'#6d6d6d',stroke:1},tokens:KT.concat(KS),
   tips:['På denne tavle gælder et niveau, du ikke vælger noget på, for alle muligheder. Et navn uden tilstand beskriver alle fire tilstande.','Kanten hører til den sekundære knap og er den samme i alle tilstande. Navnet skal derfor ikke nævne en tilstand.','Vælg `button`, `secondary` og `border`. Lad Tilstand stå tom, og opret tokenet.'],
   q:'Den sekundære knap skal have en kant på 1 px i `grey-600`. Kanten er den samme i alle tilstande.',done:'`button.secondary.border` er oprettet.',
   why:'Beslutningen ændrer sig ikke med tilstanden, så navnet nævner ingen tilstand. Ét token beskriver kanten i alle fire. Fire navne med samme værdi ville være fire steder at rette, næste gang kanten ændres.',
   srcNote:'Curtis: medtag kun de niveauer, der skal til for at beskrive og skelne hensigten.'},
  {type:'op',kind:'addr',example:true,src:'curtis',start:'',target:'button.radius',val:{t:'8px',radius:8},tokens:KT.concat(KS,[['button.secondary.border',{t:'1px grey-600',hex:'#6d6d6d',stroke:1}]]),
   tips:['Tag kun de led med, der skal til for at skelne beslutningen fra andre. Resten er støj.','Hjørnerne er ens for begge varianter og i alle tilstande. Navnet skal beskrive hele tavlen.','Vælg kun `button` og `radius`, og opret tokenet.'],
   q:'Alle knapper skal have runde hjørner på 8 px, uanset variant og tilstand.',done:'`button.radius` er oprettet.',
   why:'Hverken variant eller tilstand ændrer hjørnerne. Navnet behøver kun komponent og egenskab, og ét token former alle otte knapper.',
   srcNote:'Curtis’ eget eksempel er `$esds-shape-tile-corner-radius`. At tilføje `-default-on-light` til det navn kalder han overflødigt.'},
  {type:'op',kind:'addr',example:true,src:'fowler',start:'',target:'button.text.disabled',val:{t:'grey-400',hex:'#b1b1b1'},tokens:KT.concat(KS,[['button.secondary.border',{t:'1px grey-600',hex:'#6d6d6d',stroke:1}],['button.radius',{t:'8px',radius:8}],['button.background.disabled',{t:'grey-200',hex:'#e6e6e6'}]]),
   tips:['Et led midt i navnet kan udelades lige så vel som det sidste.','Beslutningen gælder begge varianter, men kun én tilstand: når knappen er slået fra.','Vælg `button`, `text` og `disabled`. Lad Variant stå tom, og opret tokenet.'],
   q:'Når en knap er slået fra, skal teksten være `grey-400`. Det gælder begge varianter.',done:'`button.text.disabled` er oprettet.',
   why:'Her er det varianten, der er udeladt, og tilstanden, der er med. Et niveau midt i navnet kan mangle lige så vel som et sidst i navnet. Navnet beskriver teksten på begge knapper, men kun når de er slået fra.',
   srcNote:'Andreas Kutschmanns artikel har samme beslutning som `button.text-disabled`: tilstanden er skrevet sammen med egenskaben. Samme niveauer, anden skrivemåde.'}
 ]},
{id:'format',title:'Formatet',does:'Reparér en tokenfil, og se anlægget blive til af den.',from:'Design Tokens-specifikationen 2025.10',min:6,
 intro:['De to kæder fra bane 1 findes også som data: en JSON-fil i Design Tokens-formatet.','Læseren bygger anlægget af filen. Det, filen siger, er det, der står på bordet.','Filen har en fejl. Find den på bordet, vælg linjen i filen, og ret den.'],introSrc:['dtcg','color'],
 take:['Et objekt med `$value` er et token. Uden `$value` er det en gruppe, og en gruppe har ingen værdi at give videre.','Typen findes i denne rækkefølge: tokenets egen `$type`, ellers typen på det token, en reference peger på, ellers den nærmeste gruppes `$type`. Findes ingen, er tokenet ugyldigt. Et værktøj må ikke gætte.','En reference i krøllede parenteser skal pege på et helt token, og en kæde af referencer skal ende i en rå værdi.','Værdier har en fast form. En dimension er et objekt med `value` og `unit`. En farve er et objekt med `colorSpace` og `components`.','Formatet er en stabil rapport fra Design Tokens Community Group under W3C. Det er ikke en W3C-standard.'],
 cards:['tokenGruppe','type','reference','dimension','farve','navneregler','specStatus','composite'],
 /* One file, five faults. `set` puts the fault into the healthy file, `fix` is the shortest repair (tests). The rules are the format module's. */
 rounds:[
  {type:'op',kind:'file',src:'dtcg',set:[['key','button.primary.background','value']],fix:['ln:k:button.primary.background','e:key:button.primary.background:$value'],
   tips:['Sådan læses filen: en linje med et navn og `$value` er et token. Navnet står først, og efter `$value` står værdien. En linje, der kun åbner en krøllet parentes, er en gruppe.','På bordet står `background` kun som et omrids. Find linjen med `background` i filen, og sammenlign den med linjen med `accent`.','På linjen med `background` står der `value` uden dollartegn. Vælg linjen, og skriv nøglen som `$value`.'],
   q:'Knappen har ingen farve. Find fejlen i filen, og reparér den.',done:'`$value` gør objektet til et token.',
   why:'Uden dollartegnet er `value` et navn som alle andre, og objektet er en gruppe. Med `$value` er det et token, og referencen til `color.accent` kan følges. Derfor står der nu en klods, et rør og en farvet knap.'},
  {type:'op',kind:'file',src:'dtcg',set:[['gt','color',null]],fix:['ln:g:color','e:gt:color:color'],
   tips:['En værdi skal have en type, før den kan bruges. Typen står som `$type`, enten på tokenet selv eller på gruppen over det.','Sammenlign gruppen `color` med gruppen `space`. Under `space` står en linje med `$type`. Den mangler under `color`.','Vælg linjen `color`, hvor gruppen begynder, og tilføj `"$type": "color"` til gruppen.'],
   q:'Nu når ingen farve frem til knappen. Find fejlen i filen, og reparér den.',done:'Typen kan bestemmes igen.',
   why:'Et token uden egen `$type` arver den fra den nærmeste gruppe, der har en. `color.accent` får sin type fra det token, den peger på. Typen kan stå på gruppen eller på `blue-900` alene: begge dele giver alle tre tokens en type.'},
  {type:'op',kind:'file',src:'dtcg',set:[['ref','color.accent','color.blue']],fix:['ln:k:color.accent','e:ref:color.accent:color.blue-900'],
   tips:['En værdi i krøllede parenteser er en reference: stien til et andet token. Den skrives som gruppens navn, et punktum og tokenets navn.','På bordet ender røret på `accent` i luften. Referencen peger på et navn, der ikke findes i filen. Sammenlign det med navnene i gruppen `color`.','Linjen med `accent` peger på `{color.blue}`, men tokenet hedder `blue-900`. Vælg linjen, og peg på `color.blue-900`.'],
   q:'Knappen har stadig ingen farve. Find fejlen i filen, og reparér den.',done:'Referencen når et token.',
   why:'En reference er stien til et token: gruppens navn, et punktum og tokenets navn. `{color.blue}` findes ikke, så der var intet at hente. Nu peger `color.accent` på `color.blue-900`, og værdien løber hele vejen til knappen.'},
  {type:'op',kind:'file',src:'dtcg',set:[['form','space.space-32','str']],fix:['ln:k:space.space-32','e:form:space.space-32:obj'],
   tips:['En afstand er en dimension. I formatet skrives den som et objekt i krøllede parenteser med to felter: et tal i `value` og en enhed i `unit`.','Se på linjen med `space-32`. Værdien står som tekst i anførselstegn, ikke som et objekt. På bordet har klodsen ingen lineal.','Vælg linjen med `space-32`, og skriv værdien som objekt: `{ "value": 32, "unit": "px" }`.'],
   q:'Kortet har ingen luft. Find fejlen i filen, og reparér den.',done:'Dimensionen har den rigtige form.',
   why:'I 2025.10 er en dimension et objekt med et tal i `value` og en enhed i `unit`, som kun må være `px` eller `rem`. Teksten `"32px"` ser rigtig ud, men er ikke en gyldig dimension. Farver følger samme tanke: et objekt med `colorSpace` og `components`.',
   srcNote:'Du vil stadig møde den korte form i ældre filer. Andreas Kutschmanns artikel skriver fx farver som hex-tekst.'},
  {type:'op',kind:'file',src:'dtcg',example:true,grey:true,set:[['raw','color.accent','blue-900']],goal:{button:'#464646',ref:['color.accent','color.grey-700']},fix:['ln:k:color.accent','e:ref:color.accent:color.grey-700'],
   tips:['En værdi kan stå på to måder i filen. En rå farve er et objekt med `colorSpace` og `components`. En reference er en sti i krøllede parenteser, fx `"{color.blue-900}"`.','Linjen med `accent` har sin egen kopi af den blå farve. Den skal i stedet være en reference til den grå.','Vælg linjen med `accent`, og peg på `color.grey-700`.'],
   q:'Rollen `accent` skal følge `grey-700`, som i bane 1. Ret det i filen.',done:'`color.accent` peger på `color.grey-700`.',
   why:'`color.accent` havde sin egen kopi af den blå farve. En rå værdi følger ikke med, når den oprindelige værdi ændres, og der går intet rør fra den. En reference er en forbindelse. Det er den samme ændring, du lavede med hånden i bane 1, nu skrevet som data.'}
 ]},
{id:'tema',title:'Temaet',does:'Byg en Dark-mode ved at flytte referencer, og se to rum svare på én gang.',from:'Figma, Andreas Kutschmann og WCAG',min:5,
 intro:['En mode er et sæt værdier for de samme tokens, fx Light og Dark.','I dette anlæg har hvert semantisk token to referencer: én for Light og én for Dark. Komponent-tokens har kun én. De peger på en rolle og ved ikke, hvilken mode der er aktiv.','Dark findes ikke endnu: de mørke referencer peger samme sted som de lyse. Vælg en reference, og peg den på et andet primitivt token. Begge rum svarer med det samme.'],introSrc:['figmaTokens','figma','wcag'],
 take:['En mode er et sæt værdier for de samme tokens. I Figmas vejledning er Dark en mode i samlingen `Tokens`, som rummer både semantiske tokens og komponent-tokens.','I dette anlæg røres komponent-tokens ikke, når en mode tilføjes. De peger på roller, og rollerne får nye værdier.','Én flyttet reference når alle de dele, der bruger rollen. Retter du i stedet et komponent-token, flytter du én del, og i dette anlæg skifter den i begge modes.','Hver mode skal tjekkes for sig. En farve, der virker mod en lys flade, virker ikke nødvendigvis mod en mørk.','At modes ligger på rollerne, er dette anlægs opbygning, ikke en regel. I Design Tokens-formatet har et token én `$value`, og modes beskrives i en resolver-fil ved siden af.'],
 cards:['mode','kontrast','themeMode','resolver'],
 /* Light is Kutschmann's decisions. Dark is an example. `dark` sets where the Dark references stand when the round begins. */
 rounds:[
  {type:'op',kind:'mode',example:true,src:'figmaTokens',goal:'surface',par:1,fix:[['surface','grey-800']],
   tips:['I dette anlæg har hvert semantisk token to referencer: én for Light og én for Dark. Listen viser referencerne for den mode, der er valgt øverst.','Lad Dark være valgt, og vælg `surface` blandt de semantiske tokens. Så kommer de primitive tokens frem, som den kan pege på.','Vælg `surface`, og peg den i Dark på `grey-800`.'],
   q:'Fladen skal være mørk i Dark. Peg `surface` i Dark på `grey-800`.',done:'Én reference er flyttet. To dele skiftede.',
   why:'Kortets baggrund og den sekundære knaps baggrund peger begge på `surface`, så begge blev mørke. Light-rummet er urørt, fordi du kun flyttede Dark-referencen. Light-værdierne er fra Andreas Kutschmanns artikel. Men teksten peger stadig på `grey-900` i Dark, og den er nu næsten usynlig.'},
  {type:'op',kind:'mode',example:true,src:'figmaTokens',plan:['text','dark','grey-100'],dark:[['surface','grey-800']],
   tips:['En del skifter kun farve, hvis dens komponent-token peger på den rolle, der ændres. Det afgøres af referencen, ikke af hvad delen ligner.','Tre dele peger på `text`. Teksten på den primære knap gør ikke: den peger på `text-on-accent`.','Markér `card.title`, `card.body` og `button.secondary.text`, og udfør ændringen.'],
   q:'Teksten skal være lys i Dark: `text` skal pege på `grey-100`. Markér først de dele på Dark-skærmen, der skifter farve.',done:'Én reference er flyttet. Tre dele skiftede.',
   why:'Tre dele peger på `text`: kortets overskrift, kortets brødtekst og teksten på den sekundære knap. Teksten på den primære knap peger på `text-on-accent` og er urørt. Hvor langt en ændring når, afgøres af referencerne, ikke af hvad delene ligner.'},
  {type:'op',kind:'mode',example:true,src:'wcag',goal:'all',par:2,dark:[['surface','grey-800'],['text','grey-100']],fix:[['accent','blue-800'],['text-on-accent','grey-900']],
   tips:['Kontrast måles mellem to farver. Knappens baggrund kommer fra rollen `accent`, og teksten på knappen fra `text-on-accent`.','En lysere blå står tydeligere mod den mørke flade. Men så skal teksten på knappen også tjekkes igen.','Peg `accent` i Dark på `blue-800`. Peg derefter `text-on-accent` i Dark på `grey-900`.'],
   q:'Den primære knap står for svagt mod den mørke flade: 2,9:1 mod en grænse på 3:1. Få alle tjek i Dark til at bestå. Knappen skal stadig være blå, og hverken fladen eller Light må ændres.',done:'Dark består alle tjek.',
   why:'`accent` peger nu på en lysere blå i Dark, og `text-on-accent` måtte følge med, fordi hvid tekst står for svagt på den lysere blå. Ingen komponent-tokens er rørt. Light består stadig alle tjek: dets referencer er de samme som før. WCAG kræver 4,5:1 for almindelig tekst. Grænsen på 3:1 for knappens baggrund er anlæggets egen. Tallet er lånt fra WCAG 1.4.11, som ikke kræver det af en knap med læsbar tekst.'}
 ]},
{id:'pipe',title:'Pipelinen',does:'Kobl kilden til platformene, og send en beslutning gennem buildet.',from:'Andreas Kutschmann og Style Dictionary',min:5,
 intro:['Tokens bor ét sted: kilden. Her er det to JSON-filer i et repository.','Et build læser filerne og skriver en fil med kode til hver platform: CSS til web og Swift til iOS. Interfacet læser farven derfra.','Du styrer anlægget: hvilke filer der er med, hvad platformene er koblet til, og hvornår buildet kører.'],introSrc:['fowler','sd'],
 take:['Kilden er ét sted. Andreas Kutschmann anbefaler et Git-repository som den fælles kilde.','I Style Dictionary fletter buildet alle tokenfiler til ét objekt. Derfor kan en reference pege på et token i en anden fil, så længe begge filer er med.','En transform i Style Dictionary tilpasser det enkelte token til platformen, fx navnet: `button-primary-background` i CSS og `buttonPrimaryBackground` i Swift. Et format skriver filen.','Output er genereret. En rettelse direkte i en outputfil gælder kun dér, og næste build skriver filen på ny. Style Dictionary skriver selv "Do not edit directly" øverst i filerne.','En ændring i kilden når alle platforme, der er koblet på den. En platform på en håndkopi følger ikke med.','Anlægget viser én mulig opbygning, ikke den eneste. Trinene og navnene på transforms er Style Dictionarys.'],
 cards:['pipeline','sd','sti','enheder','privat'],
 rounds:[
  {type:'op',kind:'line',src:'sd',goal:'merge',start:{options:false},fix:['f:options','build'],
   tips:['I Style Dictionary fletter buildet de filer, der er med i kilden, til ét objekt, før referencerne følges.','`accent` ligger i `tokens.json` og peger på en farve i `options.json`. Den fil er ikke med i buildet.','Tag `options.json` med under Kilde, og kør buildet.'],
   q:'Buildet er standset, og web har ingen fil. Få buildet til at køre.',done:'Buildet kørte. Web har fået sin fil.',
   why:'`accent` ligger i `tokens.json` og peger på `blue-900`, som ligger i `options.json`. Buildet fletter alle filer i kilden til ét objekt, før referencerne følges til en værdi. Da begge filer var med, kunne referencen følges, og `--button-primary-background` blev skrevet til web.'},
  {type:'op',kind:'line',src:'sdg',goal:'ios',start:{built:true,ios:['copy',null]},fix:['feed:ios:source','name:ios:camel','build'],
   tips:['En platform viser det, den er koblet til. Se, hvor iOS får sine værdier fra.','iOS står på en håndkopi. Koblet til kilden skal iOS også have en transform af navnet, for et Swift-navn uden backticks kan ikke indeholde punktummer eller bindestreger.','Lad iOS få sine værdier fra Kilden, vælg `name/camel`, og kør buildet.'],
   q:'iOS-appen viser en anden blå end web. Begge platforme skal følge kilden.',done:'iOS følger kilden.',
   why:'iOS stod på en håndkopi, som ingen build rører. Nu læser begge platforme samme beslutning fra samme kilde. Værdien er den samme, men formen er platformens. CSS får `--button-primary-background`. Swift får et navn uden bindestreger og punktummer, fx `buttonPrimaryBackground`, fordi et Swift-navn uden backticks ikke kan indeholde dem. Det er transformens arbejde.',
   srcNote:'Style Dictionarys indbyggede transform groups bruger `name/kebab` i `css` og `name/camel` i `ios-swift`. Reglen for navne står i Swifts sprogreference.'},
  {type:'op',kind:'line',src:'sdf',example:true,goal:'source',start:{built:true,ios:['source','camel'],patch:'web'},fix:['src:grey-700','build'],
   tips:['Output er genereret. En rettelse direkte i en outputfil gælder kun dér, og næste build skriver filen på ny.','Farven bestemmes i kilden, af det `accent` peger på. Ændres den dér, følger begge platforme med.','Peg `accent` i kilden på `grey-700`, og kør buildet.'],
   q:'Knappen skal være grå på både web og iOS. På web har nogen allerede rettet farven direkte i filen.',done:'Én ændring i kilden. To platforme fulgte med.',
   why:'Du ændrede én reference i kilden og kørte buildet. Begge filer blev skrevet på ny, også den, der var rettet i hånden, og begge platforme fulgte med. Rettelsen direkte i outputfilen ramte kun web og var væk efter første build.',srcNote:'Style Dictionary skriver som standard "Do not edit directly" øverst i de filer, den genererer.'}
 ]},
{id:'system',title:'Systemet',does:'Find årsagen bag en forkert skærm, og reparér den dér, hvor den ligger.',from:'Kilderne fra bane 1 til 5',min:7,
 intro:['Fire skærme viser resultatet af hele systemet. En del, der afviger fra designet, er markeret.','Vælg en afvigende del, og følg den baglæns, ét led ad gangen: hvilket token delen bruger, hvad det peger på, og hvornår platformen sidst blev bygget.','Reparér årsagen. Opgaven er løst, når systemet er rigtigt igen, ikke når skærmen ser rigtig ud.'],introSrc:['fowler','figmaTokens'],
 take:['En synlig fejl i en komponent behøver ikke have sin årsag i komponenten. Følg kæden baglæns, før du retter.','Mønstret peger på laget. Afviger alle dele, der deler en rolle, ligger årsagen i rollen. Afviger kun én del, men overalt, ligger den i komponent-tokenet. Afviger kun én mode, er det den modes reference. Afviger kun én platform, ligger årsagen i buildet eller i platformens kode.','En rettelse i platformens kode fjerner symptomet ét sted. Årsagen bliver, og det næste, der bruger tokenet, bliver forkert.','Før du ændrer en reference, kan du forudsige, hvor ændringen når hen: alle dele, der peger på den, i den mode, på alle platforme, der bygges fra kilden.'],
 cards:['lag3','alias','mode','pipeline'],
 /* The healthy system is level 4's result on two platforms. `fault` is put into it, `fix` is the shortest repair (tests). All six are examples. */
 rounds:[
  {type:'op',kind:'diag',example:true,src:'figmaTokens',fault:[['sem','accent','light','grey-700']],fix:['sel:s:accent','r:s:accent:light:blue-900'],
   tips:['Begynd ved symptomet. Vælg Knappens baggrund under Dele på skærmen, og se, hvilket token delen bruger. Vælg så det token, og følg det ét led videre.','Linket afviger også, og kun i Light. De to dele deler rollen `accent`. Når flere dele med samme rolle afviger, peger mønstret på rollen.','Vælg `accent` under Semantiske tokens, og peg den i Light på `blue-900`.'],
   q:'Send-knappen er grå på web i Light. Den skal være blå. Find årsagen, og reparér den.',done:'Årsagen lå i rollen.',
   why:'Fire dele afveg: knappens baggrund og linket, på begge platforme, kun i Light. De to dele deler rollen `accent`, og den pegede på `grey-700` i Light. Én reference blev flyttet tilbage, og alle fire dele fulgte med.'},
  {type:'op',kind:'diag',example:true,src:'figmaTokens',fault:[['comp','button.primary.background','surface']],fix:['sel:c:button.primary.background','r:c:button.primary.background:accent'],
   tips:['Se på mønstret: kun én del afviger, men den gør det på alle fire skærme.','Linket bruger også `accent` og er rigtigt, så rollen fejler intet. Se, hvad knappens eget komponent-token peger på.','Vælg `button.primary.background` under Komponent-tokens, og peg det på `accent`.'],
   q:'Send-knappen går i ét med kortet på alle fire skærme. Find årsagen, og reparér den.',done:'Årsagen lå i komponent-tokenet.',
   why:'Kun knappens baggrund afveg, men på alle skærme. Linket, som også bruger `accent`, var rigtigt, så rollen fejlede intet. Fejlen lå i komponent-tokenet: `button.primary.background` pegede på `surface`.'},
  {type:'op',kind:'diag',example:true,src:'figmaTokens',mon:'web:dark',fault:[['sem','text','dark','grey-900']],fix:['sel:s:text','r:s:text:dark:grey-100'],
   tips:['Fejlen ses kun i Dark, men på begge platforme. I dette anlæg er det eneste, der kun gælder én mode, en rolles reference for den mode.','Overskriften bruger `card.title`, som peger på rollen `text`. Se, hvad `text` peger på i Dark.','Vælg `text` under Semantiske tokens, og peg den i Dark på `grey-100`.'],
   q:'Overskriften på kortet kan ikke læses i Dark. Find årsagen, og reparér den.',done:'Årsagen lå i rollens Dark-reference.',
   why:'Overskriften afveg på begge platforme, men kun i Dark. Komponent-tokenet pegede rigtigt på `text`. Det var rollens Dark-reference, der pegede på `grey-900`. Light har sin egen reference og var aldrig berørt.'},
  {type:'op',kind:'diag',example:true,src:'dtcg',fault:[['comp','card.title','txt']],fix:['sel:c:card.title','r:c:card.title:text'],
   tips:['En del uden farve har en kæde, der ikke når en værdi. Følg kæden fra overskriften, og se, hvor den ender.','`card.title` peger på `txt`. Der findes ingen rolle med det navn.','Vælg `card.title` under Komponent-tokens, og peg det på `text`.'],
   q:'Overskriften på kortet har ingen farve på nogen skærm. Find årsagen, og reparér den.',done:'Referencen når en rolle igen.',
   why:'`card.title` pegede på `txt`, og der findes ingen rolle med det navn. En reference, der ikke når et token, kan ikke følges til en værdi, og et værktøj skal melde fejl. I dette anlæg står delen i stedet uden farve, i alle modes og på alle platforme.'},
  {type:'op',kind:'diag',example:true,src:'fowler',mon:'ios:light',fault:[['stale','ios','accent','light','grey-700']],fix:['sel:o:ios','r:b:ios'],
   tips:['Fejlen ses kun på én platform. Tokens er fælles for begge platforme, så årsagen ligger efter dem.','Kæden bag knappen er rigtig hele vejen: `accent` peger på `blue-900`. Se på platformens output, og hvornår det blev bygget.','Vælg iOS under Platforme, og kør buildet for iOS.'],
   q:'På iOS er knappen og linket grå i Light. På web er de blå. Find årsagen, og reparér den.',done:'Årsagen lå i buildet.',

  {type:'op',kind:'diag',example:true,src:'figmaTokens',plan:['c','link.text','text'],

   q:'En ændring er planlagt: `link.text` skal pege på `text` i stedet for `accent`, og begge platforme bygges. Markér de dele og skærme, der skifter farve, før du udfører den.',done:'Ændringen er udført.',
   why:'Kun linket skifter, for kun det komponent-token er flyttet. Men det skifter på alle fire skærme: i dette anlæg har et komponent-token ingen modes, så delen følger nu `text` i både Light og Dark, og begge platforme bygges fra samme kilde. Knappen peger stadig på `accent` og er urørt.'}

/* ---------- opslag: short background cards a player can read before answering. Each rests on the same free sources as the rounds. ---------- */
var CARDS={
 lag3:{t:'De tre lag af tokens',src:'fowler',p:['Primitive tokens beskriver, hvilke værdier der findes. Navnet siger, hvad værdien er: en farve på en skala eller et trin i en afstandsskala. Eksempel: `grey-100`.','Semantiske tokens beskriver, hvordan en værdi bruges. Navnet siger noget om rolle eller betydning, og værdien er typisk en reference til et primitivt token. Eksempel: `surface` peger på `grey-100`.','Komponent-tokens beskriver, hvor i en bestemt komponent en beslutning gælder. Navnet indeholder komponenten. Eksempel: `button.secondary.background` peger på `surface`.','Spørg dig selv: siger navnet, hvad værdien er, hvordan den bruges, eller hvor den sidder?']},
 lagAntal:{t:'To eller tre lag?',src:'fowler',p:['Man kan nøjes med to lag: primitive og semantiske tokens. Det passer, når de store designbeslutninger er på plads og nogenlunde stabile.','Et tredje lag med komponent-tokens gør det lettere at ændre beslutninger senere. Prisen er, at hver ny komponent får sine egne tokens, så antallet og vedligeholdet vokser.']},
 lagHvornaar:{t:'Hvornår betaler tokens sig?',src:'fowler',p:['Tokens betaler sig, når samme design skal ud på flere platforme eller i flere applikationer, når designet ændrer sig ofte, og når mange mennesker arbejder på det samme.','De koster også noget at holde ved lige. I et lille projekt med begrænset omfang kan det besvær være større end gevinsten.']},
 alias:{t:'Alias: et token peger på et andet',src:'figmaTokens',p:['Et alias er et token, hvis værdi er en reference til et andet token. Ændres kilden, følger alle tokens med, der peger på den.','Sådan bygges lagene oven på hinanden: komponent peger på semantisk, og semantisk peger på primitiv.','I en struktur med flere lag er primitive tokens fundamentet og kun til reference. Det er semantiske tokens og komponent-tokens, der sættes på selve designet.']},
 niveauer:{t:'Niveauer i et tokennavn',src:'curtis',p:['Nathan Curtis deler et tokennavn i led, hvor hvert led har et niveau. Niveauerne falder i fire grupper.','Base: category er typen af stil (`color`, `font`, `space`). concept samler tokens om et formål (`action`, `feedback`). property er den egenskab, der styles (`background`, `text`, `border`, `size`).','Modifiers: variant skelner mellem alternativer (`primary`, `secondary`, `success`, `error`). state er interaktion (`hover`, `focus`, `disabled`). scale er et trin på en skala (`100`, `2-x`). mode er den flade, elementet står på (`on-dark`).','Objects: component er en komponent (`button`, `input`). element er en del i komponenten (`left-icon`). component group samler beslægtede komponenter (`forms`).','Namespaces: system er designsystemets navn eller forkortelse. theme og domain afgrænser yderligere.']},
 raekkefolge:{t:'Rækkefølgen i et navn',src:'curtis',p:['Der er ingen fast rækkefølge på tværs af designsystemer, men Curtis ser et mønster.','Namespace står forrest. Objects, altså komponent og element, kommer derefter. Base, altså category, concept og property, udgør midten. Modifiers, altså variant, state, scale og mode, står til sidst, ofte med mode allersidst.','Inden for base varierer rækkefølgen fra system til system.']},
 homonym:{t:'Undgå homonymer',src:'curtis',p:['Et homonym er et ord med flere betydninger. I tokennavne skaber de tvivl, fordi samme ord kan læses som en kategori, en egenskab eller noget helt tredje.','Curtis nævner `text`, som både kan betyde typografi, indhold og en egenskab. Vælg ord, der kun kan forstås på én måde.']},
 komplet:{t:'Kun de nødvendige niveauer',src:'curtis',p:['Intet token har alle niveauer. Tag kun dem med, der skal til for at beskrive og skelne hensigten.','Niveauer, der ikke ændrer noget for netop dette token, er støj. Curtis kalder `-default-on-light` overflødigt på en skygges forskydning.']},
 themeMode:{t:'Theme og mode',src:'curtis',p:['Et theme skifter farver, typografi og anden stil på tværs af alle komponenter, typisk for et brand eller et produkt.','En mode skelner mellem de flader, elementerne står på, typisk lys og mørk.','De to er uafhængige akser: ethvert theme kan have brug for både lys og mørk.','Det er Curtis’ brug af ordet: et led i navnet, fx `on-dark`. I Figma er en mode et sæt værdier, og navnet er det samme.']},
 lokalGlobal:{t:'Lokalt først, globalt senere',src:'curtis',p:['Et token, som kun én komponent har brug for, hører hjemme hos komponenten.','Når flere beslægtede komponenter deler samme beslutning, kan tokenet løftes til en komponentgruppe og gøres globalt. Curtis’ tommelfingerregel er tre eller flere komponenter.','At gøre beslutninger globale for tidligt fylder det fælles navnerum med gætterier.']},
 polyhierarki:{t:'Når en beslutning passer to steder',src:'curtis',p:['Nogle beslutninger hører naturligt hjemme i to sæt på én gang. En fejlfarve er både en del af feedback-farverne og en del af formularfelternes tekstfarver.','Curtis kalder det polyhierarki. Spørgsmålet er, om beslutningen skal gemmes ét eller to steder, og hvordan de to steder hænger sammen.']},
 taksAudit:{t:'Kortlæg, før du beslutter',src:'curtis2',p:['Når en token-taksonomi skal laves om, begynder Curtis med en plan og kortlægger derefter det, der findes: tokens i Figma, i koden og i dokumentationen, og hvordan de faktisk er brugt på komponenterne.','I kortlægningen leder han efter tokens, der er for generelle, bruges forkert, eller bruges til samme formål under forskellige navne.','Først derefter besluttes den nye taksonomi i fællesskab, og til sidst implementeres den.']},
 skala:{t:'Skalaer',src:'curtis',p:['En skala er en række trin med faste navne. Curtis beskriver flere slags: nummererede niveauer, ordnede trin som `100` til `900`, forholdstal som `2-x` og t-shirt-størrelser som `small`, `medium` og `large`.','Navnet på et trin er et løfte om, at trinnet er forskelligt fra sine naboer.']},
 tokenGruppe:{t:'Token eller gruppe',src:'dtcg',p:['En tokenfil er JSON. Et objekt er et token, hvis det har en `$value`. Navnet er den nøgle, objektet står under.','Et objekt uden `$value` er en gruppe. Den kan indeholde tokens og andre grupper.','Felter, der hører til formatet, begynder med `$`: `$value`, `$type`, `$description`, `$deprecated` og `$extensions`.']},
 specStatus:{t:'Design Tokens-specifikationen',src:'news',p:['Formatet er lavet af Design Tokens Community Group, en åben gruppe under W3C med deltagere fra bl.a. Adobe, Google, Figma, Salesforce og Shopify.','Den første stabile version hedder 2025.10 og udkom 28. oktober 2025. Den består af tre moduler: Format, Color og Resolver.','En Community Group udgiver rapporter. Det er ikke det samme som en W3C Recommendation, som er W3C’s egentlige standarder.']},
 navneregler:{t:'Regler for navne',src:'dtcg',p:['Navne på tokens og grupper må ikke begynde med `$`, fordi `$` er reserveret til formatets egne felter.','De må heller ikke indeholde `{`, `}` eller punktum, fordi de tegn bruges, når et token refererer til et andet: `{gruppe.token}`.','Navne skelner mellem store og små bogstaver.']},
 dimension:{t:'Typen dimension',src:'dtcg',p:['En dimension er en afstand i én retning: bredde, højde, radius eller tykkelse.','Værdien er et objekt med to felter: `value`, som er et tal, og `unit`, som er `px` eller `rem`. Enheden skal med, også når værdien er 0.']},
 farve:{t:'Typen color',src:'color',p:['En farve skrives som et objekt. `colorSpace` fortæller, hvilket farverum tallene er i, fx `srgb`, `display-p3` eller `oklch`. `components` er farvens komponenter i det farverum.','`alpha` er valgfri og angiver gennemsigtighed. `hex` er også valgfri og er kun et fallback på seks cifre.']},
 reference:{t:'Referencer',src:'dtcg',p:['Et token kan få sin værdi fra et andet token. Referencen skrives som stien til tokenet i krøllede parenteser, med punktum mellem grupperne: `{color.brand}`.','En reference kan pege på et token, der selv er en reference. Så følges kæden, til der står en rigtig værdi.','Kæden skal ende et sted. En reference i krøllede parenteser kan kun pege på et helt token, ikke på en gruppe.']},
 type:{t:'Hvor kommer typen fra?',src:'dtcg',p:['Alle tokens har en type. Den kan stå på tokenet selv som `$type`.','Står den ikke dér, og er værdien en reference, er typen den samme som hos det token, der peges på. Ellers arves typen fra den nærmeste gruppe, der har en `$type`.','Kan typen ikke findes på nogen af de måder, er tokenet ugyldigt.']},
 root:{t:'Grundværdi i en gruppe',src:'dtcg',p:['En gruppe kan have en grundværdi ved siden af sine varianter. Den ligger i et token med det reserverede navn `$root`.','En reference i krøllede parenteser skal altid pege på et token, aldrig på en gruppe.']},
 pointer:{t:'To måder at referere på',src:'dtcg',p:['Krøllede parenteser peger på et helt token og giver hele dets værdi.','Formatet har også JSON Pointer: feltet `$ref` med en sti, der begynder med `#/` og bruger skråstreger. En JSON Pointer kan pege hvor som helst i dokumentet, også ind i en værdi.']},
 extends:{t:'Grupper, der arver',src:'dtcg',p:['En gruppe kan arve fra en anden gruppe med `$extends`. Alt fra den anden gruppe kommer med.','Det, den nye gruppe selv definerer på samme sti, overskriver det arvede. Resten bliver stående.']},
 resolver:{t:'Temaer i formatet',src:'resolver',p:['Et token har kun én værdi. Temaer og modes beskrives derfor uden for tokenet, i en resolver-fil.','Den har sets, som er tokenfiler, der altid er med, og modifiers, som har flere contexts, fx `light` og `dark`, der hver peger på deres egne filer.','`resolutionOrder` bestemmer rækkefølgen, og det seneste vinder ved konflikt. Hver kombination af contexts på tværs af modifiers giver ét færdigt sæt tokens.']},
 extensions:{t:'Værktøjernes egne data',src:'dtcg',p:['`$extensions` er et sted, hvor værktøjer kan gemme deres egne data på et token eller en gruppe.','Hvert værktøj bruger sin egen nøgle, typisk et omvendt domænenavn som `com.figma`, så de ikke støder sammen.','Tanken er, at en fil skal kunne vandre mellem værktøjer, uden at nogen mister deres data.']},
 composite:{t:'Sammensatte typer',src:'dtcg',p:['Nogle stilarter består af flere værdier, der hører sammen. En skygge har farve, forskydning, sløring og spredning.','Formatet har sammensatte typer til det: `shadow`, `border`, `typography`, `transition`, `gradient` og `strokeStyle`.','Et sammensat token er ét token med én værdi, som er et objekt med faste delværdier. En gruppe er derimod kun en mappe til at organisere tokens i.']},
 mode:{t:'Modes: samme tokens, flere værdier',src:'figmaTokens',p:['En mode er et sæt værdier for de samme tokens. Light og Dark er det klassiske eksempel.','I dette anlæg ved komponent-tokens ikke, hvilken mode der er aktiv. De peger på en rolle som `text`, og rollen peger på ét primitivt token i Light og et andet i Dark.','Derfor rettes en fejl i Dark her ved at pege rollens Dark-reference et andet sted hen, ikke ved at ændre komponent-tokenet.']},
 kontrast:{t:'Kontrast',src:'wcag',p:['Kontrast er forholdet mellem lysheden af to farver, fra 1:1 for to ens farver til 21:1 for sort mod hvid.','WCAG 2.1 kræver mindst 4,5:1 mellem almindelig tekst og dens baggrund, og 3:1 for det, der skal til for at genkende et grænseflade-element. Bane 4 bruger 3:1 som sin egen grænse for knappens baggrund mod fladen. WCAG kræver det ikke af en knap med læsbar tekst.']},
 sd:{t:'Style Dictionary',src:'sd',p:['Style Dictionary er et open source-værktøj, der oversætter tokenfiler til kode.','Det læser en konfiguration, finder tokenfilerne, læser dem og fletter dem sammen til ét stort objekt.','For hver platform ændrer transforms de enkelte tokens, fx navnets form eller værdiens enhed. Et format skriver derefter filerne, fx CSS, Swift eller Android XML. Actions kan gøre ekstra ting til sidst, som at kopiere filer.']},
 sti:{t:'Fra sti til variabelnavn',src:'dtcg',p:['I en tokenfil kan to tokens hedde det samme, hvis de ligger i hver sin gruppe. Stien fra yderste gruppe ned til tokenet er derimod unik.','Værktøjer, der skriver kode, har brug for unikke variabelnavne.']},
 enheder:{t:'Enheder på tværs af platforme',src:'dtcg',p:['I tokenfilen er `px` en idealiseret pixel, ikke en fysisk. Hver platform har sin egen enhed for det samme.','Android bruger `dp` til mål og `sp` til skriftstørrelser, der følger brugerens indstilling. iOS bruger `pt`. På web følger `rem` brugerens skriftstørrelse.']},
 figmaEksport:{t:'Eksport fra Figma',src:'figma',p:['Figma kan eksportere variabler som JSON i Design Tokens-formatet. Man højreklikker på en mode og vælger Export mode, eller på en collection og vælger Export modes.','Husk, at et token kun har én værdi i formatet.']},
 figmaImport:{t:'Import i Figma',src:'figma',p:['Figma kan importere tokenfiler som variabler: træk filerne ind i en ny collection, eller højreklik på en mode og vælg Import mode.','Ikke alt i formatet kan blive til variabler. Figma har en liste over typer, der understøttes, og nogle af dem har krav til enhed eller farverum.','Grupper i filen bliver til grupper i variabelnavnet. Variabler, der allerede findes, genkendes på navn og type.']},
 pipeline:{t:'En token-pipeline',src:'fowler',p:['I en automatiseret pipeline ligger tokenfilerne i et Git-repository, som er den fælles kilde for design og udvikling.','Når filerne ændres, kører en række trin automatisk: filerne tjekkes, der bygges kode til hver platform, resultatet testes og udgives, og de teams, der bruger tokens, får besked.']},
 scope:{t:'Scoping og publicering i Figma',src:'figmaVars',p:['I Figma kan en variabel scopes, så den kun kan vælges til bestemte egenskaber. En farve kan begrænses til fx tekst, og et tal til fx hjørneradius.','En variabel kan også skjules fra publicering, så den ikke dukker op hos dem, der bruger biblioteket.']},
 privat:{t:'Private og offentlige tokens',src:'fowler',p:['Ikke alle tokens behøver at være synlige for dem, der bruger designsystemet. Færre valg giver en bedre oplevelse og viser, hvilke tokens man skal bruge.','Tokens, der holdes interne, er der ingen udenfor, der er afhængige af.']},
 navneraad:{t:'Råd om navne',src:'figmaTokens',p:['Figma anbefaler hele ord frem for forkortelser, ens præfikser og navne, der kan holde, når systemet vokser.','Design Tokens-specifikationen giver samme råd om forkortelser i sit afsnit om navngivning.']},
 codeSyntax:{t:'Code syntax i Figma',src:'figmaVars',p:['En variabel i Figma kan have en code syntax: det navn, den har i koden. Der kan angives ét for Web, ét for Android og ét for iOS.','Navnet vises i kodeuddragene i Dev Mode, når en udvikler inspicerer et design.']}
