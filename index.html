  /* what the monitors showed before the planned change was carried out */
  function planBase(R){if(!base||base.R!==R)base={R:R,col:snap(D.init(R)).col};return base.col;}
  function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();}
  /* a mark is Ink with a white keyline, so that it holds on a light part and on a dark one */
  function ink(c,wd,dash){
    c.lineJoin='miter';c.lineCap='butt';c.setLineDash([]);
    c.strokeStyle='#ffffff';c.lineWidth=wd+0.03;c.stroke();
    if(dash)c.setLineDash(dash);
    c.strokeStyle=K.css(pal.ink);c.lineWidth=wd;c.stroke();c.setLineDash([]);
  }
  function corners(c,r,g,L){
    var x0=r[0]-g,y0=r[1]-g,x1=r[0]+r[2]+g,y1=r[1]+r[3]+g;L=Math.min(L,(y1-y0)/2-0.01);
    c.beginPath();
    c.moveTo(x0,y0+L);c.lineTo(x0,y0);c.lineTo(x0+L,y0);
    c.moveTo(x1-L,y0);c.lineTo(x1,y0);c.lineTo(x1,y0+L);
    c.moveTo(x1,y1-L);c.lineTo(x1,y1);c.lineTo(x1-L,y1);
    c.moveTo(x0+L,y1);c.lineTo(x0,y1);c.lineTo(x0,y1-L);
  }
  function frame(c,r,g){c.beginPath();c.rect(r[0]-g,r[1]-g,r[2]+2*g,r[3]+2*g);}
  /* the label is as wide as its word in the typeface that has arrived: what answers for it follows */
  function setLab(w){
    LAB[2]=w;LAB[0]=BTN[0]+BTN[2]/2-w/2;
    if(Math.abs(w-labW)<0.004)return;
    labW=w;
    mon.forEach(function(s){var h=s.hits[4];if(h){h.scale.x=w/h.geometry.parameters.width;h.position.x=s.x0+LAB[0]+w/2;}});
  }
  /* The picture on a monitor. H: what the monitors showed before the change that is under way, for a monitor that has
     not been redrawn yet. clip: the part of the sheet that is drawn, [x,y,w,h]. */
  function face(c,s,H,clip){
    var st=cur.st,R=cur.R,plan=!!R.plan,css=K.css,px=1/RES,col=[];
    D.COMPS.forEach(function(cn){col.push(H?H.col[s.key+':'+cn]:D.shown(st,s.plat,s.mode,cn));});
    var inview=round&&!plan&&st.mon===s.key,marked=plan&&st.pred&&st.pred.mons[s.key];
    var dark=col[0]?TB.tw.lum(col[0])<0.2:false,faint=css(dark?pal.mist:pal.slate),was=plan&&st.ran?planBase(R):null;
    c.save();
    c.setTransform(RES,0,0,RES,0,0);c.setLineDash([]);
    if(clip){c.beginPath();c.rect(clip[0],clip[1],clip[2],clip[3]);c.clip();}
    /* the frame: the strip that names the monitor */
    c.fillStyle=css(pal.chip);c.fillRect(0,0,MW,MS);
    c.fillStyle=css(pal.surface);c.fillRect(0,MS,MW,MH-MS);
    c.fillStyle=css(pal.borderStrong);c.fillRect(0,MS-px,MW,px);
    /* the card */
    rr(c,CARD[0],CARD[1],CARD[2],CARD[3],0.08);
    if(col[0]){c.fillStyle=col[0];c.fill();c.lineWidth=px;c.strokeStyle=css(pal.borderStrong);c.stroke();}
    else{c.lineWidth=1.5*px;c.strokeStyle=faint;c.stroke();}
    /* its title and its link: a part with no colour is an outline */
    function bar(r,hx){if(hx){c.fillStyle=hx;c.fillRect(r[0],r[1],r[2],r[3]);}else{c.lineWidth=1.5*px;c.strokeStyle=faint;c.strokeRect(r[0],r[1],r[2],r[3]);}}
    bar(TITLE,col[1]);
    bar([LINK[0],LINK[1],LINK[2],0.1],col[2]);
    if(col[2]){c.fillStyle=col[2];c.fillRect(LINK[0],LINK[1]+0.14,LINK[2],0.025);}
    /* the button */
    rr(c,BTN[0],BTN[1],BTN[2],BTN[3],0.07);
    if(col[3]){c.fillStyle=col[3];c.fill();}else{c.lineWidth=1.5*px;c.strokeStyle=faint;c.stroke();}
    /* type is set in pixels */
    c.setTransform(1,0,0,1,0,0);c.textBaseline='middle';c.textAlign='left';
    c.font='600 '+(0.2*RES)+'px '+K.FACE;c.fillStyle=css(inview||marked?pal.ink:pal.slate);
    c.fillText(monName(s),0.12*RES,(MS/2+0.01)*RES);
    var word=TB.t('s6.send')+' →',bx=(BTN[0]+BTN[2]/2)*RES,by=(BTN[1]+BTN[3]/2+0.01)*RES;
    c.font='400 '+(LS*RES)+'px '+K.FACE;c.textAlign='center';
    setLab(c.measureText(word).width/RES);
    if(col[4]){c.fillStyle=col[4];c.fillText(word,bx,by);}
    else{c.lineWidth=1.5;c.strokeStyle=faint;c.strokeText(word,bx,by);}
    c.setTransform(RES,0,0,RES,0,0);
    /* the selected part: its way down to the build unit is a tube filled with what the monitor shows, empty when it shows nothing */
    var tr=scene.trace;
    if(tr&&tr.key===s.key&&round){
      var r=partRect(tr.ci),x=TRX[tr.ci],yb=r[1]+r[3];
      c.fillStyle=col[tr.ci]||css(pal.surface);c.fillRect(x-PR,yb,2*PR,MH-yb);
      c.beginPath();c.moveTo(x-PR,MH);c.lineTo(x-PR,yb);c.lineTo(x+PR,yb);c.lineTo(x+PR,MH);ink(c,0.012);
    }
    /* marks on the parts */
    var hp=hov&&hov.indexOf('mp:'+s.key+':')===0?+hov.slice(hov.length-1):-1;
    D.COMPS.forEach(function(cn,ci){
      var r=partRect(ci),g=ci===0?0.04:0.05,cell=s.key+':'+cn;
      if(hp===ci&&live()){frame(c,r,g);ink(c,0.01);}
      /* selected: a frame */
      if(round&&!plan&&inview&&st.sel==='m:'+cn){frame(c,r,g);ink(c,0.02);}
      /* predicted: a dashed frame in Ink where the part and its monitor are both marked. On a monitor that is not marked the
         part only carries a thin outline at rest: it has been named, and nothing is predicted there. */
      if(plan&&st.pred&&st.pred.parts[cn]){
        frame(c,r,g);
        if(marked)ink(c,0.02,[0.07,0.05]);
        else{c.setLineDash([0.07,0.05]);c.lineWidth=0.008;c.strokeStyle=faint;c.stroke();c.setLineDash([]);}
      }
      /* four corner marks: the part differs from the design. In the prediction the design is what the monitors showed
         before the change: the marks say which parts the change reached. They sit on the corners of the part itself,
         inside any frame around it: a frame says what was selected or predicted, the marks what is so. */
      if(plan?(!!was&&col[ci]!==was[cell]):(col[ci]!==D.expected(s.mode,cn))){corners(c,r,0.012,0.13);ink(c,0.034);}
    });
    /* a colour written by hand in the platform's code: the literal value, on the part. Only while the platform's unit is looked at. */
    var hard=H?H.hard:st.hard;
    if(scene.hand===s.plat&&round)D.COMPS.forEach(function(cn,ci){
      var hx=hard[s.plat+':'+cn];if(hx===undefined)return;
      var r=partRect(ci),w=0.8,h=0.24,x,y;
      if(ci===0){x=r[0]+r[2]-w-0.06;y=r[1]+r[3]-h-0.06;}
      else if(ci>=3){x=BTN[0]+BTN[2]+0.06;y=ci===3?BTN[1]-0.01:BTN[1]+BTN[3]-h+0.01;}
      else{x=r[0]+r[2]-0.5;y=r[1]+r[3]/2-h/2;}
      c.fillStyle=css(pal.surface);c.fillRect(x,y,w,h);c.lineWidth=1.5*px;c.strokeStyle=css(pal.ink);c.strokeRect(x,y,w,h);
      c.setTransform(1,0,0,1,0,0);c.font='500 '+(0.165*RES)+'px '+MONO;c.textAlign='center';c.textBaseline='middle';c.fillStyle=css(pal.ink);
      c.fillText(hx,(x+w/2)*RES,(y+h/2+0.008)*RES);
      c.setTransform(RES,0,0,RES,0,0);
    });
    c.restore();
  }
  /* A monitor is redrawn from below, from the unit it stands on: under the line it shows the new output, above it still the old. */
  function drawMon(s){
    if(!cur)return;
    var c=s.tex.image.getContext('2d'),H=hold&&hold.on[s.key]?hold:null,y;
    if(H&&s.wipe!==null){
      y=MS+(MH-MS)*(1-s.wipe);
      face(c,s,H,[0,0,MW,y]);
      face(c,s,null,[0,y,MW,MH-y]);
      c.setTransform(RES,0,0,RES,0,0);c.fillStyle=K.css(pal.ink);c.fillRect(0,y-0.008,MW,0.016);
    }else face(c,s,H,null);
    s.tex.needsUpdate=true;
  }
  function paintMons(){mon.forEach(drawMon);}

  /* everything, from the state as it is */
  function paint(){
    if(!group||!cur)return;
    scene=chainOf(cur.st,cur.R);
    restUnits();paintBlocks();layChain();paintMons();setHits();
  }

  /* ---------- a sequence: steps that follow each other, on one clock ---------- */
  function click(n){try{TB.audio.play(n);}catch(e){}}
  function seqNew(){tl={t:0,ev:[]};}
  /* a step: run(k,u) while it lasts (k eased, u as time goes), start() when it begins, end() when it is over */
  function step(d,run,start,end){tl.ev.push({t:tl.t,d:d,run:run||null,start:start||null,end:end||null,s:0});tl.t+=d;}
  /* The steps are played in order, never two at a time, and fitted to the time the whole may take. */
  function play(budget,fin){
    var ev=tl.ev,total=tl.t;
    if(!ev.length||total<=0){fin();return;}
    seqOn=true;
    K.run(Math.min(total,budget),function(k){
      var t=k*total,i,e,u;
      for(i=0;i<ev.length;i++){
        e=ev[i];if(e.s===2)continue;
        if(t<e.t&&k<1)break;
        if(e.s===0){e.s=1;if(e.start)e.start();}
        u=k>=1||e.d<=0?1:Math.min(1,(t-e.t)/e.d);
        if(e.run)e.run(K.ease(u),u);
        if(u<1)break;
        e.s=2;if(e.end)e.end();
      }
    },fin,AN);
  }
  /* a sequence is cut: the timers stop, and what is drawn next is the state */
  function stop(){K.clear(AN);K.clear(FLT);K.clear(TD);seqOn=false;hold=null;flashSlip=null;}
  function tellDone(){if(!owe)return;owe=false;if(ctx0&&ctx0.notify)ctx0.notify('opDone');}
  /* a sequence is over: the picture is the state again, and a solved round is reported, once */
  function end(){seqOn=false;hold=null;paint();if(owe)K.after(TELL,tellDone,TD);}

  /* ---------- a reference is moved in the rack ---------- */
  function item(kind,test){for(var i=0;i<scene.items.length;i++)if(scene.items[i].kind===kind&&test(scene.items[i]))return scene.items[i];return null;}
  /* The colour draws back to where the pipe starts, the loose end is lifted, carried over and set down, and the other
     colour rises. pts(x,lift) gives the pipe with its loose end at x; l0: the end is already in the air. */
  function moveSteps(it,pts,x0,x1,l0,hNew){
    var L=plen(it.pts),L2=plen(pts(x1,0));
    if(it.hex!==null&&L>0.01)step(0.3,function(k){it.d=L*(1-k);layChain();},null,function(){it.d=0;layChain();});
    if(!l0)step(0.2,function(k){it.pts=pts(x0,k);layChain();},function(){it.d=0;click('remove');});
    step(Math.min(0.7,0.25+Math.abs(x1-x0)*0.05),function(k){it.pts=pts(x0+(x1-x0)*k,1);layChain();},l0?function(){click('remove');}:null);
    step(0.2,function(k){it.pts=pts(x1,1-k);layChain();},null,function(){it.pts=pts(x1,0);it.hex=hNew;it.d=0;layChain();click('place');});
    if(hNew!==null)step(0.35,function(k){it.d=L2*k;layChain();},null,function(){delete it.d;layChain();});
    else step(0,null,null,function(){delete it.d;layChain();});
  }
  /* A role's reference in a mode is moved to another primitive. It is carried out where it can be seen: while the role is looked at. */
  function footSteps(before,sem,mode){
    var it=item('foot',function(i){return i.sem===sem&&i.mode===mode;});
    var po=before.sem[sem]?before.sem[sem][mode]:null,pn=cur.st.sem[sem]?cur.st.sem[sem][mode]:null;
    if(!it||!po||!pn||po===pn)return;
    var si=D.SEMS.indexOf(sem),x0=footX(D.PRIMS.indexOf(po),mode),x1=footX(D.PRIMS.indexOf(pn),mode),hNew=it.hex;
    function pts(x,l){return P1(si,mode,x,l);}
    it.pts=pts(x0,0);it.hex=num(D.P[po]);layChain();
    moveSteps(it,pts,x0,x1,0,hNew);
  }
  /* A component's reference is moved to another role. */
  function compSteps(before,c){
    var it=item('ref',function(i){return i.comp===c;}),so=before.comp[c],sn=cur.st.comp[c];
    if(!it||so===undefined||so===sn)return;
    var ci=D.COMPS.indexOf(c),oi=D.SEMS.indexOf(so),ni=D.SEMS.indexOf(sn);
    if(ni<0)return;
    /* from a role that does not exist the pipe ended in air under its block: it is carried from there */
    var x0=oi<0?CX(ci):SX(oi),x1=SX(ni),l0=oi<0?1:0,hNew=it.hex;
    function pts(x,l){return P2(ci,x,l);}
    it.pts=pts(x0,l0);it.hex=oi<0||hNew===null?null:num(D.resolve(before,c,vmode()));layChain();
    moveSteps(it,pts,x0,x1,l0,hNew);
  }

  /* ---------- a build runs ---------- */
  function monsOf(p){return mon.filter(function(s){return s.plat===p;});}
  /* until a monitor has been redrawn it shows what it showed before */
  function keep(before,plats){
    hold=snap(before);
    plats.forEach(function(p){monsOf(p).forEach(function(s){hold.on[s.key]=1;});});
    paintMons();
  }
  /* a monitor is redrawn from below */
  function wipeSteps(s,first){
    step(WIPE,function(k){s.wipe=k;drawMon(s);},function(){s.run=true;s.wipe=0;paintBlocks();if(first)click('pick');},function(){
      s.wipe=null;s.run=false;if(hold)delete hold.on[s.key];
      drawMon(s);paintBlocks();
    });
  }
  /* One unit builds. The parcel goes along the steps, one at a time. Then it goes down into the unit, a fresh crate comes
     out of the front and pushes the crate that stood there off: first out of its place, then off the unit. Then the two
     monitors are redrawn. What a hand fixed in the platform's code is not in the crate: the slip stands through all of it,
     and the part it fixes comes out of the redrawing as it went in. opt.rise: the parcel has to come up through the port first. */
  function unitSteps(o,opt){
    var x0=o.xl+IX,ms=monsOf(o.plat);
    if(opt.rise)step(RISE,function(k){parcelAt(o,x0,k);},function(){o.parcel.visible=true;});
    [0,1,2,3].forEach(function(i){
      step(HOP,function(k){var a=i?o.xl+o.sx[i-1]:x0,b=o.xl+o.sx[i];parcelAt(o,a+(b-a)*k,1);},function(){
        o.run=true;o.at=i;setSteps(o);o.parcel.visible=true;paintBlocks();
      });
    });
    step(SWAP,function(k,u){
      /* the fresh crate comes out and pushes the old one out of its place; the old one goes on, off the unit, and at
         the end of its way it lies down to an outline */
      var f=K.ease(Math.min(1,u/0.4)),g=K.ease(Math.max(0,(u-0.4)/0.6)),h=1-K.ease(Math.max(0,(u-0.8)/0.2)),d=CRD*f+OFF*g;
      parcelAt(o,o.xl+o.sx[3],1-Math.min(1,u/0.25));o.parcel.visible=u<0.25;
      o.crate.visible=f>0.02;o.crate.scale.z=Math.max(0.001,f);o.crate.position.z=ZF+CRD*f/2;
      pushed(o.old,ZF+CRD/2,d,h);o.old.label.visible=!far&&h>0.6;
    },function(){
      o.at=4;setSteps(o);
      /* the crate that stood there is the old one from now on: set aside */
      seat(o.old);o.old.setEdge(pal.borderStrong);o.crate.visible=false;
    },function(){
      o.parcel.visible=false;o.old.visible=false;seat(o.crate);
      click('place');
    });
    ms.forEach(function(s,i){if(i)step(0.05);wipeSteps(s,!i);});
    step(0,null,null,function(){o.run=false;o.at=-1;setSteps(o);paintBlocks();});
  }
  /* After a change in the source: a parcel comes up through the port of every unit that follows it, and they build one
     after the other. A unit whose output is already older than the source does not: its parcel stands where it stood. */
  function autoSteps(before){
    var st=cur.st,U=unit.filter(function(o){return !st.stale[o.plat];});
    if(!U.length)return;
    keep(before,U.map(function(o){return o.plat;}));
    step(RISE,function(k){U.forEach(function(o){parcelAt(o,o.xl+IX,k);});},function(){U.forEach(function(o){o.parcel.visible=true;});});
    U.forEach(function(o){unitSteps(o,{});});
  }
  /* The build of one platform is run by its key. Nothing in the rack moves, and nothing a hand wrote. */
  function keySteps(before,plat){
    var o=unit[D.PLATS.indexOf(plat)];
    if(!o)return;
    keep(before,[plat]);
    /* as it stood before: the parcel on the port */
    if(before.stale[plat]){o.parcel.visible=true;parcelAt(o,o.xl+IX,1);}
    o.down=true;paintBlocks();K.after(0.14,function(){o.down=false;if(cur)paintBlocks();},AN);
    unitSteps(o,{rise:!before.stale[plat]});
  }
  /* A colour is fixed by hand in the code of a platform, or taken out again. No build runs: it is not in the source and
     not in the output. The slip is there, or gone, at once, and the platform's two monitors are redrawn. */
  function handSteps(before,plat,wrote){
    if(D.PLATS.indexOf(plat)<0)return;
    keep(before,[plat]);
    if(wrote){flashSlip=plat;paintBlocks();K.after(1.2,function(){flashSlip=null;if(cur)paintBlocks();},FLT);}
    monsOf(plat).forEach(function(s,i){if(i)step(0.05);wipeSteps(s,!i);});
  }

  /* ---------- events ---------- */
  function toRest(){
    stop();
    round=false;settled=false;busy=false;owe=false;hov=null;
    var r=TB.tw.restState(5,doneLit);
    cur=r?{R:r.R,st:r.st}:null;prev=cur?TB.tw.clone(cur.st):null;
    paint();
  }
  function onRound(data){
    var R=data&&data.R,r=data&&data.r,S=TB.state;
    if(!R||R.type!=='op'||R.kind!=='diag'||!r||!r.st){toRest();return;}
    stop();
    round=true;settled=false;busy=!!r.busy;owe=false;
    cur={R:R,st:r.st};prev=TB.tw.clone(r.st);
    paint();
    /* presented again while the plant was working (a change of language): the result is in place, say so */
    if(busy&&!(S&&S.ans)){owe=true;K.after(0.2,tellDone,TD);}
  }
  function onOp(data){
    if(!round||!data||!data.st||!cur)return;
    stop();
    var before=prev,res=data.res||{},fx=res.fx||{},id=String(data.id),q=id.split(':'),R=data.R||cur.R,pl=R.plan;
    cur={R:R,st:data.st};prev=TB.tw.clone(data.st);
    if(res.solved){busy=true;owe=true;}
    /* the state as it is now. A sequence is laid over it: what was there before, and how it became this. */
    paint();
    seqNew();
    /* the round as it was handed out is there at once, and so is everything while the plant is far away */
    if(before&&!far&&!fx.reset){
      if(id==='run'&&pl){
        /* the planned change is made in the rack, and the builds carry it to the monitors */
        if(pl[0]==='c')compSteps(before,pl[1]);else footSteps(before,pl[1],pl[2]);
        autoSteps(before);
      }else if(q[0]==='r'&&fx.repair){
        /* r:s:<role>:<mode>:<primitive>, r:c:<component>:<role>, r:b:<platform>, r:x / r:u:<platform>:<component> */
        if(q[1]==='s'){footSteps(before,q[2],q[3]);autoSteps(before);}
        else if(q[1]==='c'){compSteps(before,q[2]);autoSteps(before);}
        else if(q[1]==='b')keySteps(before,q[2]);
        else if(q[1]==='x'||q[1]==='u')handSteps(before,q[2],q[1]==='x');
      }
    }
    play(res.solved?T_SOLVE:T_MISS,end);
  }
  /* The key of a platform that is up to date: not an action in the logic. The unit takes the source and builds, the crate
     is replaced by one that says the same, and the monitors are redrawn as they were: also the part a hand has fixed. */
  function runLocal(plat){
    stop();paint();seqNew();
    keySteps(TB.tw.clone(cur.st),plat);
    play(T_MISS,end);
  }
  function onPick(id){
    if(!id||!cur||!live()||!ctx0.notify)return;
    var st=cur.st,R=cur.R,q=id.split(':'),n,key,x;
    function op(x){ctx0.notify('op',{id:x});}
    if(R.plan){
      if(q[0]==='mp')op('pp:'+D.COMPS[+q[3]]);
      else if(q[0]==='mf')op('pm:'+q[1]+':'+q[2]);
      else if(q[0]==='c')op('pp:'+D.COMPS[+q[1]]);
      else if(id==='run')op('run');
      return;
    }
    x=st.sel?st.sel.slice(2):'';
    if(q[0]==='mp'){
      /* a part on another monitor: look at that monitor first, then at the part */
      key=q[1]+':'+q[2];n=D.COMPS[+q[3]];
      if(st.mon!==key){op('mon:'+key);if(cur.st.sel!=='m:'+n)op('sel:m:'+n);}
      else op('sel:m:'+n);
    }
    else if(q[0]==='mf'){if(st.mon!==q[1]+':'+q[2])op('mon:'+q[1]+':'+q[2]);}
    else if(q[0]==='c')op('sel:c:'+D.COMPS[+q[1]]);

      if(q[2]!==vmode())op('mon:'+vplat()+':'+q[2]);

    else if(q[0]==='p'){
      /* with a role selected, an ingot is where its reference in the mode in view is moved to */
      n=D.PRIMS[+q[1]];

    }
  };
})();
})();

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function md(s){return esc(s).replace(/`([^`]+)`/g,function(m,c){return TB.tw.code(c);});}

function range(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a;}
function lum(hex){var n=parseInt(hex.slice(1),16);var c=[n>>16&255,n>>8&255,n&255].map(function(v){v/=255;return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}

function wireChecks(sem,teal){
  var out=[];
  ['light','dark'].forEach(function(m){
    function v(k){return PR[sem[k][m]];}
    out.push({m:m,key:'text',label:T('wire.on','text/primary','bg/page'),r:ratio(v('text/primary'),v('bg/page')),min:4.5});
    out.push({m:m,key:'muted',label:T('wire.on','text/muted','bg/page'),r:ratio(v('text/muted'),v('bg/page')),min:4.5});
    out.push({m:m,key:'action',label:T('wire.against','action/primary','bg/page'),r:ratio(v('action/primary'),v('bg/page')),min:3});
    out.push({m:m,key:'onaction',label:T('wire.on','text/on-action','action/primary'),r:ratio(v('text/on-action'),v('action/primary')),min:4.5});
    if(teal)out.push({m:m,key:'teal',label:T('wire.isTeal','action/primary'),flag:sem['action/primary'][m].indexOf('teal/')===0});
  });
  out.forEach(function(c){c.pass=('flag' in c)?c.flag:c.r>=c.min;});
  return out;
}
function wireChanges(sem,start){var n=0;SEM.forEach(function(t){['light','dark'].forEach(function(m){if(sem[t][m]!==start[t][m])n++;});});return n;}

}
function begin(){if(S.view!=='intro')return;S.view='play';initRound();render(true);}
function startTraining(){
  var pool=[];LEVELS.forEach(function(L){L.rounds.forEach(function(R){if(isCard(R))pool.push(R);});});
  pool=shuffle(pool).sort(function(a,b){var x=box(a.id),y=box(b.id);return (x===null?0.5:x)-(y===null?0.5:y);}).slice(0,10);
  pool=shuffle(pool);
  S.run={mode:'train',li:pool[0].li,queue:pool.map(function(R){return {R:R,kind:'train'};}),qi:0,score:0,total:pool.length,hist:[],retries:{},right:0};
  S.view='play';S.streak=0;initRound();render(true);
}

function initRound(){
  var e=ent(),R=e.R;S.ans=null;S.focus=null;
  var station=S.run.mode==='train'?R.li:S.run.li;S.run.station=station;
  W.goto('station',station);
  if(R.type==='pick')S.r={order:R.fixed?range(R.options.length):shuffle(range(R.options.length)),chosen:null,tried:[],hint:null};
  else if(R.type==='repoint')S.r={ref:R.from,busy:false};
  else if(R.type==='op')S.r={st:OPS[R.kind].init(R),misses:0,hint:null,hintArgs:[],busy:false};
  else if(R.type==='label')S.r={assign:R.segs.map(function(){return null;}),active:0};
  else if(R.type==='build')S.r={pool:shuffle(range(R.chips.length)),picked:[]};
  else if(R.type==='spot')S.r={chosen:null};
  else if(R.type==='order'){var a;do{a=shuffle(range(R.items.length));}while(a.every(function(v,i){return v===i;}));S.r={pool:a,seq:[]};}
  else if(R.type==='wire')S.r={sem:clone(R.start),mode:'dark',sel:null};
  worldMode(R.type==='wire'?S.r.mode:'dark');

}
function worldMode(m){if(S.wmode===m)return;S.wmode=m;W.setMode(m);}
function settle(ok,id,first){
  var e=ent(),R=e.R,run=S.run,good=first===undefined?ok:(ok&&first),card=isCard(R)||R.type==='wire',scored=card||R.type==='op';
  S.ans={ok:ok,first:good,requeued:false};run.hist[run.qi]=good;
  /* a card answered with the reference open counts as right, but stays early in the training queue */
  if(card){var it=S.items[R.id]||{box:0,seen:0};it.seen++;it.box=good?(S.r&&S.r.helped?Math.min(1,it.box+1):Math.min(3,it.box+1)):0;S.items[R.id]=it;}
  if(good){if(scored){S.streak++;if(e.kind==='main'||e.kind==='train'){run.score++;}run.right++;}}
  else if(ok){S.streak=0;}
  else{S.streak=0;
    var n=run.retries[R.id]||0;
    if(R.type!=='wire'&&n<2){run.retries[R.id]=n+1;run.queue.splice(Math.min(run.qi+4,run.queue.length),0,{R:R,kind:'retry'});S.ans.requeued=true;}
  }
  save();
  try{TB.moth.setGlow(Math.min(1,S.streak/6));}catch(x){}
  if(run.mode==='level'&&!S.done[LEVELS[run.li].id])W.setLit(run.li,Math.min(0.9,run.score/run.total));
  var stamp=run.qi;
  function show(){if(S.run!==run||run.qi!==stamp)return;syncWorld();W.result(ok,id);sfx(ok?'right':'wrong');}
  if(id&&W.ok&&!S.fast)W.flyTo(id,show);else later(show,120);
}
var demoT=0;
function endDemo(){clearTimeout(demoT);if(!S.demo)return;S.demo=false;if(S.view==='done')render(true);}
function next(){
  var run=S.run;
  if(run.qi+1<run.queue.length){run.qi++;initRound();render(true);return;}
  W.clearTargets();W.setChain(null);
  if(run.mode==='level'){
    var L=LEVELS[run.li],prev=S.done[L.id];
    S.done[L.id]={score:run.score,total:run.total,best:Math.max(run.score,prev?prev.best||prev.score:0)};
    W.setLit(run.li,1);W.celebrate(run.li);
    /* a model with a demonstration shows what the layers do together before the summary appears.
       Level 1 has none: its two chains were built and seen by the player, and the finished model is there to be inspected. */
    var rp=repointOf(L);
    S.chain=null;S.split=true;S.ref=rp?rp.to:null;S.demo=!S.fast&&W.hasDemo(run.li);clearTimeout(demoT);if(S.demo)demoT=setTimeout(endDemo,26000);
    if(LEVELS.every(function(l){return S.done[l.id];}))W.broadcast('finale',{instant:false});
  }
  /* no fanfare when the plant is about to demonstrate itself: its own relays are the sound */
  worldMode('dark');save();sfx(S.demo?'ui':'level');S.view='done';render(true);
}

function present(){
  var R=cr(),r=S.r;
  if(R.type==='pick'){
    var short=R.options.every(function(o){return plain(o).length<=18;});
    W.setTargets(r.order.map(function(oi,pos){
      var o=plain(R.options[oi]);
      return {id:'o'+oi,tag:R.fixed?null:TAGS.charAt(pos),text:(R.fixed||short)?o:null,color:R.fixed?tierColor(oi):undefined,mono:/^[\w$\-.{}\/ ]+$/.test(o)&&!R.fixed};}),{layout:R.fixed?'tiers':'arc'});
    W.setChain(R.tok?[{text:R.tok,sub:R.val||null}]:null);
  }else if(R.type==='label'){
    W.setTargets(R.choices.map(function(c){return {id:'lv:'+c,text:c,mono:true,color:TB.cfg.groupColor[GROUP[c]]};}),{layout:'arc'});
  }else if(R.type==='build'){

  }else if(R.type==='order'){
    W.setTargets(r.pool.map(function(ii,pos){return {id:'it'+ii,tag:TAGS.charAt(pos)};}),{layout:'scatter'});
  }else{W.clearTargets();W.setChain(null);}
  W.emit('round',{R:R,r:r,kind:ent().kind,mode:S.run.mode});

}
function syncWorld(){
  if(!W.ok||S.view!=='play')return;
  var R=cr(),r=S.r,a=S.ans;
  if(R.type==='pick'){
    var right=R.fixed?R.answer:0;
    r.order.forEach(function(oi){W.mark('o'+oi,a?(oi===right?'right':(r.chosen===oi?'wrong':'dim')):(r.tried.indexOf(oi)>-1?'wrong':'idle'));});
  }else if(R.type==='label'){
    W.setChain(R.segs.map(function(s,i){var as=r.assign[i];
      return {text:s[0],sub:a?s[1]:(as||'?'),color:as?TB.cfg.groupColor[GROUP[as]]:undefined,state:a?(as===s[1]?'right':'wrong'):(r.active===i?'active':'idle')};}));
    R.choices.forEach(function(c){W.mark('lv:'+c,a?'dim':'idle');});
  }else if(R.type==='build'){
    var segs=r.picked.map(function(ci){var g=R.chips[ci][1];return {text:R.chips[ci][0],color:g?undefined:undefined,state:a?(a.ok?'right':'wrong'):'idle'};});
    if(a&&!a.ok)segs=R.canon.split('-').length?canonSegs(R):segs;
    W.setChain(segs.length?segs:[{text:'…',state:'idle'}]);
    r.pool.forEach(function(ci){W.mark('c'+ci,a?'dim':(r.picked.indexOf(ci)>-1?'used':'idle'));});
  }else if(R.type==='order'){
    r.pool.forEach(function(ii){var p=r.seq.indexOf(ii);W.badge('it'+ii,a?String(ii+1):(p>-1?String(p+1):null));
      W.mark('it'+ii,a?(p===ii?'right':'wrong'):(p>-1?'active':'idle'));});
  }else if(R.type==='wire'){W.emit('wire',wireModel());}
  else if(R.type==='spot'){W.emit('spot',{R:R,chosen:r.chosen,done:!!a,ok:a&&a.ok});}
}

/* Tips. A round can carry a few, each more direct than the last. One arrives for every TIP_S seconds the round has stood
   unsolved, at the foot of the panel, where it moves nothing the player is about to press. The newest replaces the one before.
   The player can ask for the next one at once, and can turn off the ones that come by themselves (S.tipsOff, saved).
   What the tips say, in this order: the principle, the principle applied to this round, what to do. The last one is the
   action itself: it is named as that, and it never comes by itself. */
var TIP_S=30;
function tipsOf(){if(S.view!=='play'||!S.run)return null;var R=cr();return R.tips&&R.tips.length?R.tips:null;}
function tipHTML(){
  var tp=tipsOf(),r=S.r;if(!tp||S.ans||!r||!r.tip)return '';
  var n=Math.min(r.tip,tp.length);
  return '<div class="tip-h"><span class="label">'+T(n===tp.length&&n>1?'tip.label.last':'tip.label',n,tp.length)+'</span><button class="btn ghost sm" data-act="tip" data-fid="tip" aria-expanded="'+(r.tipShut?'false':'true')+'">'+T(r.tipShut?'tip.show':'tip.hide')+'</button></div>'+(r.tipShut?'':tipBody(tp,n)+(n<tp.length?'<div class="tip-n"><button class="helpbtn" data-act="tipnow" data-fid="tipnext">'+T(n>=tp.length-1?'tip.last':'tip.next')+'</button></div>':''));
}
/* the last tip is the action. Where a level can say what is left from here, it says that: the player may have changed more than the fault. */
function tipBody(tp,n){
  var R=cr(),o=OPS[R.kind],todo=n===tp.length&&R.type==='op'&&o&&o.todo?o.todo(R,S.r.st):null;
  if(!todo||!todo.length)return '<p>'+md(tp[n-1])+'</p>';
  if(todo.length===1)return '<p>'+md(todo[0])+'</p>';
  return '<p>'+T('tip.todo')+'</p><ul>'+todo.map(function(t){return '<li>'+md(t)+'</li>';}).join('')+'</ul>';
}
function tipBar(){var h=tipHTML();return '<div class="tipbar" id="tipbar" role="status"'+(h?'':' hidden')+'>'+h+'</div>';}
function tipNowText(){var tp=tipsOf();return T(tp&&tp.length>1&&S.r&&(S.r.tip||0)>=tp.length-1?'tip.last':'tip.now');}
function tipLeft(){var tp=tipsOf();return !!tp&&!S.ans&&!!S.r&&(S.r.tip||0)<tp.length;}
function tipCtl(){
  if(!tipsOf()||S.ans)return '';
  return '<button class="helpbtn" data-act="tipnow" data-fid="tipnow"'+(tipLeft()?'':' disabled')+'>'+tipNowText()+'</button>'+
    '<button class="helpbtn auto" data-act="tipauto" data-fid="tipauto" aria-pressed="'+(S.tipsOff?'false':'true')+'" aria-label="'+T('tip.auto.aria')+'">'+T(S.tipsOff?'tip.auto.off':'tip.auto.on')+'</button>';
}
function tipPaint(){
  var h=tipHTML(),el=document.getElementById('tipbar'),pop=document.getElementById('tippop');
  if(el){el.innerHTML=h;el.hidden=!h;}
  if(pop){pop.innerHTML=h?'<i class="tip-a" aria-hidden="true"></i>'+h:'';pop.hidden=!h;}
  var b=panel.querySelector('[data-fid="tipnow"]');if(b){b.disabled=!tipLeft();b.textContent=tipNowText();}
  tipPlace();

/* A tip stands beside the thing it is about. The first one is about the task. The later ones are about the next step that solves
   the round from where it stands now: the second points at the section that step is in, the last one at the control itself. */
function tipAnchor(){
  var tp=tipsOf(),r=S.r;if(!tp||!r||!r.tip||S.ans)return null;
  var n=Math.min(r.tip,tp.length),R=cr(),el=null,i,c,ids=[];
  if(n>=2&&R.type==='op'){
    try{ids=OPS[R.kind].solve(R,r.st)||[];}catch(e){ids=[];}
    for(i=0;i<ids.length&&!el;i++){
      if(ids[i]==='reset')continue;
      c=panel.querySelector('#stage [data-act="op"][data-arg="'+ids[i]+'"]');
      if(c&&!c.disabled&&c.getAttribute('aria-pressed')!=='true'&&!/is-on|is-sel|is-right/.test(c.className))el=c;
    }
    if(el&&n<tp.length){
      var sec=el.closest('.chips,.opts,.modes,.codebox')||el,lab=sec.previousElementSibling;
      return {el:lab&&/\blabel\b/.test(lab.className)?lab:sec,exact:false};
    }
  }

function tipWide(){var pop=document.getElementById('tippop');return !!pop&&getComputedStyle(pop).display!=='none';}
function tipPlace(){
  var pop=document.getElementById('tippop'),old=panel?panel.querySelectorAll('.tip-at'):[],i;
  for(i=0;i<old.length;i++)old[i].classList.remove('tip-at');
  if(!pop||pop.hidden||!panel||!gameEl)return;
  var a=tipAnchor();if(!a||!a.el)return;
  if(a.exact&&!S.r.tipShut)a.el.classList.add('tip-at');
  if(!tipWide())return;
  var g=gameEl.getBoundingClientRect(),p=panel.getBoundingClientRect(),r=a.el.getBoundingClientRect(),h=pop.offsetHeight;
  var seen=r.bottom>p.top+8&&r.top<p.bottom-8,y=seen?Math.max(p.top+16,Math.min(p.bottom-16,r.top+Math.min(r.height,44)/2)):null;
  var t=Math.max(p.top+12,Math.min(g.bottom-h-56,(y===null?p.top+16:y-26)));
  pop.style.left=Math.round(p.right-g.left+14)+'px';pop.style.top=Math.round(t-g.top)+'px';
  pop.classList.toggle('no-arrow',y===null);
  pop.style.setProperty('--ay',Math.round(y===null?0:Math.max(14,Math.min(h-14,y-t)))+'px');

/* a new tip arrives with a short move, so that it is noticed */
function tipFlash(){var pop=document.getElementById('tippop');if(!pop)return;pop.classList.remove('in');void pop.offsetWidth;pop.classList.add('in');}
function tipEl(fid){var l=document.querySelectorAll('[data-fid="'+fid+'"]'),i;for(i=0;i<l.length;i++)if(l[i].offsetParent!==null&&!l[i].disabled)return l[i];return null;}
/* the clock stands still while the plant is working, when the round is solved, and when nobody is looking */
function tipTick(sec){
  var tp=tipsOf(),r=S.r;
  if(S.tipsOff||!tp||S.ans||!r||r.busy||document.hidden||(r.tip||0)>=Math.max(1,tp.length-1))return;
  r.tipT=(r.tipT||0)+(sec||1);
  if(r.tipT<TIP_S)return;
  r.tipT=0;r.tip=(r.tip||0)+1;r.tipShut=false;tipPaint();tipFlash();

/* The last sequence in the plant can be seen again: what a wrong action did, or how the round was solved. */
function canReplay(){
  if(!W.ok||S.view!=='play'||!S.run)return false;
  var R=cr(),r=S.r;
  if(R.type==='op')return !!r.last&&(!r.busy||!!S.ans);
  if(R.type==='pick'&&R.fixed&&R.retry)return !!S.ans||r.hint!==null;
  if(R.type==='repoint')return !!S.ans;
  return false;
}
function replay(){
  if(!canReplay())return;
  var R=cr(),r=S.r,e=ent(),k,head={R:R,kind:e.kind,mode:S.run.mode};
  sfx('ui');
  if(R.type==='op'){
    /* back to how the plant stood before the action, then the same action once more: the state ends where it was */
    var snap=JSON.parse(r.last.st),res;
    for(k in r.st)delete r.st[k];for(k in snap)r.st[k]=snap[k];
    head.r=r;W.emit('round',head);
    res=OPS[R.kind].act(R,r.st,r.last.id);
    r.replaying=!!(res&&res.solved);
    if(res)W.emit('op',{R:R,st:r.st,res:res,id:r.last.id});
  }else if(R.type==='pick'){
    head.r={order:r.order,chosen:null,tried:S.ans?r.tried.slice():r.tried.filter(function(t){return t!==r.hint;}),hint:null};
    W.emit('round',head);
    if(S.ans)W.result(true,'o'+R.answer);else W.emit('miss',{id:'o'+r.hint,ch:r.hint});
  }else if(R.type==='repoint'){
    head.r={ref:R.from,busy:false};W.emit('round',head);W.emit('repoint',{to:R.to});
  }
}
/* One round back. What the round being left and the one returned to had counted is taken back: they are played again. */
function back(){

  if(run.qi===0){if(LEVELS[run.li].intro)startLevel(run.li);return;}
  [run.qi,run.qi-1].forEach(function(q){
    var Rq=run.queue[q].R;
    if(run.hist[q]&&(isCard(Rq)||Rq.type==='wire'||Rq.type==='op')){run.score=Math.max(0,run.score-1);run.right=Math.max(0,run.right-1);}
    delete run.hist[q];

/* ---------- actions ---------- */
function act(a,arg){
  var i=+arg;
  try{TB.audio.unlock();}catch(e){}
  if(a==='sound'){S.muted=!S.muted;TB.audio.setMuted(S.muted);save();render(false);return;}
  if(a==='lang'){S.lang=I18N.lang==='da'?'en':'da';save();sfx('ui');I18N.set(S.lang);return;}
  if(a==='skipdemo'){if(S.view==='done'&&S.demo){W.emit('skip');endDemo();}return;}
  if(a==='chain'){if(S.view!=='done'||S.demo)return;S.chain=S.chain===i?null:i;if(S.chain!==null)S.split=true;sfx('ui');W.emit('inspect',{chain:S.chain});S.focus='chain'+i;render(false);return;}
  /* the finished model: the reference can be moved back and forth */
  if(a==='ref'){if(S.view!=='done'||S.demo||(i!==0&&i!==1)||S.ref===i)return;S.ref=i;S.chain=null;S.split=true;sfx('place');W.emit('inspect',{chain:null});W.emit('repoint',{to:i});S.focus='ref'+i;render(false);return;}
  if(a==='split'){if(S.view!=='done'||S.demo)return;S.split=!S.split;if(!S.split){S.chain=null;W.emit('inspect',{chain:null});}sfx('ui');W.emit('explode',{k:S.split?1:0});S.focus='split';render(false);return;}
  if(a==='map'){S.demo=false;S.view='title';worldMode('dark');W.goto('map');sfx('ui');render(true);return;}
  if(a==='sheet'){S.view='sheet';worldMode('dark');W.goto('map');render(true);return;}
  if(a==='go'){sfx('whoosh');startLevel(i);return;}
  if(a==='train'){sfx('whoosh');startTraining();return;}
  if(a==='retry'){startLevel(S.run.li);return;}
  if(a==='back'){back();return;}
  if(a==='replay'){replay();return;}
  if(a==='fold'){if(S.view!=='play'||!S.ans||!S.r)return;S.r.open=!S.r.open;sfx('ui');S.focus='fold';render(false);var fd=panel.querySelector('[data-fid="fold"]');if(fd)fd.focus({preventScroll:true});return;}
  if(a==='tipnow'){if(!tipLeft()||S.r.busy)return;S.r.tip=(S.r.tip||0)+1;S.r.tipT=0;S.r.tipShut=false;sfx('ui');tipPaint();tipFlash();
    /* asked for: bring the thing the tip is about into view */
    var ta=tipAnchor();if(ta&&ta.el&&ta.el.scrollIntoView){var tr=ta.el.getBoundingClientRect(),tpn=panel.getBoundingClientRect();if(tr.top<tpn.top+8||tr.bottom>tpn.bottom-8){ta.el.scrollIntoView({block:'center'});tipPlace();}}
    var tn=tipEl('tipnext')||tipEl('tip')||tipEl('tipnow');if(tn)tn.focus({preventScroll:true});return;}
  if(a==='tipauto'){S.tipsOff=!S.tipsOff;if(S.r)S.r.tipT=0;save();sfx('ui');S.focus='tipauto';render(false);return;}
  if(a==='tip'){if(S.view!=='play'||!S.r||!S.r.tip)return;S.r.tipShut=!S.r.tipShut;sfx('ui');tipPaint();var tb=tipEl('tip');if(tb)tb.focus({preventScroll:true});return;}
  if(a==='begin'){sfx('ui');begin();return;}
  if(S.view!=='play')return;
  if(a==='next'){if(S.ans)next();return;}
  var R=cr(),r=S.r;
  if(a==='mode'&&R.type==='wire'){r.mode=arg;worldMode(arg);sfx('ui');syncWorld();render(false);return;}
  if(S.ans)return;
  if(a==='help'){if(!R.help)return;r.help=!r.help;if(r.help)r.helped=true;sfx('ui');S.focus='help';}
  else if(a==='pick'&&R.type==='pick'){
    var want=R.fixed?R.answer:0;
    if(!(i>=0&&i<R.options.length)||r.tried.indexOf(i)>-1)return;
    if(R.retry&&i!==want){
      /* not here: the part stays loose, the layer is crossed out, and the player tries again */
      r.tried.push(i);r.hint=i;r.show=true;S.streak=0;sfx('wrong');W.emit('miss',{id:'o'+i,ch:i});
      for(var fp=0;fp<r.order.length;fp++)if(r.tried.indexOf(r.order[fp])<0){S.focus='o'+fp;break;}
    }else{r.chosen=i;sfx('pick');settle(i===want,'o'+i,R.retry?r.tried.length===0:undefined);}
  }
  else if(a==='repoint'&&R.type==='repoint'){
    if(r.busy||i!==R.to||r.ref===i)return;
    /* the explanation waits until the reference has been moved and the value has arrived */
    r.ref=i;r.busy=true;sfx('place');
    if(W.ok&&!S.fast){var stamp=S.run,q0=S.run.qi;W.emit('repoint',{to:i,tell:true});clearTimeout(repointT);repointT=setTimeout(function(){if(S.run===stamp&&S.run.qi===q0&&S.view==='play'&&!S.ans)W.emit('repoint',{to:i,instant:true});repointDone(stamp,q0);},20000);}
    else{render(false);repointDone(S.run,S.run.qi);return;}
  }
  else if(a==='op'&&R.type==='op'){
    if(r.busy)return;
    var was=JSON.stringify(r.st),res=OPS[R.kind].act(R,r.st,String(arg));if(!res)return;
    /* what can be replayed is what just happened: any later action, even a selection, puts it out of reach */
    r.last=res.miss||res.solved?{st:was,id:String(arg)}:null;
    if(res.miss){r.misses++;r.hint=res.miss===true?null:res.miss;r.hintArgs=res.args||[];r.keep=!!res.solved;S.streak=0;sfx('wrong');}
    else{if(res.solved||res.clear)r.hint=null;sfx(res.sfx||(res.solved?'place':'ui'));}
    S.focus='op-'+arg;if(res.miss&&res.miss!==true)r.show=true;
    /* the explanation waits until the plant has shown what the action did */
    if(res.solved)r.busy=true;
    W.emit('op',{R:R,st:r.st,res:res,id:String(arg)});
    if(res.solved){
      if(W.ok&&!S.fast&&W.hasOps(S.run.station)){var st0=S.run,qq=S.run.qi;clearTimeout(opT);opT=setTimeout(function(){opDone(st0,qq);},12000);}
      else{render(false);opDone(S.run,S.run.qi);return;}
    }
  }
  else if(a==='line'&&R.type==='spot'){r.chosen=i;sfx('pick');settle(R.bad.indexOf(i)>-1,null);}
  else if(a==='seg'&&R.type==='label'){r.active=i;sfx('ui');}
  else if(a==='lv'&&R.type==='label'){r.assign[r.active]=arg;sfx('place');W.flyTo('lv:'+arg);var n=r.assign.indexOf(null);if(n>-1){r.active=n;S.focus='seg'+n;}else S.focus='check';}
  else if(a==='chip'&&R.type==='build'){if(r.picked.indexOf(i)===-1){r.picked.push(i);sfx('place');W.flyTo('c'+i);}}
  else if(a==='unchip'&&R.type==='build'){r.picked.splice(i,1);sfx('remove');}
  else if(a==='ord'&&R.type==='order'){var p=r.seq.indexOf(i);if(p>-1){r.seq.splice(p,1);sfx('remove');}else{r.seq.push(i);sfx('place');W.flyTo('it'+i);}}
  else if(a==='check'){
    if(R.type==='label'){if(!r.assign.every(function(x){return x;}))return;settle(R.segs.every(function(s,k){return r.assign[k]===s[1];}),null);}
    else if(R.type==='order'){if(r.seq.length!==R.items.length)return;settle(r.seq.every(function(v,k){return v===k;}),null);}
    else if(R.type==='build'){
      if(!r.picked.length)return;
      var need=R.chips.filter(function(c){return c[1];}).length,ok=r.picked.length===need,last=-1;
      r.picked.forEach(function(ci){var g=R.chips[ci][1];if(!g){ok=false;return;}if(RANK[g]<last)ok=false;last=RANK[g];});
      settle(ok,null);
    }else return;
  }
  else if(a==='reset'&&R.type==='wire'){r.sem=clone(R.start);sfx('remove');}
  else if(a==='reveal'&&R.type==='wire'){r.sem=clone(R.sol);settle(false,null);}
  else return;
  render(false);if(!S.ans)syncWorld();
}
var repointT=0,opT=0;
function opDone(run,qi){
  clearTimeout(opT);
  if(S.view!=='play'||S.ans||(run&&(S.run!==run||S.run.qi!==qi)))return;
  var R=cr();if(R.type!=='op'||!S.r.busy)return;
  settle(true,null,S.r.misses===0);render(false);
}
function repointDone(run,qi){
  clearTimeout(repointT);
  if(S.view!=='play'||S.ans||(run&&(S.run!==run||S.run.qi!==qi)))return;
  var R=cr();if(R.type!=='repoint'||!S.r.busy)return;
  settle(true,null);render(false);
}
function fromWorld(id){
  if(S.view!=='play'||S.ans)return;
  if(id.charAt(0)==='o')act('pick',id.slice(1));
  else if(id.indexOf('lv:')===0)act('lv',id.slice(3));
  else if(id.charAt(0)==='c'){var ci=+id.slice(1);var p=S.r.picked?S.r.picked.indexOf(ci):-1;if(p>-1)act('unchip',p);else act('chip',ci);}
  else if(id.indexOf('it')===0)act('ord',id.slice(2));
}
function solve(){
  if(S.view!=='play'||S.ans)return;var R=cr(),r=S.r;
  if(R.type==='pick')act('pick',R.fixed?R.answer:0);
  else if(R.type==='repoint')act('repoint',R.to);
  else if(R.type==='op'){var ids=OPS[R.kind].solve(R,r.st),k;for(k=0;k<ids.length&&!S.ans;k++)act('op',ids[k]);}
  else if(R.type==='spot')act('line',R.bad[0]);
  else if(R.type==='label'){R.segs.forEach(function(s,i){act('seg',i);act('lv',s[1]);});act('check');}
  else if(R.type==='build'){R.chips.forEach(function(c,i){if(c[1])act('chip',i);});act('check');}
  else if(R.type==='order'){R.items.forEach(function(x,i){act('ord',i);});act('check');}
  else if(R.type==='wire'){SEM.forEach(function(t){['light','dark'].forEach(function(m){if(!S.ans&&r.sem[t][m]!==R.sol[t][m])wireSet(t,m,R.sol[t][m]);});});}
}

function boot(){
  panel=document.getElementById('panel');chainEl=document.getElementById('chain');gameEl=document.getElementById('game');sndBtn=document.getElementById('snd');
  langBtn=document.getElementById('lang');markBtn=document.getElementById('mark');
  load();TB.audio.setMuted(S.muted);
  /* saved choice first, otherwise the detected language; set() also lets the content follow before the world is built */
  I18N.set(S.lang||I18N.lang);gameEl.setAttribute('lang',I18N.lang);
  var ok=false;try{ok=!!(window.THREE&&W.init(document.getElementById('gl')));}catch(e){ok=false;if(window.console)console.warn('[TB] 3D could not start',e);}
  if(!ok)gameEl.className+=' no3d';
  W.onNotify=function(li,evt,data){
    if(evt==='demoEnd')endDemo();
    else if(evt==='op'){if(S.view==='play'&&!S.ans&&S.run&&li===S.run.station&&cr().type==='op'&&data)act('op',data.id);}
    else if(evt==='opDone'){if(S.view==='play'&&S.run&&li===S.run.station){if(S.ans&&S.r&&S.r.replaying){S.r.replaying=false;W.result(true,null);}else opDone(S.run,S.run.qi);}}
    else if(evt==='repointed'){if(S.view==='play'&&S.run)repointDone(S.run,S.run.qi);}
    else if(evt==='repoint'){var to=data&&data.to;if(S.view==='play'&&!S.ans&&cr().type==='repoint')act('repoint',to);else if(S.view==='done'&&!S.demo)act('ref',to);}
    else if(evt==='split'){var on=!!(data&&data.on);if(S.split!==on){S.split=on;if(S.view==='done'&&!S.demo)render(false);}}
    else if(evt==='inspect'&&S.view==='done'&&!S.demo){S.chain=data&&data.chain>=0?data.chain:null;if(S.chain!==null)S.split=true;render(false);}
  };
  W.onCam=viewfinder;viewfinder(null);
  W.onPick=fromWorld;W.onStation=function(i){act('go',i);};
  LEVELS.forEach(function(l,i){if(S.done[l.id])W.setLit(i,1,false);});
  if(LEVELS.every(function(l){return S.done[l.id];}))W.broadcast('finale',{instant:true});
  document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset.arg);});
  document.addEventListener('change',function(e){var s=e.target.closest('select[data-tok]');if(!s)return;wireSet(s.dataset.tok,s.dataset.mode,s.value);});
  document.addEventListener('keydown',function(e){
    var tag=e.target&&e.target.tagName;
    if(S.view==='intro'&&e.key==='Enter'&&tag!=='BUTTON'&&tag!=='A'){act('begin');return;}
    if(S.view!=='play'||e.metaKey||e.ctrlKey||e.altKey)return;
    if(tag==='SELECT')return;
    var R=cr();
    if(e.key==='Enter'&&tag!=='BUTTON'){if(S.ans)act('next');else act('check');return;}
    if(S.ans)return;
    if((e.key==='?'||e.key==='h'||e.key==='H')&&R.help){act('help');return;}
    var n=parseInt(e.key,10);
    if(!n){var k=TAGS.toLowerCase().indexOf(e.key.toLowerCase());if(k>-1&&e.key.length===1&&(R.type==='pick'||R.type==='order'))n=k+1;}
    if(!n)return;
    if(R.type==='pick'&&n<=S.r.order.length)act('pick',S.r.order[n-1]);
