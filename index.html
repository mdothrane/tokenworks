TB.content={CARDS:CARDS,SRC:SRC,TIERS:TIERS,GROUP:GROUP,RANK:RANK,PR:PR,SEM:SEM,SEMDESC:SEMDESC,P1:P1,P2:P2,START1:START1,SOL1:SOL1,SOL2:SOL2,LEVELS:LEVELS};

/* ---------- language: TB.content.setLang('da'|'en') ----------
   Swaps every player-visible text IN PLACE on the live objects above, so anything holding a reference to a level, a round,
   a card or the TIERS array sees the new language. The Danish text in this file is the original: it is snapshotted on the
   first call and restored from that snapshot. English comes from TB.contentEN (src/content.en.js). A field that is missing
   there, or an array whose length differs from the Danish one, stays Danish. Ids, order and answers never change. */
var DA=null;
var RSTR=['q','why','hint','ctx','done','srcNote'],RARR=['options','items','lines','code','tips'],LSTR=['title','does','from'],LARR=['intro','take'];
function str(v){return typeof v==='string'&&v!=='';}
function snapshot(){
  var d={tiers:TIERS.slice(),src:{},semdesc:{},cards:{},levels:[]},k;
  for(k in SRC)d.src[k]=SRC[k].n;
  for(k in SEMDESC)d.semdesc[k]=SEMDESC[k];
  for(k in CARDS)d.cards[k]={t:CARDS[k].t,p:CARDS[k].p.slice()};
  LEVELS.forEach(function(L){
    var l={place:L.place,rounds:[]};
    LSTR.forEach(function(f){l[f]=L[f];});
    LARR.forEach(function(f){l[f]=L[f].slice();});
    L.rounds.forEach(function(R){
      var r={};
      RSTR.forEach(function(f){if(typeof R[f]==='string')r[f]=R[f];});
      RARR.forEach(function(f){if(R[f]&&R[f]!==TIERS)r[f]=R[f].slice();});
      l.rounds.push(r);
    });
    d.levels.push(l);
  });
  return d;
}
/* write da (or en where it lines up) into the existing array dst, keeping the array object itself */
function fill(dst,da,en){
  var ok=!!en&&en.length===da.length,i;
  for(i=0;i<da.length;i++)dst[i]=(ok&&str(en[i]))?en[i]:da[i];
}
function setLang(lang){
  if(!DA)DA=snapshot();
  var E=(lang==='en'&&TB.contentEN)?TB.contentEN:{},k,i;
  var es=E.src||{},ed=E.semdesc||{},ec=E.cards||{},el=E.levels||{},ex=E.ctx||{},ep=E.places||[];
  fill(TIERS,DA.tiers,E.tiers);
  /* TB.cfg.tierColor is keyed by tier name: make the current names resolve to the same colours */
  var tc=TB.cfg&&TB.cfg.tierColor;
  if(tc)for(i=0;i<TIERS.length;i++)if(tc[DA.tiers[i]]!==undefined)tc[TIERS[i]]=tc[DA.tiers[i]];
  for(k in DA.src)SRC[k].n=str(es[k])?es[k]:DA.src[k];
  for(k in DA.semdesc)SEMDESC[k]=str(ed[k])?ed[k]:DA.semdesc[k];
  for(k in DA.cards){
    var c=ec[k]||{};
    CARDS[k].t=str(c.t)?c.t:DA.cards[k].t;
    fill(CARDS[k].p,DA.cards[k].p,c.p);
  }
  LEVELS.forEach(function(L,li){
    var d=DA.levels[li],e=el[L.id]||{},er=e.rounds||[];
    if(er.length!==L.rounds.length)er=[];
    L.place=str(ep[li])?ep[li]:d.place;
    LSTR.forEach(function(f){L[f]=str(e[f])?e[f]:d[f];});
    LARR.forEach(function(f){fill(L[f],d[f],e[f]);});
    L.rounds.forEach(function(R,ri){
      var dr=d.rounds[ri],r=er[ri]||{};
      RSTR.forEach(function(f){
        if(dr[f]===undefined)return;
        var v=f==='ctx'?ex[R.id]:r[f];
        R[f]=str(v)?v:dr[f];
      });
      RARR.forEach(function(f){if(dr[f])fill(R[f],dr[f],r[f]);});
    });
  });
  TB.content.lang=(lang==='en'&&TB.contentEN)?'en':'da';
}
TB.content.lang='da';
TB.content.setLang=setLang;
if(TB.i18n&&TB.i18n.on)TB.i18n.on(function(l){TB.content.setLang(l);});
})();

</script>
<script>/* content.en.js */
/* English text for TB.content. An overlay keyed like the Danish structure in content.js: levels by id, rounds by index (same order),
   cards by key, ctx by round id. Token names, code and everything inside backticks are identical to the Danish text.
   Translated faithfully from the Danish, which is checked against its sources. Do not edit facts here without re-checking the source.
   A field left out here stays Danish (see TB.content.setLang in content.js). */
(function(){
'use strict';
var TB=window.TB;
var Q_LAYER='Which layer does the token belong to?';
var Q_LABEL='Label the level of each segment';
var Q_BREAK='Find the line that breaks the format';
TB.contentEN={
  tiers:['Primitive','Semantic','Component'],
  places:['The Rack','The Lantern Bridge','The Runestone','The Twin Gates','The Works','The Lighthouse'],
  src:{
    news:'DTCG: first stable version (28 Oct 2025)',
    figma:'Figma Help: Modes for variables (import and export)',
    sdt:'Style Dictionary: Built-in transforms',
    sdf:'Style Dictionary: Formats',
    sdg:'Style Dictionary: Built-in transform groups',
    wcag:'WCAG 2.1: contrast requirements 1.4.3 and 1.4.11'
  },
  semdesc:{'bg/page':'Page background','text/primary':'Heading and body text','text/muted':'Muted text','action/primary':'Button background','text/on-action':'Text on the button'},
  levels:{
    lag:{title:'The layers',does:'Build two chains from value to interface, and move one reference.',from:'Andreas Kutschmann (martinfowler.com), Figma, and Nathan Curtis',
      intro:['A design token is a design decision stored as data. In this level every token has a name and a value.','Primitive tokens say which values exist. They are also called option tokens or base tokens.','Semantic tokens say how a value is used. They are also called decision tokens.','Component tokens say where in a specific component the decision applies.','You place six tokens on their layers. Tokens that point to each other form a chain. In the model the interface only changes when a chain has a token on all three layers.'],
      take:['Primitive is a value without a purpose: `blue-900`. Semantic is a purpose given to a value: `accent`. Component is the purpose applied in one specific place: `button.primary.background`. The interface is the result.','A reference is the connection between two tokens. A token that points to another only has a value when the chain of references ends in a raw value.','The role can get a new value without the component changing: `accent` can point to `grey-700` instead of `blue-900`, and `button.primary.background` still points to `accent`.','In a structure with several layers, primitive tokens are for reference only: they are not applied directly to the design. Semantic tokens and component tokens are. Their names show how and where the value should be used.','Two layers are a good place to start when the major design decisions are stable. A third layer makes later changes easier, but costs more tokens and more maintenance.','In this level only primitive tokens have a raw value. That is a convention, not a guarantee. Always read the name and the value together.'],
      rounds:[
        {q:Q_LAYER,why:'The name says which color it is and nothing about where it is used. The value is raw: a color code, not a reference. A value without a purpose is a primitive token.',srcNote:'In the article the token is written `color.options.blue-900`.'},
        {q:Q_LAYER,why:'The name says what the value is used for, not which color it is. The value is a reference to a primitive token. A purpose that has been given a value is a semantic token. No component uses it yet.',srcNote:'In the article: `color.decisions.accent` points to `{color.options.blue-900}`.'},
        {q:Q_LAYER,why:'The name mentions one specific component and one specific part of it. The value is a reference to the role `accent`. A purpose applied in one specific place is a component token. Now the component points to the role and the role points to the value, and that is why the button gets its color.',srcNote:'In the article: `button.primary.background` points to `{color.decisions.accent}`.'},
        {q:Q_LAYER,why:'Layers are not only about colors. The name says how large the space is and nothing about where it is used. The value is raw. This is a primitive token again.',srcNote:'Nathan Curtis calls tokens like this generic. His own example is `$esds-space-2-x` for 32 px.'},
        {q:Q_LAYER,why:'`inset` is the space between the edge of a surface and its content. The name says what the space is used for, not how large it is, and the value is a reference. That makes it a semantic token. `inset` is one example of a role name, not a standard.'},
        {q:Q_LAYER,why:'The name mentions a component and one of its properties, and the value is a reference to the role `inset`. That makes it a component token. Now `card.padding` points to `inset` and `inset` points to `space-32`, and that is why the card gets 32 px of padding. The structure is the same as for the color.'},
        {q:'Make `accent` point to `grey-700` instead of `blue-900`.',done:'One reference has changed. The component has not been touched.',why:'`accent` has the same name and the same role as before, and `button.primary.background` still points to `accent`. The button has changed color because the role now gets its value from `grey-700`. If several components use the role, it is still only one reference that changes.',srcNote:'`grey-700` is from the article by Andreas Kutschmann: `color.options.grey-700`.'}
      ]},
    navn:{title:'The name',does:'Build token names from segments, and see on the board what each name describes.',from:'Nathan Curtis and Andreas Kutschmann',
      intro:['A token name is put together from segments. Each segment answers one question: which component, which variant, which property, which state.','On this board a segment that is missing says nothing. `button.primary.background` does not mention a state, so the name describes the background of the primary button in every state.','You build names on the rail. The board always shows which parts the name describes. When you create the token, exactly those parts get the value.'],
      take:['A token name is an address, and each segment makes it more precise. On this board a missing segment covers everything on that level. In a real system the component’s code decides which token a part uses.','Include only the levels needed to describe the decision and tell it apart from the others.','State is a level in the name. Nathan Curtis counts it among the modifiers, together with variant, scale, and mode, and modifiers tend to come last. He does not say which layer a token with a state belongs to.','The levels are Curtis’s own framework, not a standard, and he finds no common order across systems. Andreas Kutschmann writes `button.text-disabled` where this level writes `button.text.disabled`. What matters is that one system does it one way.'],
      rounds:[
        {tips:['A name is built from segments. Every segment you choose makes the name more precise. The board shows which parts the name describes right now.','The name describes the background in all four states. The decision applies only when the button is pointed at.','Choose `hover` under State, and create the token.'],q:'The primary button should have a lighter background when you point at it: `blue-800`. Give that decision a name of its own.',done:'`button.primary.background.hover` has been created.',why:'The name without a state described the background in all four states. With `hover` as its last segment it describes only one. On the board every part uses the token that describes it most precisely, so the other three states keep `button.primary.background`.',srcNote:'Hover is one of the states Curtis lists: default, hover, press or active, focus, disabled, visited, and error.'},
        {tips:['On this board a name answers four questions: which component, which variant, which property, and which state. Find the four answers in the task.','It is the primary button, it is the background, and it is when the button is pressed. Choose one segment in each group.','Choose `button`, `primary`, `background`, and `pressed`, and create the token.'],q:'When the primary button is pressed, the background should be `blue-700`. Build the name from scratch.',done:'`button.primary.background.pressed` has been created.',why:'Four segments, four answers: the component is `button`, the variant `primary`, the property `background`, and the state `pressed`. Swap one segment and the name points at another part.',srcNote:'Curtis calls the state press or active. `pressed` is this system’s word for it.'},
        {tips:['On this board a level where you choose nothing applies to every possibility. A name without a state describes all four states.','The border belongs to the secondary button and is the same in every state. So the name should not mention a state.','Choose `button`, `secondary`, and `border`. Leave State empty, and create the token.'],q:'The secondary button should have a 1 px border in `grey-600`. The border is the same in every state.',done:'`button.secondary.border` has been created.',why:'The decision does not change with the state, so the name mentions no state. One token describes the border in all four. Four names with the same value would be four places to change the next time the border changes.',srcNote:'Curtis: include only the levels needed to describe and distinguish the intent.'},
        {tips:['Include only the segments needed to tell the decision apart from others. The rest is noise.','The corners are the same for both variants and in every state. The name should describe the whole board.','Choose only `button` and `radius`, and create the token.'],q:'All buttons should have rounded corners of 8 px, whatever the variant and state.',done:'`button.radius` has been created.',why:'Neither variant nor state changes the corners. The name needs only component and property, and one token shapes all eight buttons.',srcNote:'Curtis’s own example is `$esds-shape-tile-corner-radius`. Adding `-default-on-light` to that name he calls redundant.'},
        {tips:['A segment in the middle of the name can be left out just as well as the last one.','The decision applies to both variants, but to one state only: when the button is disabled.','Choose `button`, `text`, and `disabled`. Leave Variant empty, and create the token.'],q:'When a button is disabled, the text should be `grey-400`. That goes for both variants.',done:'`button.text.disabled` has been created.',why:'Here the variant is left out and the state is included. A level in the middle of the name can be missing just as well as one at the end. The name describes the text on both buttons, but only when they are disabled.',srcNote:'Andreas Kutschmann’s article has the same decision as `button.text-disabled`: the state is written together with the property. Same levels, different notation.'}
      ]},
    format:{title:'The format',does:'Repair a token file, and watch the plant come into being from it.',from:'The Design Tokens specification 2025.10',
      intro:['The two chains from level 1 also exist as data: a JSON file in the Design Tokens format.','The reader builds the plant from the file. What the file says is what stands on the bench.','The file has a fault. Find it on the bench, select the line in the file, and change it.'],
      take:['An object with `$value` is a token. Without `$value` it is a group, and a group has no value to pass on.','The type is found in this order: the token’s own `$type`, otherwise the type of the token a reference points at, otherwise the `$type` of the closest group. If there is none, the token is invalid. A tool must not guess.','A reference in curly braces must point at a whole token, and a chain of references must end in a raw value.','Values have a fixed shape. A dimension is an object with `value` and `unit`. A color is an object with `colorSpace` and `components`.','The format is a stable report from the Design Tokens Community Group under the W3C. It is not a W3C standard.'],
      rounds:[
        {tips:['This is how the file is read: a line with a name and `$value` is a token. The name comes first, and the value follows `$value`. A line that only opens a curly bracket is a group.','On the bench `background` stands only as an outline. Find the line with `background` in the file, and compare it with the line with `accent`.','The line with `background` says `value` without a dollar sign. Select the line, and write the key as `$value`.'],q:'The button has no color. Find the fault in the file, and repair it.',done:'`$value` makes the object a token.',why:'Without the dollar sign `value` is a name like any other, and the object is a group. With `$value` it is a token, and the reference to `color.accent` can be followed. That is why there is now a block, a pipe, and a colored button.'},
        {tips:['A value needs a type before it can be used. The type is written as `$type`, either on the token itself or on the group above it.','Compare the group `color` with the group `space`. Under `space` there is a line with `$type`. It is missing under `color`.','Select the line `color`, where the group begins, and add `"$type": "color"` to the group.'],q:'Now no color reaches the button. Find the fault in the file, and repair it.',done:'The type can be determined again.',why:'A token without a `$type` of its own inherits it from the closest group that has one. `color.accent` gets its type from the token it points at. The type can sit on the group or on `blue-900` alone: either way all three tokens get a type.'},
        {tips:['A value in curly brackets is a reference: the path to another token. It is written as the name of the group, a period, and the name of the token.','On the bench the pipe on `accent` ends in air. The reference points at a name that is not in the file. Compare it with the names in the group `color`.','The line with `accent` points at `{color.blue}`, but the token is called `blue-900`. Select the line, and point at `color.blue-900`.'],q:'The button still has no color. Find the fault in the file, and repair it.',done:'The reference reaches a token.',why:'A reference is the path to a token: the name of the group, a period, and the name of the token. `{color.blue}` does not exist, so there was nothing to fetch. Now `color.accent` points at `color.blue-900`, and the value runs all the way to the button.'},
        {tips:['A length is a dimension. In the format it is written as an object in curly brackets with two fields: a number in `value` and a unit in `unit`.','Look at the line with `space-32`. The value is written as text in quotation marks, not as an object. On the bench the block has no rule.','Select the line with `space-32`, and write the value as an object: `{ "value": 32, "unit": "px" }`.'],q:'The card has no padding. Find the fault in the file, and repair it.',done:'The dimension has the right shape.',why:'In 2025.10 a dimension is an object with a number in `value` and a unit in `unit`, which may only be `px` or `rem`. The text `"32px"` looks right but is not a valid dimension. Colors follow the same idea: an object with `colorSpace` and `components`.',srcNote:'You will still meet the short form in older files. Andreas Kutschmann’s article, for example, writes colors as hex text.'},
        {tips:['A value can be written in two ways in the file. A raw color is an object with `colorSpace` and `components`. A reference is a path in curly brackets, for example `"{color.blue-900}"`.','The line with `accent` has its own copy of the blue color. It should be a reference to the gray one instead.','Select the line with `accent`, and point at `color.grey-700`.'],q:'The role `accent` should follow `grey-700`, as in level 1. Change it in the file.',done:'`color.accent` points at `color.grey-700`.',why:'`color.accent` had its own copy of the blue color. A raw value does not follow when the original value changes, and no pipe leads from it. A reference is a connection. This is the same change you made by hand in level 1, now written as data.'}
      ]},
    tema:{title:'The theme',does:'Build a Dark mode by moving references, and watch two rooms answer at once.',from:'Figma, Andreas Kutschmann, and WCAG',
      intro:['A mode is a set of values for the same tokens, for example Light and Dark.','In this plant every semantic token has two references: one for Light and one for Dark. Component tokens have only one. They point at a role and do not know which mode is active.','Dark does not exist yet: the dark references point to the same place as the light ones. Select a reference and point it at another primitive token. Both rooms answer at once.'],
      take:['A mode is a set of values for the same tokens. In Figma’s guide Dark is a mode on the `Tokens` collection, which holds both semantic and component tokens.','In this plant the component tokens are not touched when a mode is added. They point at roles, and the roles get new values.','One moved reference reaches every part that uses the role. If you change a component token instead, you move one part, and in this plant it changes in both modes.','Each mode must be checked on its own. A color that works against a light surface does not necessarily work against a dark one.','That modes sit on the roles is this plant’s setup, not a rule. In the Design Tokens format a token has one `$value`, and modes are described in a resolver file next to it.'],
      rounds:[
        {tips:['In this plant every semantic token has two references: one for Light and one for Dark. The list shows the references for the mode chosen at the top.','Keep Dark chosen, and select `surface` among the semantic tokens. Then the primitive tokens it can point at appear.','Select `surface`, and point it in Dark at `grey-800`.'],q:'The surface should be dark in Dark. Point `surface` in Dark at `grey-800`.',done:'One reference has moved. Two parts changed.',why:'The card background and the secondary button background both point at `surface`, so both turned dark. The Light room is untouched, because you moved only the Dark reference. The Light values are from Andreas Kutschmann’s article. But the text still points at `grey-900` in Dark, and now it is almost invisible.'},
        {tips:['A part changes color only if its component token points at the role that is changed. The reference decides it, not what the part looks like.','Three parts point at `text`. The text on the primary button does not: it points at `text-on-accent`.','Mark `card.title`, `card.body`, and `button.secondary.text`, and carry out the change.'],q:'The text should be light in Dark: `text` should point at `grey-100`. First mark the parts on the Dark screen that change color.',done:'One reference has moved. Three parts changed.',why:'Three parts point at `text`: the card heading, the card body text, and the text on the secondary button. The text on the primary button points at `text-on-accent` and is untouched. How far a change reaches is decided by the references, not by what the parts look like.'},
        {tips:['Contrast is measured between two colors. The button background comes from the role `accent`, and the text on the button from `text-on-accent`.','A lighter blue stands out more against the dark surface. But then the text on the button must be checked again too.','Point `accent` in Dark at `blue-800`. Then point `text-on-accent` in Dark at `grey-900`.'],q:'The primary button is too weak against the dark surface: 2.9:1 against a limit of 3:1. Make every check in Dark pass. The button must still be blue, and neither the surface nor Light may change.',done:'Dark passes every check.',why:'`accent` now points at a lighter blue in Dark, and `text-on-accent` had to follow, because white text is too weak on the lighter blue. No component token has been touched. Light still passes every check: its references are the same as before. WCAG requires 4.5:1 for normal text. The 3:1 limit for the button background is the plant’s own. The number is borrowed from WCAG 1.4.11, which does not require it of a button with readable text.'}
      ]},
    pipe:{title:'The pipeline',does:'Connect the source to the platforms, and send a decision through the build.',from:'Andreas Kutschmann and Style Dictionary',
      intro:['Tokens live in one place: the source. Here it is two JSON files in a repository.','A build reads the files and writes a file of code for each platform: CSS for web and Swift for iOS. The interface reads the color from there.','You run the plant: which files are included, what the platforms are connected to, and when the build runs.'],
      take:['The source is one place. Andreas Kutschmann recommends a Git repository as the shared source.','In Style Dictionary the build merges all token files into one object. That is why a reference can point at a token in another file, as long as both files are included.','A transform in Style Dictionary adapts the individual token to the platform, for example the name: `button-primary-background` in CSS and `buttonPrimaryBackground` in Swift. A format writes the file.','Output is generated. A change made directly in an output file applies only there, and the next build writes the file again. Style Dictionary itself puts "Do not edit directly" at the top of the files.','A change in the source reaches every platform that is connected to it. A platform on a handmade copy does not follow.','The plant shows one possible setup, not the only one. The steps and the names of the transforms are Style Dictionary’s.'],
      rounds:[
        {tips:['In Style Dictionary the build merges the files that are included in the source into one object before the references are followed.','`accent` is in `tokens.json` and points at a color in `options.json`. That file is not included in the build.','Include `options.json` under Source, and run the build.'],q:'The build has stopped, and web has no file. Get the build to run.',done:'The build ran. Web has its file.',why:'`accent` is in `tokens.json` and points at `blue-900`, which is in `options.json`. The build merges all files in the source into one object before the references are followed to a value. Once both files were included, the reference could be followed, and `--button-primary-background` was written for web.'},
        {tips:['A platform shows what it is connected to. See where iOS gets its values from.','iOS is on a handmade copy. Connected to the source, iOS also needs a transform of the name, because a Swift name without backticks cannot contain periods or hyphens.','Let iOS get its values from The source, choose `name/camel`, and run the build.'],q:'The iOS app shows a different blue than web. Both platforms should follow the source.',done:'iOS follows the source.',why:'iOS was on a handmade copy that no build touches. Now both platforms read the same decision from the same source. The value is the same, but the form is the platform’s. CSS gets `--button-primary-background`. Swift gets a name without hyphens and periods, for example `buttonPrimaryBackground`, because a Swift name without backticks cannot contain them. That is the work of the transform.',srcNote:'Style Dictionary’s built-in transform groups use `name/kebab` in `css` and `name/camel` in `ios-swift`. The naming rule is in the Swift language reference.'},
        {tips:['Output is generated. A change made directly in an output file applies only there, and the next build writes the file again.','The color is decided in the source, by what `accent` points at. Changed there, both platforms follow.','Point `accent` in the source at `grey-700`, and run the build.'],q:'The button should be gray on both web and iOS. On web somebody has already changed the color directly in the file.',done:'One change in the source. Two platforms followed.',why:'You changed one reference in the source and ran the build. Both files were written again, including the one that had been changed by hand, and both platforms followed. The change made directly in the output file reached only web and was gone after the first build.',srcNote:'By default Style Dictionary writes "Do not edit directly" at the top of the files it generates.'}
      ]},
    system:{title:'The system',does:'Find the cause behind a wrong screen, and repair it where it lies.',from:'The sources from levels 1 to 5',
      intro:['Four monitors show the result of the whole system. A part that differs from the design is marked.','Select a part that differs and trace it backwards, one link at a time: which token the part uses, what it points at, and when the platform was last built.','Repair the cause. The task is solved when the system is right again, not when the monitor looks right.'],
      take:['A visible fault in a component need not have its cause in the component. Trace the chain backwards before you change anything.','The pattern points at the layer. If every part that shares a role differs, the cause is in the role. If only one part differs, but everywhere, it is in the component token. If only one mode differs, it is that mode’s reference. If only one platform differs, the cause is in the build or in the platform’s code.','A change in the platform’s code removes the symptom in one place. The cause stays, and the next thing that uses the token will be wrong.','Before you change a reference, you can predict where the change will reach: every part that points at it, in that mode, on every platform built from the source.'],
      rounds:[
        {tips:['Start at the symptom. Select Button background under Parts on the monitor, and see which token the part uses. Then select that token, and follow it one link further.','The link differs too, and only in Light. The two parts share the role `accent`. When several parts with the same role differ, the pattern points at the role.','Select `accent` under Semantic tokens, and point it in Light at `blue-900`.'],q:'The Send button is gray on web in Light. It should be blue. Find the cause, and repair it.',done:'The cause was in the role.',why:'Four parts differed: the button background and the link, on both platforms, in Light only. The two parts share the role `accent`, and it pointed at `grey-700` in Light. One reference was moved back, and all four parts followed.'},
        {tips:['Look at the pattern: only one part differs, but it does so on all four monitors.','The link also uses `accent` and is right, so nothing is wrong with the role. See what the button’s own component token points at.','Select `button.primary.background` under Component tokens, and point it at `accent`.'],q:'The Send button blends into the card on all four monitors. Find the cause, and repair it.',done:'The cause was in the component token.',why:'Only the button background differed, but on every monitor. The link, which also uses `accent`, was right, so nothing was wrong with the role. The fault was in the component token: `button.primary.background` pointed at `surface`.'},
        {tips:['The fault shows only in Dark, but on both platforms. In this plant the only thing that applies to one mode alone is a role’s reference for that mode.','The heading uses `card.title`, which points at the role `text`. See what `text` points at in Dark.','Select `text` under Semantic tokens, and point it in Dark at `grey-100`.'],q:'The heading on the card cannot be read in Dark. Find the cause, and repair it.',done:'The cause was in the role’s Dark reference.',why:'The heading differed on both platforms, but only in Dark. The component token pointed correctly at `text`. It was the role’s Dark reference that pointed at `grey-900`. Light has its own reference and was never affected.'},
        {tips:['A part without a color has a chain that does not reach a value. Follow the chain from the heading, and see where it ends.','`card.title` points at `txt`. There is no role with that name.','Select `card.title` under Component tokens, and point it at `text`.'],q:'The heading on the card has no color on any monitor. Find the cause, and repair it.',done:'The reference reaches a role again.',why:'`card.title` pointed at `txt`, and there is no role with that name. A reference that does not reach a token cannot be followed to a value, and a tool must report an error. In this plant the part instead has no color, in any mode or on any platform.'},
        {tips:['The fault shows on one platform only. Tokens are shared by both platforms, so the cause lies after them.','The chain behind the button is right all the way: `accent` points at `blue-900`. Look at the platform’s output, and when it was built.','Select iOS under Platforms, and run the build for iOS.'],q:'On iOS the button and the link are gray in Light. On web they are blue. Find the cause, and repair it.',done:'The cause was in the build.',why:'The chain behind the part was right all the way down: `accent` points at `blue-900`. But iOS had been built before that reference was corrected and still showed the old output. There was nothing to change in the tokens. The build had to run.'},
        {tips:['A component token belongs to one part. If it is moved, only that part changes.','In this plant component tokens have no modes, and both platforms are built from the same source. So the part changes on every monitor.','Mark Link and all four monitors, and carry out the change.'],q:'A change is planned: `link.text` is to point at `text` instead of `accent`, and both platforms are built. Mark the parts and monitors that change color before you carry it out.',done:'The change has been carried out.',why:'Only the link changes, because only that component token has moved. But it changes on all four monitors: in this plant a component token has no modes, so the part now follows `text` in both Light and Dark, and both platforms are built from the same source. The button still points at `accent` and is untouched.'}
      ]}
  },
  cards:{
    lag3:{t:'The three layers of tokens',p:['Primitive tokens describe which values exist. The name says what the value is: a color on a scale or a step in a spacing scale. Example: `grey-100`.','Semantic tokens describe how a value is used. The name says something about role or meaning, and the value is typically a reference to a primitive token. Example: `surface` points to `grey-100`.','Component tokens describe where in a specific component a decision applies. The name contains the component. Example: `button.secondary.background` points to `surface`.','Ask yourself: does the name say what the value is, how it is used, or where it sits?']},
    lagAntal:{t:'Two or three layers?',p:['You can make do with two layers: primitive and semantic tokens. That fits when the major design decisions are in place and fairly stable.','A third layer of component tokens makes it easier to change decisions later. The price is that every new component gets its own tokens, so the number and the maintenance grow.']},
    lagHvornaar:{t:'When do tokens pay off?',p:['Tokens pay off when the same design has to ship on several platforms or in several applications, when the design changes often, and when many people work on the same thing.','They also cost something to keep up. In a small project with limited scope, that effort can be greater than the gain.']},
    alias:{t:'Alias: one token points to another',p:['An alias is a token whose value is a reference to another token. If the source changes, every token that points to it follows.','This is how the layers are built on top of each other: component points to semantic, and semantic points to primitive.','In a structure with several layers, primitive tokens are the foundation and are for reference only. It is the semantic tokens and the component tokens that are applied to the design itself.']},
    niveauer:{t:'Levels in a token name',p:['Nathan Curtis divides a token name into segments, where each segment has a level. The levels fall into four groups.','Base: category is the type of style (`color`, `font`, `space`). concept groups tokens around a purpose (`action`, `feedback`). property is the property being styled (`background`, `text`, `border`, `size`).','Modifiers: variant distinguishes between alternatives (`primary`, `secondary`, `success`, `error`). state is interaction (`hover`, `focus`, `disabled`). scale is a step on a scale (`100`, `2-x`). mode is the surface the element sits on (`on-dark`).','Objects: component is a component (`button`, `input`). element is a part within the component (`left-icon`). component group groups related components (`forms`).','Namespaces: system is the name or abbreviation of the design system. theme and domain narrow it further.']},
    raekkefolge:{t:'The order in a name',p:['There is no fixed order across design systems, but Curtis sees a pattern.','Namespace comes first. Objects, that is, component and element, come next. Base, that is, category, concept, and property, forms the middle. Modifiers, that is, variant, state, scale, and mode, come last, often with mode last of all.','Within base, the order varies from system to system.']},
    homonym:{t:'Avoid homonyms',p:['A homonym is a word with several meanings. In token names they create doubt, because the same word can be read as a category, a property, or something else entirely.','Curtis mentions `text`, which can mean typography, content, and a property. Choose words that can only be understood one way.']},
    komplet:{t:'Only the necessary levels',p:['No token has every level. Include only those needed to describe and distinguish the intent.','Levels that change nothing for this particular token are noise. Curtis calls `-default-on-light` redundant on a shadow offset.']},
    themeMode:{t:'Theme and mode',p:['A theme changes colors, typography, and other style across all components, typically for a brand or a product.','A mode distinguishes between the surfaces the elements sit on, typically light and dark.','The two are independent axes: any theme may need both light and dark.','This is Curtis’s usage of the word: a segment in the name, such as `on-dark`. In Figma a mode is a set of values, and the name stays the same.']},
    lokalGlobal:{t:'Local first, global later',p:['A token that only one component needs belongs with the component.','When several related components share the same decision, the token can be promoted to a component group and made global. Curtis’s rule of thumb is three or more components.','Making decisions global too early fills the shared namespace with guesswork.']},
    polyhierarki:{t:'When a decision fits in two places',p:['Some decisions naturally belong in two sets at once. An error color is both part of the feedback colors and part of the text colors of the form fields.','Curtis calls it polyhierarchy. The question is whether the decision should be stored in one place or two, and how the two places relate.']},
    taksAudit:{t:'Audit before you decide',p:['When a token taxonomy is to be redone, Curtis starts with a plan and then audits what exists: tokens in Figma, in the code, and in the documentation, and how they are actually used on the components.','In the audit he looks for tokens that are too general, are used incorrectly, or are used for the same purpose under different names.','Only then is the new taxonomy decided together, and finally it is implemented.']},
    skala:{t:'Scales',p:['A scale is a series of steps with fixed names. Curtis describes several kinds: numbered levels, ordered steps such as `100` to `900`, proportions such as `2-x`, and t-shirt sizes such as `small`, `medium`, and `large`.','The name of a step is a promise that the step is different from its neighbors.']},
    tokenGruppe:{t:'Token or group',p:['A token file is JSON. An object is a token if it has a `$value`. The name is the key the object sits under.','An object without `$value` is a group. It can contain tokens and other groups.','Fields that belong to the format begin with `$`: `$value`, `$type`, `$description`, `$deprecated`, and `$extensions`.']},
    specStatus:{t:'The Design Tokens specification',p:['The format is made by the Design Tokens Community Group, an open group under W3C with participants from Adobe, Google, Figma, Salesforce, and Shopify, among others.','The first stable version is called 2025.10 and was released on 28 October 2025. It consists of three modules: Format, Color, and Resolver.','A Community Group publishes reports. That is not the same as a W3C Recommendation, which is what the actual W3C standards are.']},
    navneregler:{t:'Rules for names',p:['Names of tokens and groups must not begin with `$`, because `$` is reserved for the format’s own fields.','They must not contain `{`, `}`, or periods either, because those characters are used when one token references another: `{group.token}`.','Names are case-sensitive.']},
    dimension:{t:'The dimension type',p:['A dimension is a distance in one direction: width, height, radius, or thickness.','The value is an object with two fields: `value`, which is a number, and `unit`, which is `px` or `rem`. The unit must be included, even when the value is 0.']},
    farve:{t:'The color type',p:['A color is written as an object. `colorSpace` tells which color space the numbers are in, for example `srgb`, `display-p3`, or `oklch`. `components` are the components of the color in that color space.','`alpha` is optional and specifies transparency. `hex` is also optional and is only a six-digit fallback.']},
    reference:{t:'References',p:['A token can get its value from another token. The reference is written as the path to the token in curly braces, with periods between the groups: `{color.brand}`.','A reference can point to a token that is itself a reference. The chain is then followed until it reaches an actual value.','The chain has to end somewhere. A reference in curly braces can only point to a whole token, not to a group.']},
    type:{t:'Where does the type come from?',p:['Every token has a type. It can be on the token itself as `$type`.','If it is not there, and the value is a reference, the type is the same as that of the token being pointed to. Otherwise the type is inherited from the nearest group that has a `$type`.','If the type cannot be found in any of those ways, the token is invalid.']},
    root:{t:'Base value in a group',p:['A group can have a base value alongside its variants. It sits in a token with the reserved name `$root`.','A reference in curly braces must always point to a token, never to a group.']},
    pointer:{t:'Two ways to reference',p:['Curly braces point to a whole token and give its entire value.','The format also has JSON Pointer: the field `$ref` with a path that begins with `#/` and uses slashes. A JSON Pointer can point anywhere in the document, including into a value.']},
    extends:{t:'Groups that inherit',p:['A group can inherit from another group with `$extends`. Everything from the other group comes along.','Whatever the new group itself defines at the same path overrides what was inherited. The rest stays.']},
    resolver:{t:'Themes in the format',p:['A token has only one value. Themes and modes are therefore described outside the token, in a resolver file.','It has sets, which are token files that are always included, and modifiers, which have several contexts, for example `light` and `dark`, each pointing to their own files.','`resolutionOrder` determines the order, and the latest wins in a conflict. Each combination of contexts across modifiers gives one finished set of tokens.']},
    extensions:{t:'The tools’ own data',p:['`$extensions` is a place where tools can store their own data on a token or a group.','Each tool uses its own key, typically a reverse domain name such as `com.figma`, so they do not collide.','The idea is that a file should be able to travel between tools without anyone losing their data.']},
    composite:{t:'Composite types',p:['Some styles consist of several values that belong together. A shadow has color, offset, blur, and spread.','The format has composite types for this: `shadow`, `border`, `typography`, `transition`, `gradient`, and `strokeStyle`.','A composite token is one token with one value, which is an object with fixed sub-values. A group, by contrast, is only a folder for organizing tokens.']},
    mode:{t:'Modes: same tokens, several values',p:['A mode is a set of values for the same tokens. Light and Dark are the classic example.','In this plant the component tokens do not know which mode is active. They point at a role such as `text`, and the role points at one primitive token in Light and another in Dark.','That is why a fault in Dark is repaired here by pointing the role’s Dark reference somewhere else, not by changing the component token.']},
    kontrast:{t:'Contrast',p:['Contrast is the ratio between the luminance of two colors, from 1:1 for two identical colors to 21:1 for black against white.','WCAG 2.1 requires at least 4.5:1 between normal text and its background, and 3:1 for what is needed to identify a user interface component. Level 4 uses 3:1 as its own limit for the button background against the surface. WCAG does not require it of a button with readable text.']},
    sd:{t:'Style Dictionary',p:['Style Dictionary is an open source tool that translates token files into code.','It reads a configuration, finds the token files, reads them, and merges them into one big object.','For each platform, transforms change the individual tokens, for example the form of the name or the unit of the value. A format then writes the files, for example CSS, Swift, or Android XML. Actions can do extra things at the end, such as copying files.']},
    sti:{t:'From path to variable name',p:['In a token file, two tokens can have the same name if they are in different groups. The path from the outermost group down to the token, on the other hand, is unique.','Tools that write code need unique variable names.']},
    enheder:{t:'Units across platforms',p:['In the token file, `px` is an idealized pixel, not a physical one. Each platform has its own unit for the same thing.','Android uses `dp` for measurements and `sp` for font sizes that follow the user’s setting. iOS uses `pt`. On the web, `rem` follows the user’s font size.']},
    figmaEksport:{t:'Export from Figma',p:['Figma can export variables as JSON in the Design Tokens format. You right-click a mode and choose Export mode, or a collection and choose Export modes.','Remember that a token has only one value in the format.']},
    figmaImport:{t:'Import into Figma',p:['Figma can import token files as variables: drag the files into a new collection, or right-click a mode and choose Import mode.','Not everything in the format can become variables. Figma has a list of supported types, and some of them have requirements for unit or color space.','Groups in the file become groups in the variable name. Variables that already exist are recognized by name and type.']},
    pipeline:{t:'A token pipeline',p:['In an automated pipeline, the token files live in a Git repository, which is the shared source for design and development.','When the files change, a series of steps runs automatically: the files are checked, code is built for each platform, the result is tested and published, and the teams that use the tokens are notified.']},
    scope:{t:'Scoping and publishing in Figma',p:['In Figma, a variable can be scoped so it can only be selected for certain properties. A color can be limited to text, for example, and a number to corner radius.','A variable can also be hidden from publishing, so it does not show up for those who use the library.']},
    privat:{t:'Private and public tokens',p:['Not all tokens need to be visible to those who use the design system. Fewer choices give a better experience and show which tokens to use.','Nobody outside depends on tokens that are kept internal.']},
    navneraad:{t:'Advice on names',p:['Figma recommends whole words over abbreviations, consistent prefixes, and names that can hold up as the system grows.','The Design Tokens specification gives the same advice on abbreviations in its section on naming.']},
    codeSyntax:{t:'Code syntax in Figma',p:['A variable in Figma can have a code syntax: the name it has in code. One can be specified for Web, one for Android, and one for iOS.','The name is shown in the code snippets in Dev Mode when a developer inspects a design.']}
  },
  ctx:{
    'lag-0':'`blue-900` is step 900 in a blue color scale. The value is a color code.',
    'lag-1':'Curly braces mean that the value is a reference to another token. Here the token points to `blue-900`.',
    'lag-2':'The name is read from the left: `button`, then `primary`, then `background`. The value is a reference to `accent`.',
    'lag-3':'`space` is spacing, and `32` is the size. The value is a measurement in pixels.',
    'lag-4':'Inset is the space between the edge of a surface and its content. The value is a reference to `space-32`.',
    'lag-5':'The name is read from the left: `card`, then `padding`. The value is a reference to `inset`.'
  }
};
if(TB.content&&TB.content.setLang)TB.content.setLang(TB.i18n.lang);
})();

<script>/* kit.js */
/* TB.kit: the drawing instruments. Everything in the world is drawn with these, so the grammar stays the MOTH diagram grammar:
   - a solid is "a thing that exists": flat faces in three paper tones and 1px edges, corners square
   - a solid line is structure, a dashed line is a connection, both exactly one CSS pixel wide at any zoom
   - type is Inter, set on the faces of the things it names
   Nothing is lit and nothing casts a shadow. Depth is face tone, overlap and line.
   Also exports TB.fx (init/update/tween/burst/label) for the integrator. */
(function(){
'use strict';
var TB=window.TB,pal=TB.cfg.pal,TONE=TB.cfg.tone;
var K=TB.kit={},scene=null,now=0,timers=[],runs=[];

function css(h){return '#'+('000000'+h.toString(16)).slice(-6);}
function V(a){return a&&a.isVector3?a:new THREE.Vector3(a[0],a[1],a[2]);}
K.css=css;K.v=V;

/* ---------- faces ---------- */
/* unlit colour, pushed a hair back so the lines drawn on it stay whole */
K.flat=function(color,o){
  o=o||{};o.color=color;
  if(o.polygonOffset===undefined){o.polygonOffset=true;o.polygonOffsetFactor=1;o.polygonOffsetUnits=1;}
  return new THREE.MeshBasicMaterial(o);
};
K.bas=K.flat;K.lam=K.flat;
var UNIT=new THREE.PlaneGeometry(1,1);
K.quad=function(w,h,mat,x,y,z){var m=new THREE.Mesh(UNIT,mat);m.scale.set(w,h,1);m.position.set(x||0,y||0,z||0);return m;};
K.box=function(w,h,d,mat,x,y,z){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x||0,y||0,z||0);return m;};

/* ---------- lines: exactly `width` CSS pixels wide, whatever the zoom ----------
   Each segment is a quad that is widened in screen space. Dashes are counted in pixels along the segment.
   A line can carry two colours: everything before `head` (a distance along the path, in world units) is drawn in color2. */
var LRES=new THREE.Vector2(1,1);K.lineRes=LRES;
var LVS=[
'attribute vec3 other;attribute float side;attribute float along;attribute float dw;attribute float alpha;',
'uniform vec2 uRes;uniform float uWidth;',
'varying float vPx;varying float vW;varying float vA;',
'void main(){',
' vec4 a=projectionMatrix*modelViewMatrix*vec4(position,1.0);',
' vec4 b=projectionMatrix*modelViewMatrix*vec4(other,1.0);',
' vec2 pa=a.xy/a.w*uRes*0.5,pb=b.xy/b.w*uRes*0.5;',
' vec2 d=pb-pa;float len=length(d);vec2 dir=len>0.0001?d/len:vec2(1.0,0.0);',
' vec2 off=vec2(-dir.y,dir.x)*side*uWidth*0.5-dir*uWidth*0.5;',
' a.xy+=off/(uRes*0.5)*a.w;',
' vPx=along*len;vW=dw;vA=alpha;',
' gl_Position=a;',
'}'].join('\n');
var LFS=[
'uniform vec3 uColor;uniform vec3 uColor2;uniform float uHead;uniform float uOpacity;uniform vec2 uDash;',
'varying float vPx;varying float vW;varying float vA;',
'void main(){',
' if(uDash.x>0.0&&mod(vPx,uDash.x+uDash.y)>uDash.x)discard;',
' vec3 c=vW<uHead?uColor2:uColor;',
' gl_FragColor=vec4(c,uOpacity*vA);',
'}'].join('\n');
/* colours go to the screen as they are written: token values, not light */
function rgb(h,v){v=v||new THREE.Vector3();return v.set((h>>16&255)/255,(h>>8&255)/255,(h&255)/255);}
/* segs: [[ax,ay,az,bx,by,bz,(alphaA),(alphaB)],...]. Options: color, color2, width (px), dash [on,off] (px), opacity, path (true: dw runs on from segment to segment) */
K.lines=function(segs,o){
  o=o||{};
  var geo=new THREE.BufferGeometry(),n=-1;
  var mat=new THREE.ShaderMaterial({vertexShader:LVS,fragmentShader:LFS,side:THREE.DoubleSide,transparent:!!(o.fade||(o.opacity!==undefined&&o.opacity<1)),depthWrite:!o.fade,
    uniforms:{uRes:{value:LRES},uWidth:{value:o.width||1},uColor:{value:rgb(o.color!==undefined?o.color:pal.borderStrong)},uColor2:{value:rgb(o.color2!==undefined?o.color2:pal.signal)},
      uHead:{value:-1},uOpacity:{value:o.opacity!==undefined?o.opacity:1},uDash:{value:new THREE.Vector2(o.dash?o.dash[0]:0,o.dash?o.dash[1]:0)}}});
  var m=new THREE.Mesh(geo,mat);m.frustumCulled=false;m.isTBLine=true;
  if(o.over){mat.depthTest=false;m.renderOrder=5;}
  m.set=function(s){
    var c=s.length,i,pos,oth,sd,al,dw,ap,idx;
    if(c!==n){
      n=c;
      geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(c*12),3));
      geo.setAttribute('other',new THREE.BufferAttribute(new Float32Array(c*12),3));
      geo.setAttribute('side',new THREE.BufferAttribute(new Float32Array(c*4),1));
      geo.setAttribute('along',new THREE.BufferAttribute(new Float32Array(c*4),1));
      geo.setAttribute('dw',new THREE.BufferAttribute(new Float32Array(c*4),1));
      geo.setAttribute('alpha',new THREE.BufferAttribute(new Float32Array(c*4),1));
      idx=[];for(i=0;i<c;i++)idx.push(i*4,i*4+1,i*4+2,i*4+2,i*4+1,i*4+3);
      geo.setIndex(idx);
    }
    pos=geo.attributes.position.array;oth=geo.attributes.other.array;sd=geo.attributes.side.array;al=geo.attributes.along.array;dw=geo.attributes.dw.array;ap=geo.attributes.alpha.array;
    var run=0;
    for(i=0;i<c;i++){
      var q=s[i],L=Math.sqrt((q[3]-q[0])*(q[3]-q[0])+(q[4]-q[1])*(q[4]-q[1])+(q[5]-q[2])*(q[5]-q[2])),a0=q.length>6?q[6]:1,a1=q.length>7?q[7]:a0;
      if(!o.path)run=0;
      for(var k=0;k<4;k++){
        var end=k>1,j=(i*4+k)*3;
        pos[j]=end?q[3]:q[0];pos[j+1]=end?q[4]:q[1];pos[j+2]=end?q[5]:q[2];
        oth[j]=end?q[0]:q[3];oth[j+1]=end?q[1]:q[4];oth[j+2]=end?q[2]:q[5];
        sd[i*4+k]=(k%2?1:-1)*(end?-1:1);al[i*4+k]=end?1:0;dw[i*4+k]=run+(end?L:0);ap[i*4+k]=end?a1:a0;
      }
      run+=L;
    }
    m.len=run;
    for(var key in geo.attributes)geo.attributes[key].needsUpdate=true;
    return m;
  };
  m.setColor=function(h){rgb(h,mat.uniforms.uColor.value);return m;};
  m.setColor2=function(h){rgb(h,mat.uniforms.uColor2.value);return m;};
  m.setHead=function(d){mat.uniforms.uHead.value=d;return m;};
  m.setWidth=function(w){mat.uniforms.uWidth.value=w;return m;};
  m.setDash=function(a,b){mat.uniforms.uDash.value.set(a||0,b||0);return m;};
  m.setOpacity=function(v){mat.uniforms.uOpacity.value=v;mat.transparent=v<1||!!o.fade;return m;};
  return m.set(segs||[]);
};
/* consecutive points -> segments */
K.chain=function(pts){var s=[];for(var i=0;i<pts.length-1;i++){var a=V(pts[i]),b=V(pts[i+1]);s.push([a.x,a.y,a.z,b.x,b.y,b.z]);}return s;};
/* the twelve edges of a box, centred on the origin */
function boxEdges(w,h,d){
  var x=w/2,y=h/2,z=d/2,s=[],i,j;
  for(i=-1;i<=1;i+=2)for(j=-1;j<=1;j+=2){s.push([-x,i*y,j*z,x,i*y,j*z]);s.push([i*x,-y,j*z,i*x,y,j*z]);s.push([i*x,j*y,-z,i*x,j*y,z]);}
  return s;
}
K.boxEdges=boxEdges;

/* ---------- solids: "a thing that exists" ----------
   A box with three face tones and its edges. o: tone [top,front,side], edge (colour or null), width, ghost */
function paint(geo,t){
  var n=geo.attributes.normal,c=geo.attributes.color,col=new THREE.Color(),i;
  for(i=0;i<n.count;i++){
    var ny=n.getY(i),nz=n.getZ(i);
    col.setHex(Math.abs(ny)>0.5?t[0]:Math.abs(nz)>0.5?t[1]:t[2]);
    c.setXYZ(i,col.r,col.g,col.b);
  }
  c.needsUpdate=true;
}
K.solid=function(w,h,d,o){
  o=o||{};
  var geo=new THREE.BoxGeometry(w,h,d);
  geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count*3),3));
  var mat=new THREE.MeshBasicMaterial({vertexColors:true,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
  var m=new THREE.Mesh(geo,mat);m.position.set(o.x||0,o.y||0,o.z||0);
  m.dim=[w,h,d];
  m.edges=null;
  if(o.edge!==null){m.edges=K.lines(boxEdges(w,h,d),{color:o.edge!==undefined?o.edge:pal.borderStrong,width:o.width||1});m.add(m.edges);}
  m.setTone=function(t){paint(geo,t);return m;};
  m.setEdge=function(c,wd){if(m.edges){m.edges.setColor(c);if(wd)m.edges.setWidth(wd);}return m;};
  /* a ghost is only its outline: the place where a thing can be */
  m.setGhost=function(g){mat.visible=!g;return m;};
  m.setTone(o.tone||TONE.paper);
  if(o.ghost)m.setGhost(true);
  return m;
};

/* ---------- pipes: a reference you can see ----------
   A thin square rod along a path of right-angled steps. It is empty until a value runs through it:
   fill(d) fills it from its start to the distance d along the path, in the tone set with tone(). show(i,on) hides a stretch that is not built. */
K.pipe=function(r,o){
  o=o||{};
  var R=r||0.05,FR=R+0.007,g=new THREE.Group(),segs=[],pts=[],vis=[],head=-1,AX=['x','y','z'];
  var fline=K.lines([],{color:pal.signalShadow});fline.setEdge=function(c){fline.setColor(c);return fline;};g.add(fline);
  function axis(a,b){var dx=Math.abs(b.x-a.x),dy=Math.abs(b.y-a.y),dz=Math.abs(b.z-a.z);return dx>dy?(dx>dz?0:2):(dy>dz?1:2);}
  /* a stretch as a box: th thick, and x0 and x1 longer than the stretch at its two ends */
  function put(m,a,b,th,x0,x1){
    var ax=axis(a,b),k=AX[ax],sg=b[k]>=a[k]?1:-1,L=Math.abs(b[k]-a[k]),len=L+x0+x1;
    m.position.set(a.x,a.y,a.z);m.position[k]=a[k]+sg*(L+x1-x0)/2;
    m.scale.set(ax===0?len:th,ax===1?len:th,ax===2?len:th);
  }
  /* The rod is drawn as one thing. Its lines are the long edges of every stretch, cut where it turns so that no stretch is
     drawn across another, the two edges of each corner, and a cap at each free end. `live` says which stretches are there;
     `h` is half the thickness; `flush` says whether a free end stops at its point or half a thickness beyond it.
     Returns the lines of each stretch, and how far each stretch reaches beyond its two points. */
  function outline(p,live,h,flush){
    var out=[],ext=[],i,j,e,s1,s2;
    function dir(i){var ax=axis(p[i],p[i+1]),k=AX[ax];return {ax:ax,sg:p[i+1][k]>=p[i][k]?1:-1};}
    function pt(ax,v,u1,c1,u2,c2){var q=[0,0,0];q[ax]=v;q[u1]=c1;q[u2]=c2;return q;}
    for(i=0;i<p.length-1;i++){
      out.push([]);ext.push([0,0]);
      if(!live[i])continue;
      var d=dir(i),ax=d.ax,k=AX[ax],u1=(ax+1)%3,u2=(ax+2)%3,lim=[[0,0,0,0],[0,0,0,0]];
      for(e=0;e<2;e++){
        var J=e?p[i+1]:p[i],us=e?d.sg:-d.sg,nb=-1,n=null;
        /* the stretch this one is joined to at this end: the nearest one that is there, if it begins where this one ends */
        if(e){for(j=i+1;j<p.length-1;j++)if(live[j]){if(p[j].distanceTo(J)<0.001)nb=j;break;}}
        else{for(j=i-1;j>=0;j--)if(live[j]){if(p[j+1].distanceTo(J)<0.001)nb=j;break;}}
        if(nb>-1){n=dir(nb);if(!e)n.sg=-n.sg;}
        for(s1=-1;s1<=1;s1+=2)for(s2=-1;s2<=1;s2+=2){
          var q=(s1>0?1:0)*2+(s2>0?1:0),v;
          if(!n)v=J[k]+us*(flush?0:h);
          else if(n.ax===ax)v=J[k];

/* TB.env: the sheet. A Fog ground with the faint MOTH grid on it, and nothing else.

(function(){

  var fine=[],coarse=[],X=44,Z=30,i;

<script>/* lantern.js */
/* TB.lantern: answer targets and overview markers, drawn with the diagram grammar. The name is kept for the integrator.

(function(){

<script>/* stations/s1.js */
/* Station 1, "Lagene" / "Layers": one physical system with four different jobs. The drawing is the game.

   The four levels belong to one frame and one grammar, but each is built for what it does:
   01 Primitive   stock. A heavy plinth. The tokens are solid ingots that hold a value: the name and the value are written
                  on the ingot; a colour is the top of it, a length is ruled on top of it.
   02 Semantic    routing. A thin perforated board. The tokens are low tiles and hold nothing: the pipe comes up through
                  the tile, is led sideways across its top, and goes on up somewhere else. That sideways run is the mapping.
   03 Component   assembly. A bench. The tokens are bases, and on each base stands the actual part, in pieces.
                  The button's background and its face; the card's frame and its content. A value makes the part.
   04 Interface   output. No floor, only a sill and a sheet: the rendered interface.

   The story is the chain, not the levels: blue-900 -> accent -> button.primary.background -> the button,
   and space-32 -> inset -> card.padding -> the card.

   THE PIPE IS THE REFERENCE. A pipe connects two layers only when a token on the upper one points at a token on the lower
   one and both tokens have been put in place. A primitive on its own has no pipe. A value reaches the interface only when
   its chain is whole. The state of the model is therefore nothing but: which tokens are placed, and what `accent` points to.

   THE STRUCTURE SPEAKS MOTH. THE VALUE SPEAKS ITSELF. Decks, frame, tokens, pipes, tabs, lines and type are MOTH. Wherever the
   model shows a concrete token value, the value is drawn as what it is:
   a colour   is that colour. The top of a colour ingot is its colour, always, whether anything points at it or not. A pipe
              that carries it is filled with it, the part it makes has it, and so has the button on the sheet. #0265dc while
              `accent` points to blue-900, #464646 when it points to grey-700: one colour from the ingot to the interface.
   a length   is a measure. space-32 carries a rule on top of its ingot, the same rule runs through its pipe, and on the sheet
              it is the rule across the padding. A length has no colour, so it is drawn in the ink of the drawing.
   A semantic or a component token is a role or a use, not a value: its block stays paper. What it resolves to is seen only
   in the pipe that passes through it.
   Signal is not the colour of a value any more. It is left to MOTH's own interaction (the answer targets, focus).
   Running, at rest and set aside are told by the structure, not by the value: ink lines and a moving head while a value runs,
   slate lines at rest, pale lines while the other chain is looked at. The value itself never fades.
   The button on the sheet can be pointed at and pressed as soon as its chain has made it. That is the payoff of building the
   chain, not a lesson: pointing and pressing change its form, never its colour, because no token defines another colour.
   No arrows, no alias labels: direction is the movement itself.

   Play. A loose part (the token in question) waits to the left; three candidate paths lead to a place on each layer.
   On the wrong layer the part stops at the door, the layer is crossed out, and the part comes back: it stays loose.
   On the right layer it goes to its own place in its chain, the reference it carries becomes a pipe, and the value runs as
   far as the chain now reaches. Three placements make a chain, and the third one changes the interface.

   One reference moved. After the six placements a second primitive, grey-700, stands on the plinth with no pipe. The player
   moves the foot of the pipe under `accent` from blue-900 to grey-700. The blue draws back out of the chain into its ingot,
   the foot is carried over, and the grey rises through the same pipes. Only that stretch moves: the tile, the base and the
   pipe between them stay where they are, and the button on the sheet changes colour.

   Afterwards the model can be inspected chain by chain, the reference can be moved back and forth, and the model can be
   turned, pulled apart and put together. */
(function(){

TB.i18n.add({

  var group,ctx0,round=null,inLevel=false;

  var ticks,rule,pvis=[[],[]],p0bg,p0face,p0txt,p1frame,p1content;
  /* What has been built: how many of the six tokens are in place (in the order of the level), what `accent` points to

  var placed=0,ref=0,spare=false,doneLit=false;

  var fx=NX[0][0],lift=0,srcI=0,moving=false,rpOpen=false,hovPrim=-1;
  /* the picture of the two chains, derived from the state above; inspection and a running value drive it directly.

  /* ---------- where things are, for the current amount of separation ---------- */
  function base(i){return B0[i]+(B1[i]-B0[i])*kx;}
  function top(i){return base(i)+TH[i];}
  function footX(i){return i===1?ALT.x:NX[0][0];}
  /* The way a value takes: up out of the ingot, through the board, sideways over the tile, up through the bench into the part,
     up into the sill. Under the board the pipe of the colour chain can step sideways to another ingot: that stretch, and only
     that stretch, is what moves when `accent` is pointed somewhere else. Above the board nothing depends on where the foot is. */
  function path(c){
    var xa=NX[c][0],xc=NX[c][2],y0=top(0)+HN[0],yS=top(1)+HN[1]+PR,yP=top(2)+HN[2];

  function paintParts(){

  function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();}
  /* the interface: a card with a heading, two lines of text and one button. Drawn in world units.

     The button is drawn in the colour its token resolves to, the padding as the measure it resolves to. */
  function drawCrt(){
    var c=crtTex.image.getContext('2d'),R=200,css=K.css;

    c.fillStyle=css(pal.fog);c.fillRect(0,0,SCW,SCH);
    var pad=INSET+PADMAX*mon.pad,cx=CX,cy=CY,cw=CW,ch=CH,px=1/R,x0;
    /* the card grows around its content by the padding */
    rr(c,cx-pad,cy-pad,cw+2*pad,ch+2*pad,0.12);c.fillStyle=css(pal.surface);c.fill();c.lineWidth=2*px;c.strokeStyle=css(pal.borderStrong);c.stroke();

    }

    c.fillStyle=css(pal.borderStrong);c.fillRect(cx,cy+0.46,cw,0.1);c.fillRect(cx,cy+0.68,2.5,0.1);
    var bx=cx,by=cy+ch-BTH,bw=BTW,bh=BTH,s=TB.t('s1.send')+' →';
    /* Where a pipe arrives under the sheet, the value goes on as it came. The colour as a trace of the pipe's width, up to the
       button. The length as the rule, up to the edge of the card, and there it is the same measure as on the ingot: the rule
       across the band. */
    if(mon.tr[0]){x0=NX[0][2]-SL;c.fillStyle=css(OUT[mon.ref]);c.fillRect(x0-PR,by+bh,2*PR,SCH-(by+bh));}
    if(mon.tr[1]){

      for(i=1;yb+i*RSTEP<SCH;i++)c.fillRect(x0-RTICK,yb+i*RSTEP-px,2*RTICK,2*px);
      if(mon.pad>0.01){
        c.fillRect(x0-t/2,y1,t,L);
        for(i=0;i<=8;i++){var tl=i%8===0?0.16:0.08;c.fillRect(x0-tl,y1+L*i/8-t/2,2*tl,t);}
      }
    }
    /* A finished button answers to the pointer. Its colour is the token's and nothing else: no token says what it should be
       when it is pointed at or pressed, so those states change its form only. Pointed at: an outline, and the arrow moves on.
       Pressed: it goes down. Let go: it says what it did. */
    var live=mon.btn,dn=live&&btnDown?0.035:0,hot=live&&btnHov&&!btnDown;
    if(hot){rr(c,bx-0.06,by-0.06,bw+0.12,bh+0.12,0.14);c.lineWidth=3*px;c.strokeStyle=css(OUT[mon.ref]);c.stroke();}
    rr(c,bx,by+dn,bw,bh,0.08);
    if(live){c.fillStyle=css(OUT[mon.ref]);c.fill();}
    else{c.fillStyle=css(pal.white);c.fill();c.lineWidth=2*px;c.strokeStyle=css(pal.borderStrong);c.stroke();}
    c.setTransform(1,0,0,1,0,0);c.font='400 '+(0.29*R)+'px '+K.FACE;c.textBaseline='middle';
    c.fillStyle=css(live?pal.white:pal.slate);
    var ty=(by+dn+bh/2+0.01)*R,mx=(bx+bw/2)*R;
    if(live&&btnSent){c.textAlign='center';c.fillText(TB.t('s1.sent'),mx,ty);}
    else{
      var word=TB.t('s1.send')+' ',ww=c.measureText(word).width,aw=c.measureText('→').width,x0=mx-(ww+aw)/2;

  /* The picture at rest. A token is there when it has been placed. A pipe is there when the token above points at the token
     below and both are there. A chain that is whole has delivered its value: the part is made and the interface has changed. */
  function fromState(){
    [0,1].forEach(function(c){
      var b=c*3,s=cs[c],n0=placed>b,n1=placed>b+1,n2=placed>b+2;
      s.n=[n0?1:0,n1?1:0,n2?1:0];
      s.k=[n1?1:0,n2?1:0,n2?1:0];
      s.on=false;s.d=-1;s.run=false;s.part=n2;s.asm=n2?1:0;
    });
    mon.btn=placed>=3;mon.ref=ref;mon.pad=placed>=6?1:0;mon.band=false;mon.focus=-1;mon.tr=[false,false];recede=false;
    fx=footX(ref);lift=0;srcI=ref;
  }
  /* the rule on the pipe of the length chain, from its ingot to the distance d: a line on the face of the pipe, a mark every RSTEP */
  function layRule(q,d,t){
    var segs=[],z=ZC+PR+0.012,i,k,s0=0;
    for(i=0;i<q.p.length-1&&d>s0;i++){
      var a=q.p[i],b=q.p[i+1],L=q.D[i+1]-q.D[i],e=Math.min(L,d-s0),up=Math.abs(b.y-a.y)>Math.abs(b.x-a.x),sg;
      if(pvis[1][i]>0&&L>0.001&&e>0.002){
        sg=up?(b.y>a.y?1:-1):(b.x>a.x?1:-1);
        if(up)segs.push([a.x,a.y,z,a.x,a.y+sg*e,z]);else segs.push([a.x,a.y,z,a.x+sg*e,a.y,z]);

        for(k=Math.ceil((s0+0.02)/RSTEP);k*RSTEP<=s0+e;k++){

  /* ---------- a value on its way ---------- */
  function click(n){try{TB.audio.play(n);}catch(e){}}

  }
  function reachScreen(c,tag){

  /* run the value on to point `to` of the path (TILE, ACROSS the tile, the PART, END: the interface) */

  /* before a value is sent: the part in pieces, the interface untouched */
  function before(c){

  }

  /* Token j of the level has just been placed (0..5: three for the colour chain, three for the spacing chain).

  /* ---------- one reference, moved ---------- */
  /* `accent` is pointed at the other colour primitive. First the value that is in the chain leaves it: the colour draws back
     from the interface, out of the part and down the pipes into its ingot, so the button on the sheet and the button on the
     bench lose it. Then the foot of the empty pipe leaves that ingot, is carried under the board to the other one and set
     down, and the colour of that ingot rises the same way up. Nothing above the board has moved. */
  function repoint(to,tell,instant){
    function told(){if(tell&&ctx0&&ctx0.notify)ctx0.notify('repointed');}

    if(instant||placed<3||!spare||(to===ref&&!moving)){ref=to;moving=false;rpOpen=false;fromState();show();told();return;}
    var s=cs[0],l0,x0,was,d0;

  /* ---------- the loose part ---------- */
  function partHome(on,text){

    if(on){var l=wrapToken(text,17);partLabel.opt.size=l.length>1?0.26:0.3;partLabel.setText(l,{color:pal.ink});}
  }

  /* ---------- the finished model: inspect a chain, before and after ---------- */
  function complete(){return placed>=6;}
  function snap(){if(!moving)return;K.clear(RP);tok.visible=false;moving=false;fromState();}
  function inspectable(){return !moving&&complete()&&!round;}
  function hi(){return hov>=0?hov:sticky;}

  /* what the model shows when no question is waiting: nothing built, or everything, as the level was left when it was completed */
  function rest(){

  }
  function reset(){

  /* not on this layer: the part stops at the door, the layer is crossed out, and the part goes back to where it waits */

    K.travel(part,[riserPt(ch),riserPt(ch).setX(RX+0.3)],0.7,function(){
      K.after(0.5,function(){K.travel(part,[riserPt(ch),V(RX,BH/2,ZC)],0.8,null,TAG);},TAG);
    },TAG);

  }
  function onResult(data){
    if(!round)return;

      if(!moving&&ref!==R.to){ref=R.to;rpOpen=false;fromState();show();}
      return;
    }

      d=R.answer;ch=data.id?+String(data.id).slice(1):d;if(!(ch>=0&&ch<3))ch=d;

          strike(ch);mark(d);

            K.after(0.8,function(){K.travel(part,[riserPt(ch),riserPt(d),bayPt(d)],1.1,land,TAG);},TAG);

    /* the finished model can be inspected, and its reference moved (see TB.world.hasModel) */
    model:true,
    cam:{az:-24,el:26,margin:0.9},
    /* what must be in view. Always the model as it is when pulled apart, so taking it apart is movement and not a zoom.
       While a part is waiting to be placed also the loose part; when nothing is loose the camera moves in. */
    box:function(){var fin=(complete()&&!round)||(round&&round.R.type==='repoint');return [[fin?-SW/2:RX-BW/2,0,-SD/2],[SW/2,B1[3]+TH[3]+SCH,ZF]];},
    build:build,
    /* answer targets: for the layer question, a place on each layer; for lettered questions, small solids where the loose part waits */
    targetStyle:function(layout,n){return layout==='tiers'&&n===3?{bay:{w:BW+0.012,h:BH+0.006,d:BD+0.012},delay:kx<0.99?0.8:0}:(n<=4?{key:true,delay:kx<0.99?0.8:0}:null);},

      if(n<=4){for(i=0;i<n;i++)out.push(V(RX-0.35+(i-(n-1)/2)*0.9,0.32,ZC));return out;}

       whenever no question is waiting. During the level it is built by what the player places. */
    setLit:function(f){

      if(!group||round||moving)return;

    on:function(evt,data){
      if(evt==='enter'){far=false;reset();rest();show();}
      else if(evt==='leave'){far=true;reset();rest();show();setExplode(0,true);}
      else if(evt==='idle'){reset();rest();show();setExplode(0);}

      else if(evt==='miss')onMiss(data);
      else if(evt==='result')onResult(data);

        var keep=ref;reset();placed=6;ref=keep;spare=true;fromState();show();

      else if(evt==='press'){if(data&&data.id==='send'&&sendHit.visible){btnDown=true;click('ui');drawCrt();}}
      else if(evt==='release'){if(btnDown){btnDown=false;drawCrt();}}
      else if(evt==='hover'){
        var id=data&&data.id,hp,onBtn=id==='send'&&sendHit.visible;
        if(onBtn!==btnHov){btnHov=onBtn;drawCrt();}
        if(round){
          if(round.R.type==='repoint'){hp=rpOpen&&id==='prim'+(1-ref)?1-ref:-1;if(hp!==hovPrim){hovPrim=hp;show();}return;}
          var b=id&&/^o[0-2]$/.test(id)&&round.R.fixed?+id.slice(1):-1;if(b!==hovBay){hovBay=b;show();}return;
        }

        var h=id==='chain0'||id==='prim'+ref?0:id==='chain1'?1:-1;
        if(h===hov&&hp===hovPrim)return;
        var was=hi();hov=h;hovPrim=hp;
        if(hi()!==was)highlight(hi(),hi()>=0);else show();
      }
      else if(evt==='pick'){
        if(!data)return;

          if(!sendHit.visible)return;
          btnSent=true;click('pick');drawCrt();K.clear(SB);K.after(1.3,function(){btnSent=false;drawCrt();},SB);return;
        }
        /* the colour primitive that is not in use: point `accent` at it */
        if(data.id==='prim'+(1-ref)&&(rpOpen||inspectable())){if(ctx0&&ctx0.notify)ctx0.notify('repoint',{to:1-ref});return;}
        if(!inspectable())return;
        var p=data.id==='chain0'||data.id==='prim'+ref?0:data.id==='chain1'?1:-1;if(p<0)return;
        sticky=sticky===p?-1:p;highlight(hi(),hi()>=0);
        if(ctx0&&ctx0.notify)ctx0.notify('inspect',{chain:sticky});
      }
      else if(evt==='inspect'){
        if(moving&&complete()&&!round)snap();
        if(!inspectable())return;
        sticky=data&&data.chain!==null&&data.chain!==undefined?data.chain:-1;highlight(hi(),hi()>=0);
      }
      else if(evt==='explode'){if(!round)setExplode(data&&data.k?1:0);}
      /* the wheel pulls the layers apart and pushes them together, when no question is waiting */
      else if(evt==='wheel'){if(round)return;K.clear(XP);kx=Math.max(0,Math.min(1,kx-data.dy*0.0014));layout();tellSplit();}
      else if(evt==='lang')show();
    }
  };
})();
})();

<script>/* stations/s2.js */
/* Station 2, "Navnet" / "The name": a name is an address. The plant puts a name together and then uses it as one.

   What stands here, and what each thing is for:
   the racks   the words a name can be built from, one stack per level: component, variant, property, state. Each stack
               hangs under the place its words can stand in.
   the rail    four places in a row, one per level, each named on its tab. A word taken from its rack is set in its place.
               A place that is empty is an outline: that level is left out of the name. At the end of the rail stands the
               value the new token will hold, drawn as what it is, and under it the key that creates the token.
   the line    one pipe from the rail to the board. Its foot is at the place of the component, because the board is that
               component: a name with no component leaves the foot in the air, and nothing it holds can reach the board.
   the board   one component, the button, in a grid: a row per variant, a column per state. Every button is drawn from the
               tokens that exist and from nothing else. A part no token describes is an outline, a square corner, no stroke.

   THE NAME NARROWS THE BOARD. Whatever the name on the rail describes is marked on the board in ink, at once, for every word
   that is put in or taken out: the row and column names it reaches, and the parts themselves. A frame around the button is its
   background, a rule under the label its text, a frame on the edge its border, four corner marks its radius.

   THE NAME IS USED AS AN ADDRESS. Creating the token is work the plant does, one step after the other:
   1 the words close up into one token: one solid with one outline, a level that is left out a blank stretch of it;
   2 the token takes up the value: a pipe from the token to the value, and the value runs through it into the token;
   3 the value leaves the token at the component, runs up the line and comes out in front of the board;
   4 it is delivered to every part the name describes, one part after the other in reading order, and while it is on its
     way to a part only the row and the column of that part are in ink: the address being read. Eight parts are eight
     deliveries, one part is one.
   A wrong name does exactly this, to the parts it does describe. Then the value goes back the way it came, part by part,
   down the line, through the token into its block, and the token comes apart into words again. A right one stays.

   THE STRUCTURE SPEAKS MOTH. THE VALUE SPEAKS ITSELF. A colour is that colour on top of the value block, in the pipes, on its
   way over the board and on the button. A length has no colour: a border is a stroke of its width in its colour, a radius
   is a rule on the pipe and curvature on what carries it. Ink lines are what is chosen and what runs, slate is at rest.

   State lives in core. Everything here is drawn from `st` (the name on the rail, the tokens that exist) every time. A commit
   is one run over a timeline: every picture of it is a function of the state and of how far the run has come, and it can be
   dropped at any moment. */
(function(){

/* the board, in its own units from its top left corner: a frame with the names, and a cell per variant and state */

/* a button on the board: 1.4 wide is about 112 px, so a pixel of a token value is PXU */
var BTW=1.4,BTH=0.6,PXU=0.0125,LBL=0.26;
/* The way of the value. YA: the height at which a pipe meets the end of a word. The line to the board leaves the rail at the
   place of the component, goes round the end of the deck (XL), up beside the board and ends open in front of it (EX), on the
   line between the two rows. HS: the size of the piece of the value that is carried. ZQ: the plane in front of the board in
   which it is carried. Seen from the camera that plane lies a little to the right of the board and below it, so the way is
   set off by QX and QY: YQ is the height at which it is seen to run along the line between the rows.
   POKE: how far it is pushed from that line against the button above or below it. */

   thru: through it; b: up the line; entry: from the open end to the first part; step: from part to part, and `spread` the

   Wrong only: `total` the whole run, hold: how long the wrong result stands; ret, bb, ab, apart: the way back. */

(function(){var x=X0,s;for(s=0;s<4;s++){SX[s]=x+SWD[s]/2;x+=SWD[s]+GAP;}VX=x-GAP+0.4+VW/2;DXR=VX+VW/2+0.1;})();
function V(x,y,z){return new THREE.Vector3(x,y,z);}

function rect(x,y,z,w,d){return [[x-w/2,y,z-d/2,x+w/2,y,z-d/2],[x+w/2,y,z-d/2,x+w/2,y,z+d/2],[x+w/2,y,z+d/2,x-w/2,y,z+d/2],[x-w/2,y,z+d/2,x-w/2,y,z-d/2]];}
