<title>TOKENWORKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
/* MOTH: TOKENWORKS HUD. Every value here is a MOTH token (see MOTH.md).
   The game is one light artefact in the Slides & social mode: Inter 700 / 600 / 400, tracking 0, uppercase eyebrows with a short bar,
   1px rules. The type ramp is the 1920-wide ramp at two thirds, because the artefact is that much smaller (--k).
   Colour: none. The panel is monochrome: Signal belongs to the model, where it means a value and nothing else.
   Right is the dark one with a filled mark; wrong is struck through with a hollow mark. */
:root{
  color-scheme:light;
  --midnight:#1A1E31;--midnight2:#2A3050;
  --fog:#F5F6FA;--surface:#FCFCFD;--chip:#ECEEF4;--border:#DDE0EA;--border-strong:#C2C7D6;
  --ink:#1C1E29;--slate:#5C617A;--mist:#8E93A8;--white:#FFFFFF;
  --signal:#3A6EE8;--signal-shadow:#2B4FB8;--signal-tint:rgba(58,110,232,.10);
  --sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --k:.6667;
  --t-title:700 calc(54px*var(--k))/1.18 var(--sans);
  --t-card:700 calc(42px*var(--k))/1.19 var(--sans);
  --t-label:600 calc(32px*var(--k))/1.22 var(--sans);
  --t-quote:600 calc(28px*var(--k))/1.22 var(--sans);
  --t-body:400 calc(27px*var(--k))/1.4 var(--sans);
  --t-small:400 calc(24px*var(--k))/1.45 var(--sans);
  --t-eyebrow:600 calc(22px*var(--k))/1.2 var(--sans);
  --t-tag:600 calc(18px*var(--k))/1.2 var(--sans);
  --t-caption:400 calc(18px*var(--k))/1.35 var(--sans);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--fog);color:var(--ink);font-family:var(--sans)}
.game{position:fixed;inset:0;overflow:hidden;background:var(--fog);color:var(--ink);font:var(--t-small);-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1,'cv11' 1}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.no3d #gl,.no3d .vf{display:none}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;margin:0;cursor:pointer;text-align:left}
button:disabled{cursor:default}
:focus{outline:none}
:focus-visible{outline:2px solid var(--midnight);outline-offset:2px}
h1,h2,h3,p,ol,ul,figure{margin:0;padding:0}
ol,ul{list-style:none}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
/* a token name in running text: a chip you can see. The fill alone is too close to the surface, so it has a 1px edge;
   without it the padding reads as a stray indent. */
code{font:inherit;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--border-strong);white-space:nowrap}
kbd{font:var(--t-tag);display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:8px;background:var(--chip);color:var(--slate);text-transform:uppercase}
small{font:var(--t-caption);color:var(--slate)}
.label{font:var(--t-tag);text-transform:uppercase;color:var(--slate)}
/* eyebrow: uppercase, with a short bar above */
.kicker{font:var(--t-eyebrow);text-transform:uppercase;color:var(--slate)}
.kicker::before{content:'';display:block;width:32px;height:2px;margin-bottom:8px;background:var(--midnight)}

/* ---------- caption under the drawing, bottom left ---------- */
.vf{position:absolute;left:calc(var(--il,0px) + 24px);bottom:calc(var(--ib,0px) + 24px);pointer-events:none;font:var(--t-caption);color:var(--slate);display:flex;gap:8px;flex-wrap:wrap}
.vf-a{color:var(--ink);font-weight:600}
.vf-b::before{content:'·';margin-right:8px}
.vf-b:empty{display:none}

/* ---------- frame ---------- */
.hud{position:absolute;inset:0;pointer-events:none}
.hud-top{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:16px;padding:0 16px 0 0;background:var(--surface);border-bottom:1px solid var(--border);pointer-events:auto}
.mark{display:flex;align-items:center;gap:12px;height:100%;padding:0 16px}
.mark-m{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--midnight);color:var(--white);font:700 14px/1 var(--sans);flex:none}
.mark:hover .mark-m{background:var(--midnight2)}
.mark-word{font:700 16px/1 var(--sans)}
/* on the title page the name is the heading: it is not said twice */
.game[data-view="title"] .mark-word{visibility:hidden}
.mark-sub{font:var(--t-caption);color:var(--slate);padding-left:12px;border-left:1px solid var(--border)}
.chain{display:flex;gap:4px;margin-left:auto}
.node{width:32px;height:32px;display:grid;place-items:center;position:relative;border:1px solid var(--border-strong);font:var(--t-tag);color:var(--slate);background:var(--surface)}
.node:hover{color:var(--ink);border-color:var(--ink)}
.node.is-done{color:var(--ink)}
.node.is-done::after{content:'';position:absolute;left:-1px;right:-1px;bottom:-1px;height:2px;background:var(--midnight)}
.node.is-here{background:var(--midnight);color:var(--white);border-color:var(--midnight)}
.snd{font:var(--t-caption);color:var(--slate);height:32px;padding:0 4px;flex:none;white-space:nowrap}
.snd:hover{color:var(--ink)}
.snd-s{display:none}
.lang{display:flex;align-items:stretch;flex:none;height:32px;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;font:var(--t-tag)}
.lang b,.lang span{display:grid;place-items:center;padding:0 8px;font-weight:600}
.lang b{background:var(--midnight);color:var(--white)}
.lang span{color:var(--slate);background:var(--surface)}
.lang:hover{border-color:var(--ink)}

.dock{position:absolute;left:0;top:56px;bottom:0;width:clamp(480px,34vw,600px);pointer-events:none}
.panel{pointer-events:auto;height:100%;overflow:auto;overscroll-behavior:contain;padding:32px 40px 40px;border-right:1px solid var(--border);background:var(--surface);scrollbar-width:thin;scrollbar-color:var(--border-strong) var(--surface)}
.no3d .dock{width:auto;right:0}

/* ---------- buttons: one button. Verbs, sentence case, a trailing arrow. Signal is never a button colour. ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:60px;padding:0 24px;border:1px solid var(--midnight);border-radius:8px;background:var(--midnight);color:var(--white);font:400 17px/1 var(--sans)}
.btn::after{content:'\2192'}
.btn:hover{background:var(--midnight2);border-color:var(--midnight2)}
.btn:disabled{background:var(--chip);color:var(--mist);border-color:var(--chip)}
.btn.ghost{background:var(--white);color:var(--midnight);border-color:var(--border-strong)}
.btn.ghost:hover{border-color:var(--midnight);background:var(--white)}
.btn.sm{min-height:24px;padding:0;border:0;background:none;color:var(--slate);font:var(--t-caption)}
.btn.sm::after{content:none}
.btn.sm:hover{color:var(--ink);background:none}
.cta,.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}

/* ---------- title ---------- */
.title h1{font:var(--t-title);margin:8px 0 16px}
.lede{font:var(--t-body);color:var(--slate);max-width:40ch}
.lvls{margin-top:40px;border-bottom:1px solid var(--border)}
.lvl{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:start;width:100%;padding:16px 0;border-top:1px solid var(--border)}
.lvl:hover b{text-decoration:underline;text-underline-offset:3px}
.lvl-n{font:var(--t-tag);color:var(--slate);padding-top:3px}
.lvl-body b{font-weight:600}
.lvl-body>span{display:block;color:var(--slate)}
.lvl-body small{display:block;margin-top:4px}
.lvl-res{font:var(--t-caption);color:var(--slate);white-space:nowrap;padding-top:2px}
.lvl-res.is-done{color:var(--ink);font-weight:600}
.how{margin-top:16px;font:var(--t-caption);color:var(--slate)}

/* ---------- play frame ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-bottom:16px;margin-bottom:24px;border-bottom:1px solid var(--border)}
.bar-t{display:flex;align-items:baseline;gap:8px;min-width:0}
.bar-t code{font:var(--t-tag);color:var(--slate);background:none;box-shadow:none;padding:0}
.bar-t b{font-weight:600}
.score{margin-left:auto;font:var(--t-caption);color:var(--slate);white-space:nowrap}
/* progress: square marks. Filled is right, hollow is wrong, the short one is where you are. */
.ticks{flex-basis:100%;display:flex;gap:4px;align-items:center}
.ticks i{flex:1;max-width:16px;height:8px;background:var(--border)}
.ticks i.ok{background:var(--midnight)}
.ticks i.no{background:none;box-shadow:inset 0 0 0 1px var(--midnight)}
.ticks i.now{background:var(--slate);height:4px}
.ticks i.x{max-width:8px}
.note{font:var(--t-caption);color:var(--slate);margin:-8px 0 16px}
.qid{margin-bottom:8px}
.q{font:var(--t-label);max-width:26ch}
.q:focus,.q:focus-visible{outline:none}
.hint{font:var(--t-caption);color:var(--slate);margin-top:8px}

/* read first */
.helprow{margin-top:16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.helpbtn:disabled{color:var(--border-strong);text-decoration-color:transparent;cursor:default}
.helpbtn.auto{margin-left:auto;text-decoration:none}
.helpbtn{font:var(--t-caption);color:var(--slate);text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:3px}
.helpbtn:hover{color:var(--ink);text-decoration-color:var(--ink)}
.help{margin-top:16px;padding:24px;border:1px solid var(--border);border-radius:12px;background:var(--fog)}
.help-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.help h3,.card h3{font:var(--t-quote);margin-bottom:8px}
.help p,.card-b p{margin-top:8px}
.help .ctx,.card-b .ctx{padding-left:16px;border-left:2px solid var(--midnight)}
.help small,.card-b small{display:block;margin-top:16px}

/* the token in question. Neutral here: in the drawing it is the loose part, and that is where the focal is. */
.tokbox{margin-top:24px;padding:16px;border:1px solid var(--border-strong);background:var(--white)}
.tok{font:var(--t-label);margin-top:4px}
.tokval{font:var(--t-caption);color:var(--slate);margin-top:4px}
.tokval code{background:none;box-shadow:none;padding:0;color:var(--ink);white-space:normal}
.arr{font-style:normal;margin-right:2px}
.sw{display:inline-block;width:12px;height:12px;border:1px solid var(--border-strong);vertical-align:-2px;margin-right:8px}

/* options */
.opts{display:grid;gap:8px;margin-top:24px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;min-height:48px;padding:12px 16px;border:1px solid var(--border-strong);border-radius:8px;background:var(--white)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.led{width:8px;height:8px}
.opt.is-right{border-color:var(--midnight);box-shadow:inset 0 0 0 1px var(--midnight)}
.opt.is-right .led{background:var(--midnight)}
.opt.is-right kbd{background:var(--midnight);color:var(--white)}
.opt.is-wrong span{text-decoration:line-through;color:var(--slate)}
.opt.is-wrong .led{box-shadow:inset 0 0 0 1px var(--ink)}
.opt.is-dim{color:var(--slate);border-color:var(--border)}
/* the three layers, stacked as in the drawing: primitive lowest. Bands of a layer stack: square, with an edge bar. */
.opts.tiers{display:flex;flex-direction:column-reverse;gap:8px}
.opts.tiers .opt{grid-template-columns:auto 1fr auto;border-radius:0;padding-left:22px;position:relative}
.opts.tiers .opt::before{content:'';position:absolute;left:-1px;top:-1px;bottom:-1px;width:6px;background:var(--border-strong)}
.opts.tiers .opt:hover:not(:disabled)::before{background:var(--ink)}
.opts.tiers .opt.is-right::before{background:var(--midnight)}
.opts.tiers .opt.is-dim::before{background:var(--border)}
.tc{font:var(--t-tag);font-style:normal;font-variant-numeric:tabular-nums;color:var(--slate)}
/* the order number is also the key to press, so the key cap is not shown a second time */
.opts.tiers kbd{display:none}
.opts.tiers .led{order:4}
.opts.tiers .opt span{font-weight:600}

/* a part on the wrong layer: the hollow mark, and a hint about how to read the token */
.miss{margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.miss b{display:flex;align-items:flex-start;gap:8px;font-weight:600}
.miss b::before{content:'';width:8px;height:8px;flex:none;margin-top:.5em;box-shadow:inset 0 0 0 1px var(--ink)}
.miss p{margin-top:8px}
/* what a token points to: the primitives it can take its value from */
.label+.opts.refs{margin-top:8px}
.opts.refs .opt span{display:flex;align-items:center;flex-wrap:wrap;gap:0 8px}
.opts.refs code{background:none;box-shadow:none;padding:0}
.opts.refs .sw,.modes.refs .sw{margin-right:0}
.opts.refs .opt.is-dim code{color:var(--slate)}
.refline{font:var(--t-caption);color:var(--slate);margin-top:8px}
.modes.refs{margin-top:8px}
.modes.refs .seg-btn.is-on .sw{border-color:var(--white)}
.modes.refs .seg-btn{display:inline-flex;align-items:center;gap:8px;text-transform:none}
.modes.refs+.fine{margin-top:16px}
.done.aha .more .label.read{margin-top:24px}
.done.aha .more .cards{margin-top:8px}

/* label / build */
.segs{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px;margin-top:16px}
.seg{display:block;padding:8px 12px;border:1px solid var(--border-strong);background:var(--white);font-weight:600}
.seg small{display:block;margin-top:4px;font:var(--t-tag);text-transform:uppercase;color:var(--slate)}
.seg:hover:not(:disabled){border-color:var(--ink)}
.seg.is-on{background:var(--midnight);color:var(--white);border-color:var(--midnight)}.seg.is-on small{color:var(--white)}
.seg.is-right{border-color:var(--midnight);box-shadow:inset 0 0 0 1px var(--midnight)}
.seg.is-wrong>span{text-decoration:line-through}
.dash,.sep{color:var(--mist);line-height:2.4}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--white);font-weight:600}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip:disabled{color:var(--mist);border-color:var(--border);text-decoration:line-through}
.slot{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:56px;margin-top:16px;padding:8px;border:1px solid var(--border-strong);background:var(--fog)}
.slot em{font:var(--t-caption);font-style:normal;color:var(--slate);padding-left:8px}

/* order */
.sort{display:grid;gap:8px;margin-top:16px}
.ord{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;min-height:48px;padding:12px 16px;border:1px solid var(--border-strong);border-radius:8px;background:var(--white)}
button.ord:hover:not(:disabled){border-color:var(--ink)}
.num{font:var(--t-tag);font-style:normal;display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--border-strong);color:var(--slate)}
.ord.is-set{border-color:var(--ink)}.ord.is-set .num,.sort.done .num{background:var(--midnight);color:var(--white);border-color:var(--midnight)}
.ord.is-right{border-color:var(--midnight);box-shadow:inset 0 0 0 1px var(--midnight)}
.ord.is-wrong>span{text-decoration:line-through;color:var(--slate)}
.sort.done .ord{grid-template-columns:auto 1fr;min-height:0;border-color:var(--border);color:var(--slate)}
.label+.sort{margin-top:8px}.sort+.label,.verdict+.label{margin-top:24px}
p.label{margin-top:16px}p.label.qid{margin-top:0}

/* code: a dark frame. MOTH has no code type; outside level 1 this is not designed yet. */
.codebox{margin-top:16px;border-radius:12px;background:var(--midnight);color:var(--white);font:400 13px/1.7 ui-monospace,'SF Mono',Menlo,Consolas,monospace;overflow-x:auto}
.codebox ol{counter-reset:ln;padding:12px 0}
.codebox li{counter-increment:ln;display:grid;grid-template-columns:32px 1fr}
.codebox li::before{content:counter(ln);color:var(--mist);text-align:right;padding-right:8px;font-size:11px;line-height:2}
.ln{display:block;width:100%;padding:0 12px 0 4px;white-space:pre-wrap;font:inherit}
button.ln:hover:not(:disabled){background:var(--midnight2)}
.ln.is-hit{background:var(--midnight2);box-shadow:inset 3px 0 0 var(--white)}
.ln.is-bad{text-decoration:line-through;color:var(--mist)}
.k{font-weight:700}

/* wiring exercise */
.wire{margin-top:16px}
.modes{display:flex;gap:4px}
.seg-btn{font:var(--t-tag);min-height:32px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;color:var(--slate);background:var(--white)}
.seg-btn.is-on{background:var(--midnight);color:var(--white);border-color:var(--midnight)}
.wtbl{margin-top:16px;border-bottom:1px solid var(--border)}
.wrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:end;padding:8px 0;border-top:1px solid var(--border)}
.wrow.is-sel{background:var(--fog)}
.wname code{display:inline-block;font:var(--t-caption);font-weight:600}
.wname span{display:block;font:var(--t-caption);color:var(--slate);margin-top:2px}
.wcell{display:block}
.wmode{display:block;font:var(--t-tag);text-transform:uppercase;color:var(--slate)}
.wsel{display:flex;align-items:center;gap:0}
.wsel select{font:var(--t-caption);color:var(--ink);background:var(--white);border:1px solid var(--border-strong);border-radius:0 8px 8px 0;height:32px;padding:0 4px;max-width:112px}
.wsel .sw{width:32px;height:32px;margin:0 -1px 0 0;vertical-align:0}
.pvs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.pv figcaption{font:var(--t-tag);text-transform:uppercase;color:var(--slate)}
.mock{padding:16px;border:1px solid var(--border);border-radius:12px}
.m-t{font-weight:600}.m-m{font:var(--t-caption);margin:2px 0 8px}.m-b{display:inline-block;padding:4px 8px;border-radius:8px;font:var(--t-caption);font-weight:600}
.tally{font:var(--t-caption);color:var(--slate);margin-top:16px}
.checks{margin-top:8px;border-bottom:1px solid var(--border)}
.checks li{display:grid;grid-template-columns:40px 1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--border);font:var(--t-caption)}
.checks .md{text-transform:uppercase;color:var(--slate)}
.checks .rt{white-space:nowrap}
.checks .pass .rt{color:var(--ink);font-weight:600}.checks .fail .rt{color:var(--slate);text-decoration:line-through}
.locked{margin-top:16px;font:var(--t-caption);color:var(--slate)}
.locked summary{cursor:pointer}
.locked ul{margin-top:8px;padding-left:16px}
.fine{font:var(--t-caption);color:var(--slate);margin-top:8px}

/* verdict: a square mark and a word. Filled is right, hollow is not. */
.verdict{margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.verdict b{display:block;position:relative;padding-left:16px;font-weight:600}
.verdict b::before{content:'';position:absolute;left:0;top:.5em;width:8px;height:8px}
.verdict.ok b::before{background:var(--midnight)}
.verdict.no b::before{box-shadow:inset 0 0 0 1px var(--ink)}
.verdict p{margin-top:8px}
.verdict .again{font:var(--t-caption);color:var(--slate)}
.verdict small{display:block;margin-top:8px}
.verdict small code{background:none;box-shadow:none;padding:0;font-weight:400;white-space:normal}

/* intro / done / sheet */
.take{margin-top:16px}
.take li{position:relative;padding-left:24px}
.take li+li{margin-top:12px}
.hex{position:absolute;left:0;top:.22em;width:16px;height:16px;color:var(--slate)}
.intro .kicker,.done .kicker,.sheet .kicker{margin-bottom:8px}
.more{margin-top:40px;padding-top:16px;border-top:1px solid var(--border)}
.srcs{margin-top:8px}
.srcs li{font:var(--t-caption);padding:2px 0}
.big{font:700 calc(112px*var(--k))/1 var(--sans);margin:8px 0 24px}
.big small{display:block;margin-top:8px}
.done .lede{margin-top:8px}
.sheet section{margin-top:40px;padding-top:16px;border-top:1px solid var(--border)}
.sheet section>h3{font:var(--t-quote)}
.sheet section>h3 code{font:var(--t-tag);color:var(--slate);background:none;box-shadow:none;padding:0;margin-right:8px}
.sheet .lede{margin-top:8px}
.cards{margin-top:16px}
.card{border-top:1px solid var(--border)}
.card:last-child{border-bottom:1px solid var(--border)}
.card summary{padding:12px 0;cursor:pointer;font-weight:600}
.card summary:hover{text-decoration:underline;text-underline-offset:3px}
.card-b{padding:0 0 16px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- level complete: the demonstration, then the model you can inspect ---------- */
.done.demo .lede{margin-top:8px}
.done.aha .q{max-width:24ch}
.chains{display:grid;gap:8px;margin-top:8px}
.chainbtn{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;width:100%;min-height:48px;padding:12px 16px 12px 22px;border:1px solid var(--border-strong);background:var(--white);position:relative}

   So: write colours as you see them (0xff2e88). setRGB() and raw floats in shaders stay linear. Canvas textures used as colour maps need tex.encoding=THREE.sRGBEncoding. */

  P.getStyle=function(){tmp.r=this.r;tmp.g=this.g;tmp.b=this.b;tmp.convertLinearToSRGB();return getStyle.call(tmp);};

/* Palette. These are the MOTH tokens (moth.mortenthrane.com), value for value. See MOTH.md. Nothing else may be used as a colour.
   The game is one light artefact: Fog ground, neutral lines, and Signal as the single accent.
   One exception, decided in the game (MOTH.md): a model may draw a concrete token value as what it is. A colour value is then that
   colour, taken from the token and not from this palette. Signal is not the colour of a value. */
var pal={
  midnight:0x1a1e31, darkAccent:0x262a3f, midnight2:0x2a3050, dusk:0x3d4670, periwinkle:0x6b7ab5,

  if(done){var ids=o.solve(R,st),i,r;for(i=0;i<ids.length;i++){r=o.act(R,st,ids[i]);if(r&&r.solved)break;}}

<script>/* levels/l2.js */
/* Level 2, "Navnet": a name is an address. Kind `addr`.

   The board holds one component, the button (the only word in the component slot), in two variants and four states. Every cell has four parts that can carry a decision:
   background, text, border, radius. A token name is built on the rail from segments, one slot per level:
   component · variant · property · state. A level that is left out says nothing, so the name does not tell the parts apart on
   that level: `button.primary.background` describes the background of the primary button in every state.
   That set of parts is the name's coverage. Committing the name delivers the value to its coverage, right or wrong.

   The levels (component, variant, property, state) are Nathan Curtis' terms. The order of the slots is this plant's own:
   Curtis finds no prevailing order across systems. The four start tokens are Andreas Kutschmann's; the rest are examples. */
(function(){
'use strict';
var TB=window.TB,T=TB.t,P=TB.tw.P;
var SEG=[['button'],['primary','secondary'],['background','text','border','radius'],['hover','pressed','disabled']];
var VARIANTS=SEG[1],STATES=['default'].concat(SEG[3]),PROPS=SEG[2];

TB.i18n.add({
da:{'navn.lv.0':'Komponent','navn.lv.1':'Variant','navn.lv.2':'Egenskab','navn.lv.3':'Tilstand',
 'navn.rail':'Navn','navn.empty':'Navnet bygges her','navn.val':'Værdi: {0}','navn.commit':'Opret token',
 'navn.cover0':'Navnet beskriver endnu ingen del på tavlen.','navn.cover1':'Navnet beskriver 1 del på tavlen.','navn.coverN':'Navnet beskriver {0} dele på tavlen.',
 'navn.st.default':'default','navn.board':'Knap',
 'navn.h.nocomp':'Navnet nævner ingen komponent. Uden den ved ingen, hvad værdien hører til.',
 'navn.h.noprop':'Navnet nævner ingen egenskab. En værdi skal vide, hvad den farver eller former.',
 'navn.h.exists':'`{0}` findes allerede og bærer en anden beslutning. Et navn kan kun bære én.',
 'navn.h.prop':'Værdien landede på `{0}`.',
 'navn.h.variant.missing':'Navnet nævner ingen variant. Derfor fik både primary og secondary værdien.',
 'navn.h.variant.extra':'Navnet nævner `{0}`. Derfor fik kun den variant værdien.',
 'navn.h.variant.wrong':'Navnet nævner `{0}`. Værdien landede dér.',
 'navn.h.state.missing':'Navnet nævner ingen tilstand. Derfor fik alle fire tilstande værdien.',
 'navn.h.state.extra':'Navnet nævner `{0}`. Derfor fik kun den tilstand værdien.',
 'navn.h.state.wrong':'Navnet nævner `{0}`. Værdien landede dér.'},
en:{'navn.lv.0':'Component','navn.lv.1':'Variant','navn.lv.2':'Property','navn.lv.3':'State',
 'navn.rail':'Name','navn.empty':'The name is built here','navn.val':'Value: {0}','navn.commit':'Create the token',
 'navn.cover0':'The name does not describe any part on the board yet.','navn.cover1':'The name describes 1 part on the board.','navn.coverN':'The name describes {0} parts on the board.',
 'navn.st.default':'default','navn.board':'Button',
 'navn.h.nocomp':'The name does not mention a component. Without it nobody knows what the value belongs to.',
 'navn.h.noprop':'The name does not mention a property. A value must know what it colors or shapes.',
 'navn.h.exists':'`{0}` already exists and carries another decision. A name can carry only one.',
 'navn.h.prop':'The value landed on `{0}`.',
 'navn.h.variant.missing':'The name does not mention a variant. So both primary and secondary got the value.',
 'navn.h.variant.extra':'The name mentions `{0}`. So only that variant got the value.',
 'navn.h.variant.wrong':'The name mentions `{0}`. The value landed there.',
 'navn.h.state.missing':'The name does not mention a state. So all four states got the value.',
 'navn.h.state.extra':'The name mentions `{0}`. So only that state got the value.',
 'navn.h.state.wrong':'The name mentions `{0}`. The value landed there.'}
});

/* 'button.primary.background' -> [0,0,0,null]: every segment belongs to exactly one slot */
function parse(name){
  var seg=[null,null,null,null];
  String(name||'').split('.').forEach(function(w){for(var s=0;s<4;s++){var i=SEG[s].indexOf(w);if(i>-1)seg[s]=i;}});
  return seg;
}
function nameOf(seg){var o=[];for(var s=0;s<4;s++)if(seg[s]!==null)o.push(SEG[s][seg[s]]);return o.join('.');}
function same(a,b){for(var s=0;s<4;s++)if(a[s]!==b[s])return false;return true;}
/* the parts a name describes: ids 'variant:state:property'. A name without a property describes nothing that can take a value. */
function cover(seg){
  var out=[];
  if(seg[0]!==0||seg[2]===null)return out;
  VARIANTS.forEach(function(v,vi){
    if(seg[1]!==null&&seg[1]!==vi)return;
    STATES.forEach(function(s,si){
      /* the state slot holds hover, pressed, disabled; a name without a state also describes the button at rest */
      if(seg[3]!==null&&seg[3]+1!==si)return;
      out.push(v+':'+s+':'+PROPS[seg[2]]);
    });
  });
  return out;
}
function levels(seg){var n=0;for(var s=0;s<4;s++)if(seg[s]!==null)n++;return n;}
/* On the board every part uses the token that describes it most precisely. Returns that token ({seg,val}) or null. */
function partToken(tokens,v,s,prop){
  var id=v+':'+s+':'+prop,best=null;
  /* most precisely: a token that names the state comes before one that does not, then the one with more levels, then the newer one */
  function rank(t){return (t.seg[3]!==null?10:0)+levels(t.seg);}
  tokens.forEach(function(t){if(cover(t.seg).indexOf(id)>-1&&(!best||rank(t)>=rank(best)))best=t;});
  return best;
}
function tokensOf(R){return (R.tokens||[]).map(function(t){return {seg:parse(t[0]),name:t[0],val:t[1]};});}

TB.ops.addr={
  SEG:SEG,VARIANTS:VARIANTS,STATES:STATES,PROPS:PROPS,parse:parse,nameOf:nameOf,cover:cover,partToken:partToken,
  init:function(R){return {seg:parse(R.start),tokens:tokensOf(R),tries:0};},
  view:function(R,st){
    var n=cover(st.seg).length,nm=nameOf(st.seg),b=[];
    b.push({k:'tok',label:T('navn.rail'),html:nm?TB.tw.code(nm):'<span class="dim">'+T('navn.empty')+'</span>',val:T('navn.val','`'+R.val.t+'`'),sw:R.val.hex});
    /* the frames on the board say this; in words only where there is no board to look at */
    b.push({k:'note',dup:true,t:n===0?T('navn.cover0'):n===1?T('navn.cover1'):T('navn.coverN',n)});
    SEG.forEach(function(list,s){
      b.push({k:'opts',cls:'chips',label:T('navn.lv.'+s),items:list.map(function(w,i){return {id:'s'+s+':'+i,t:w,on:st.seg[s]===i};})});
    });
    b.push({k:'go',id:'commit',t:T('navn.commit'),dis:!nm});
    return {blocks:b};
  },
  act:function(R,st,id){
    var m=/^s(\d):(\d)$/.exec(id);
    if(m){var s=+m[1],i=+m[2];if(!SEG[s]||!SEG[s][i])return null;st.seg[s]=st.seg[s]===i?null:i;return {fx:{cover:cover(st.seg)}};}
    if(id!=='commit'||!nameOf(st.seg))return null;
    var seg=st.seg,want=parse(R.target),c=cover(seg),nm=nameOf(seg);
    st.tries++;
    function miss(key,args){return {miss:key,args:args||[],fx:{deliver:c,ok:false}};}
    if(seg[0]===null)return miss('navn.h.nocomp');
    if(seg[2]===null)return miss('navn.h.noprop');
    if(same(seg,want)){st.tokens.push({seg:seg.slice(),name:nm,val:R.val});return {solved:true,fx:{deliver:c,ok:true}};}
    if(st.tokens.some(function(t){return same(t.seg,seg);}))return miss('navn.h.exists',[nm]);
    if(seg[2]!==want[2])return miss('navn.h.prop',[PROPS[seg[2]],PROPS[want[2]]]);
    var k;
    for(k=1;k<4;k+=2){
      var lv=k===1?'variant':'state',a=seg[k],w=want[k];
      if(a===w)continue;
      if(a===null)return miss('navn.h.'+lv+'.missing',[SEG[k][w]]);
      if(w===null)return miss('navn.h.'+lv+'.extra',[SEG[k][a]]);
      return miss('navn.h.'+lv+'.wrong',[SEG[k][a],SEG[k][w]]);
    }
    return miss('navn.h.prop',[PROPS[seg[2]],PROPS[want[2]]]);
  },
  solve:function(R,st){
    var want=parse(R.target),ids=[],s;
    for(s=0;s<4;s++)if(st.seg[s]!==want[s])ids.push('s'+s+':'+(want[s]===null?st.seg[s]:want[s]));
    ids.push('commit');return ids;
  }
};
})();

</script>
<script>/* levels/l3.js */

function healthy(grey){
  var t={
    'color.blue-900':{key:'$value',type:null,val:{k:'color',hex:P['blue-900']}},
    'color.accent':{key:'$value',type:null,val:{k:'ref',to:'color.blue-900'}},
    'space.space-32':{key:'$value',type:null,val:{k:'dim',px:32,form:'obj'}},
    'space.inset':{key:'$value',type:null,val:{k:'ref',to:'space.space-32'}},
    'button.primary.background':{key:'$value',type:null,val:{k:'ref',to:'color.accent'}},
    'card.padding':{key:'$value',type:null,val:{k:'ref',to:'space.inset'}}
  };
  if(grey)t['color.grey-700']={key:'$value',type:null,val:{k:'color',hex:P['grey-700']}};
  return {tok:t,gtype:{color:'color',space:'dimension'},sel:null,edits:0};

      if(!st.tok[v.to])return {err:r.err,to:v.to};

  if(v.k==='dim'&&v.form!=='obj')return {err:'form'};

    if(st.gtype[g])L.push({t:ind+'  "$type": "'+st.gtype[g]+'",',id:'t:'+g});
    kids.forEach(function(p,i){tokLine(p,ind+'  ',i===kids.length-1&&!subs.length);});
    subs.forEach(function(x,i){group(x,ind+'  ',i===subs.length-1);});

/* the edits a line offers: [{id,t,group}] */
function edits(st,sel){

  if(k==='g:'){
    if(!st.gtype[x])['color','dimension'].forEach(function(ty){o.push({id:'e:gt:'+x+':'+ty,t:T('fmt.e.gt.add',ty),g:'type'});});
  }else if(k==='t:'){
    other=st.gtype[x]==='color'?'dimension':'color';
    o.push({id:'e:gt:'+x+':'+other,t:T('fmt.e.gt.to',other),g:'type'});
    o.push({id:'e:gt:'+x+':none',t:T('fmt.e.gt.none'),g:'type'});
  }else if(k==='k:'&&(t=st.tok[x])){
    o.push({id:'e:key:'+x+':'+(t.key==='$value'?'value':'$value'),t:T('fmt.e.key',t.key==='$value'?'value':'$value'),g:'key'});
    ['color','dimension'].forEach(function(ty){if(t.type!==ty)o.push({id:'e:tt:'+x+':'+ty,t:T('fmt.e.tt.add',ty),g:'type'});});
    if(t.type)o.push({id:'e:tt:'+x+':none',t:T('fmt.e.tt.none'),g:'type'});
    if(KIND[x]==='ref'){
      paths(st).forEach(function(p){if(p!==x&&!(t.val.k==='ref'&&t.val.to===p))o.push({id:'e:ref:'+x+':'+p,t:T('fmt.e.ref',p),g:'value'});});
      if(x==='color.accent'&&t.val.k==='ref')o.push({id:'e:raw:'+x,t:T('fmt.e.raw'),g:'value'});
    }else if(KIND[x]==='dim'){
      o.push(t.val.form==='obj'?{id:'e:form:'+x+':str',t:T('fmt.e.str'),g:'value'}:{id:'e:form:'+x+':obj',t:T('fmt.e.obj'),g:'value'});

}
function apply(st,id){
  var m=id.split(':'),op=m[1],x=m[2],a=m[3],t=st.tok[x];
  if(op==='gt'){if(GROUPS.indexOf(x)<0)return false;if(a==='none')delete st.gtype[x];else st.gtype[x]=a;return true;}
  if(!t)return false;
  if(op==='key'){t.key=a;return true;}
  if(op==='tt'){t.type=a==='none'?null:a;return true;}
  if(op==='ref'&&KIND[x]==='ref'){t.val={k:'ref',to:a};return true;}
  if(op==='raw'&&x==='color.accent'){var r=resolve(st,x,[]);t.val={k:'color',hex:r.val&&r.val.hex||P['blue-900']};return true;}
  if(op==='form'&&KIND[x]==='dim'){t.val.form=a;return true;}
  return false;
}
function goal(R,st,rd){
  var g=R.goal||{};
  if(!rd.ok)return false;
  if(rd.button!==(g.button||P['blue-900'])||rd.padding!==32)return false;
  /* the role must be a reference: a raw copy of the colour gives the same interface and is not the same system */
  if(st.tok['color.accent'].val.k!=='ref')return false;
  if(g.ref){var t=st.tok[g.ref[0]];if(!t||t.val.k!=='ref'||t.val.to!==g.ref[1])return false;}
  return true;
}

TB.ops.file={
  read:read,lines:lines,paths:paths,GROUPS:GROUPS,
  init:function(R){
    var st=healthy(!!R.grey);
    (R.set||[]).forEach(function(s){
      if(s[0]==='gt'){if(s[2])st.gtype[s[1]]=s[2];else delete st.gtype[s[1]];}
      else if(s[0]==='key')st.tok[s[1]].key=s[2];
      else if(s[0]==='ref')st.tok[s[1]].val={k:'ref',to:s[2]};
      else if(s[0]==='form')st.tok[s[1]].val.form=s[2];
      else if(s[0]==='raw')st.tok[s[1]].val={k:'color',hex:P[s[2]]};
    });
    return st;
  },
  view:function(R,st){
    var rd=read(st),b=[],sel=st.sel,ok=goal(R,st,rd),msg;
    /* At first the reader only says where it stopped: the plant shows how. After an edit that did not repair the file it says what it found. */
    if(rd.first)msg=st.edits?T.apply(null,[rd.first.key].concat(rd.first.args)):(rd.first.args[0]?T('fmt.stop',rd.first.args[0]):T('fmt.stopout'));
    else msg=ok?T('fmt.allok'):(R.goal&&R.goal.ref?T('fmt.r.goalref',R.goal.ref[0],R.goal.ref[1]):T('fmt.r.goal'));
    b.push({k:'note',cls:'reader',t:msg});
    b.push({k:'code',lines:lines(st).map(function(l){
      var p=l.id&&l.id.slice(0,2)==='k:'?l.id.slice(2):null,o={t:l.t,id:l.id?'ln:'+l.id:null,sel:l.id!==null&&l.id===sel,bad:!!(p&&rd.tok[p]&&rd.tok[p].err)};
      if(o.sel){
        var ed=edits(st,sel),groups={key:[],type:[],value:[]};
        ed.forEach(function(e){groups[e.g].push({id:e.id,t:e.t});});
        o.edits=['key','type','value'].filter(function(g){return groups[g].length;}).map(function(g){return {label:T('fmt.'+g),items:groups[g]};});
        if(!ed.length)o.note=T(sel.slice(0,2)==='g:'&&st.gtype[sel.slice(2)]?'fmt.hastype':'fmt.none');
      }
      return o;})});
    if(!sel)b.push({k:'note',t:T('fmt.pick')});
    /* what reaches the interface: the sheet in the plant shows it */
    b.push({k:'checks',dup:true,label:T('fmt.reader'),items:[
      {t:T('fmt.out.btn'),val:rd.button||T('fmt.out.none'),pass:!!rd.button},
      {t:T('fmt.out.pad'),val:rd.padding?rd.padding+'px':T('fmt.out.none'),pass:!!rd.padding}]});
    return {blocks:b};
  },
  act:function(R,st,id){
    if(id.indexOf('ln:')===0){var l=id.slice(3);st.sel=st.sel===l?null:l;return {fx:{sel:st.sel}};}
    if(id.indexOf('e:')!==0||!apply(st,id))return null;
    st.edits++;
    /* a `$type` line that was removed cannot stay selected; a new one is selected so it can be changed again */
    var m=id.split(':');
    if(m[1]==='gt')st.sel=m[3]==='none'?'g:'+m[2]:'t:'+m[2];
    var rd=read(st);
    if(goal(R,st,rd))return {solved:true,fx:{read:rd}};
    /* not repaired: the reader's own message, at the top of the panel, says what it found now */
    return {miss:true,fx:{read:rd}};
  },
  solve:function(R){return (R.fix||[]).slice();}
};
})();

<script>/* levels/l4.js */
/* Level 4, "Temaet": a mode is a second reference. Kind `mode`.

   Seven primitives, four semantic tokens, seven component tokens, two rooms: Light and Dark.
   A semantic token has one reference per mode. A component token has one reference and no modes: it points at a role.
   Light is quoted from Andreas Kutschmann's article (surface, text, accent, text-on-accent). Dark is an example made for the game.
   That modes live on the semantic layer is the set-up Figma's guide shows; it is a convention, not a rule of the token format.

   The player selects a reference and points it somewhere else. Both rooms answer at once. The checks are WCAG 2.1:
   4.5:1 for text against its background, 3:1 for a button against the surface it stands on. */
(function(){
'use strict';

var SEMS=['surface','text','accent','text-on-accent'];

var BASE={sem:{surface:{light:'grey-100',dark:'grey-100'},text:{light:'grey-900',dark:'grey-900'},accent:{light:'blue-900',dark:'blue-900'},'text-on-accent':{light:'white',dark:'white'}},
  comp:{'card.background':'s:surface','card.title':'s:text','card.body':'s:text','button.primary.background':'s:accent','button.primary.text':'s:text-on-accent','button.secondary.background':'s:surface','button.secondary.text':'s:text'}};
var CHECKS=[['title','card.title','card.background',4.5],['body','card.body','card.background',4.5],['primary','button.primary.background','card.background',3],
  ['ptext','button.primary.text','button.primary.background',4.5],['stext','button.secondary.text','button.secondary.background',4.5]];

TB.i18n.add({
da:{'tema.view':'Vis referencerne for','tema.light':'Light','tema.dark':'Dark',
 'tema.sem':'Semantiske tokens · {0}','tema.comp':'Komponent-tokens · ingen modes','tema.point':'Peg `{0}` på','tema.pointm':'Peg `{0}` i {1} på','tema.prims':'Primitive tokens','tema.roles':'Roller',
 'tema.pick':'Vælg det token, du vil ændre.','tema.reset':'Nulstil',
 'tema.checks':'Kontrast','tema.c.title':'Overskrift mod flade','tema.c.body':'Brødtekst mod flade','tema.c.primary':'Primær knap mod flade','tema.c.ptext':'Tekst på primær knap','tema.c.stext':'Tekst på sekundær knap',
 'tema.pass':'består','tema.fail':'fejler','tema.allpass':'{0}: alle fem tjek består','tema.changed':'Flyttede referencer: {0} · ændrede komponent-tokens: {1}',
 'tema.pred':'Hvilke dele på Dark-skærmen skifter farve?','tema.run':'Udfør ændringen',

 'tema.h.light':'Light-rummet ændrede sig. Opgaven gælder kun Dark.',

 'tema.sem':'Semantic tokens · {0}','tema.comp':'Component tokens · no modes','tema.point':'Point `{0}` at','tema.pointm':'Point `{0}` in {1} at','tema.prims':'Primitive tokens','tema.roles':'Roles',

});

function hex(st,c,mode){var to=st.comp[c];return to.charAt(0)==='p'?P[to.slice(2)]:P[st.sem[to.slice(2)][mode]];}
function checks(st,mode){return CHECKS.map(function(c){var r=ratio(hex(st,c[1],mode),hex(st,c[2],mode));return {key:c[0],r:r,min:c[3],pass:r>=c[3]};});}
function fails(st,mode){return checks(st,mode).filter(function(c){return !c.pass;});}
function compEdits(st){return COMPS.filter(function(c){return st.comp[c]!==BASE.comp[c];});}
function lightChanged(st,start){return COMPS.some(function(c){return hex(st,c,'light')!==hex(start,c,'light');});}
function semEdits(st,start){var n=0;SEMS.forEach(function(s){['light','dark'].forEach(function(m){if(st.sem[s][m]!==start.sem[s][m])n++;});});return n;}
function startOf(R){var s=clone(BASE);(R.dark||[]).forEach(function(d){s.sem[d[0]].dark=d[1];});return s;}
function failNames(f){return f.map(function(c){return T('tema.c.'+c.key).toLowerCase();}).join(', ');}
/* the parts of the Dark screen whose colour would change if a semantic reference moved */
function wouldChange(st,sem,mode,to){
  var after=clone(st);after.sem[sem][mode]=to;
  return COMPS.filter(function(c){return hex(st,c,mode)!==hex(after,c,mode);});
}

TB.ops.mode={
  PRIMS:PRIMS,SEMS:SEMS,COMPS:COMPS,CHECKS:CHECKS,hex:hex,checks:checks,P:P,
  init:function(R){var s=startOf(R);return {sem:s.sem,comp:s.comp,view:'dark',sel:null,edits:0,pred:R.plan?{}:null};},
  view:function(R,st,lock){
    var b=[],m=st.view,start=startOf(R),sel=st.sel;
    if(R.plan){
      b.push({k:'opts',cls:'chips',label:T('tema.pred'),items:COMPS.map(function(c){return {id:'pp:'+c,t:c,sw:hex(st,c,'dark'),on:!!st.pred[c]};})});
      b.push({k:'go',id:'run',t:T('tema.run')});
      return {blocks:b};
    }
    function targets(){
      if(sel.charAt(0)==='s')return {k:'opts',cls:'chips',label:T('tema.pointm',sel.slice(2),T('tema.'+m)),items:PRIMS.map(function(p){return {id:'to:p:'+p,t:p,sw:P[p],on:st.sem[sel.slice(2)][m]===p,dis:st.sem[sel.slice(2)][m]===p};})};
      var cur=st.comp[sel.slice(2)];
      return {k:'opts',cls:'chips',label:T('tema.point',sel.slice(2)),items:SEMS.map(function(s){return {id:'to:s:'+s,t:s,on:cur==='s:'+s,dis:cur==='s:'+s};})
        .concat(PRIMS.map(function(p){return {id:'to:p:'+p,t:p,sw:P[p],on:cur==='p:'+p,dis:cur==='p:'+p};}))};
    }
    b.push({k:'opts',cls:'modes refs',label:T('tema.view'),items:[{id:'v:light',t:T('tema.light'),on:m==='light'},{id:'v:dark',t:T('tema.dark'),on:m==='dark'}]});
    b.push({k:'opts',label:T('tema.sem',T('tema.'+m)),items:SEMS.map(function(s){return {id:'sel:s:'+s,t:'`'+s+'`',sub:'→ `'+st.sem[s][m]+'`',sw:P[st.sem[s][m]],on:sel==='s:'+s,again:true};})});
    if(sel&&sel.charAt(0)==='s'){var ts=targets();ts.box='to';b.push(ts);}
    b.push({k:'opts',cls:'chips',label:T('tema.comp'),items:COMPS.map(function(c){return {id:'sel:c:'+c,t:c,on:sel==='c:'+c};})});
    if(sel&&sel.charAt(0)==='c'){var tc=targets();tc.box='to';b.push(tc);}
    if(!sel)b.push({k:'note',t:T('tema.pick')});
    ['dark','light'].forEach(function(md){
      var cs=checks(st,md),bad=cs.filter(function(c){return !c.pass;});
      b.push({k:'checks',label:md==='dark'?T('tema.checks'):null,items:[{t:bad.length?T('tema.somepass',T('tema.'+md),cs.length-bad.length):T('tema.allpass',T('tema.'+md)),val:'',pass:true}]
        .concat(bad.map(function(c){return {t:T('tema.c.'+c.key),val:fmt(c.r)+' '+T('tema.fail'),pass:false};}))});
    });
    b.push({k:'note',cls:'tally',t:T('tema.changed',semEdits(st,start),compEdits(st).length)});
    if(st.edits&&!lock)b.push({k:'go',id:'reset',t:T('tema.reset'),ghost:true});
    return {blocks:b};
  },
  act:function(R,st,id){
    var start=startOf(R),m=id.split(':'),sel=st.sel,x,changed,miss,want;
    if(R.plan){
      if(m[0]==='pp'&&COMPS.indexOf(id.slice(3))>-1){x=id.slice(3);if(st.pred[x])delete st.pred[x];else st.pred[x]=true;return {fx:{pred:st.pred}};}
      if(id!=='run')return null;
      want=wouldChange(st,R.plan[0],R.plan[1],R.plan[2]);
      var extra=want.filter(function(c){return !st.pred[c];}),wrong=Object.keys(st.pred).filter(function(c){return want.indexOf(c)<0;});
      st.sem[R.plan[0]][R.plan[1]]=R.plan[2];st.edits++;st.ran=true;
      function names(a){return a.map(function(c){return '`'+c+'`';}).join(', ');}
      if(!extra.length&&!wrong.length)return {solved:true,fx:{changed:want}};
      return {solved:true,miss:extra.length&&wrong.length?'tema.h.pred.both':extra.length?'tema.h.pred.more':'tema.h.pred.less',
        args:extra.length&&wrong.length?[names(extra),names(wrong)]:[names(extra.length?extra:wrong)],fx:{changed:want}};
    }
    if(m[0]==='v'){if(m[1]!=='light'&&m[1]!=='dark')return null;st.view=m[1];return {fx:{view:st.view}};}
    if(m[0]==='sel'){x=id.slice(4);if((x.charAt(0)==='s'?SEMS:x.charAt(0)==='c'?COMPS:[]).indexOf(x.slice(2))<0||x.charAt(1)!==':')return null;st.sel=st.sel===x?null:x;return {fx:{sel:st.sel}};}
    if(id==='reset'){st.sem=start.sem;st.comp=start.comp;st.sel=null;st.edits=0;return {clear:true,sfx:'remove',fx:{reset:true}};}
    if(m[0]!=='to'||!sel)return null;
    x=id.slice(5);
    if(sel.charAt(0)==='s'){if(m[1]!=='p'||PRIMS.indexOf(x)<0||st.sem[sel.slice(2)][st.view]===x)return null;st.sem[sel.slice(2)][st.view]=x;}
    else{if((m[1]==='p'?PRIMS:SEMS).indexOf(x)<0||st.comp[sel.slice(2)]===m[1]+':'+x)return null;st.comp[sel.slice(2)]=m[1]+':'+x;}
    st.edits++;
    /* is the task done? */
    var dark=fails(st,'dark'),comps=compEdits(st),lc=lightChanged(st,start),g=R.goal,miss=null;
    var others=SEMS.filter(function(n){return n!=='surface'&&st.sem[n].dark!==start.sem[n].dark;});
    var blue=/^blue-/.test(st.sem.accent.dark);
    var done=!comps.length&&!lc&&st.sem.surface.dark==='grey-800'&&(g==='surface'?!others.length:(dark.length===0&&blue));
    if(done)return {solved:true,fx:{edit:sel}};
    /* a wrong place to change shows at once; a step on the way is not a miss until the task has taken more steps than it needs */
    if(sel.charAt(0)==='c'&&comps.length)miss={miss:'tema.h.comp',args:[sel.slice(2)]};
    else if(comps.length)miss={miss:'tema.h.comp',args:[comps[0]]};
    else if(lc)miss={miss:'tema.h.light'};
    else if(g==='surface'&&others.length)miss={miss:'tema.h.only',args:[others[0]]};
    else if(g!=='surface'&&st.sem.surface.dark!=='grey-800')miss={miss:'tema.h.keep'};
    else if(g!=='surface'&&!blue)miss={miss:'tema.h.blue',args:[st.sem.accent.dark]};
    else if(st.edits>=(R.par||1))miss=g==='surface'?{miss:'tema.h.surface'}:(dark.length?{miss:'tema.h.contrast',args:[dark.length,failNames(dark)]}:null);
    if(miss){miss.fx={edit:sel};return miss;}
    return {clear:true,sfx:'place',fx:{edit:sel}};
  },
  solve:function(R,st){
    if(R.plan)return wouldChange(st,R.plan[0],R.plan[1],R.plan[2]).filter(function(c){return !st.pred[c];}).map(function(c){return 'pp:'+c;}).concat(['run']);
    var ids=['reset','v:dark'];
    (R.fix||[]).forEach(function(f){ids.push('sel:s:'+f[0]);ids.push('to:p:'+f[1]);});
    return ids;
  }
};
})();

<script>/* levels/l5.js */

   The plant: token files (the source of truth) -> a build (merge the files, transform each token for the platform, resolve the

   It is one possible architecture: the one Andreas Kutschmann describes, with a translation tool like Style Dictionary.

   What the player can do: put a file in or out of the source, connect a platform to the source or leave it on a hand-made copy,
   choose the name transform of a platform, change a reference in the source, patch a crate by hand, and run the build.
   Nothing is judged until the build runs, except a hand patch: its consequence is immediate.

function valid(plat,nt){return plat==='web'?nt!=='none':(nt==='camel'||nt==='snake');}
function codeLine(plat,name,hex){
  if(plat==='web')return '--'+name+': '+hex+';';
  var c=TB.tw.comps(hex).map(function(v){return v.toFixed(3);});
  return 'public static let '+name+' = UIColor(red: '+c[0]+', green: '+c[1]+', blue: '+c[2]+', alpha: 1)';
}
/* what a platform shows: the line in its crate, where it came from, and the colour on the device (null: none) */
function shown(st,plat){
  var p=st.plat[plat];if(!p)return null;
  if(p.feed==='copy')return {line:codeLine(plat,'buttonBackground',COPY),hex:COPY,from:'copy',ok:true};
  if(!p.out)return {line:null,hex:null,from:'none',ok:false};
  if(!p.out.ok)return {line:codeLine(plat,p.out.name,p.out.hex),hex:null,from:'rejected',ok:false};
  if(p.patch)return {line:codeLine(plat,p.out.name,p.patch),hex:p.patch,from:'patched',ok:true};
  return {line:codeLine(plat,p.out.name,p.out.hex),hex:p.out.hex,from:'gen',ok:true};
}
function plats(st){return PLATS.filter(function(p){return st.plat[p];});}
function build(st){
  var over=[],err=null;
  if(!st.files.tokens)err={key:'pipe.e.empty',args:[]};
  else if(!st.files.options)err={key:'pipe.e.ref',args:[st.accent]};
  if(err){st.log=err;st.dirty=false;return {ok:false,err:err,over:over};}
  plats(st).forEach(function(pl){
    var p=st.plat[pl];if(p.feed!=='source')return;
    if(p.patch){over.push(pl);p.patch=null;}
    if(!p.name){p.out=null;if(!err)err={key:'pipe.e.noname',args:[]};return;}
    p.out={name:NAMES[p.name],hex:P[st.accent],ok:valid(pl,p.name)};
    if(!p.out.ok&&!err)err=pl==='web'?{key:'pipe.e.css',args:[p.out.name]}:{key:'pipe.e.swift',args:[p.out.name,p.name==='kebab'?'-':'.']};
  });
  st.dirty=false;st.log=err||{key:'pipe.log.ok',args:[]};
  return {ok:!err,err:err,over:over};
}

TB.ops.line={
  NAMES:NAMES,shown:shown,PATH:PATH,P:P,COPY:COPY,
  init:function(R){
    var s=R.start||{},st={files:{options:s.options!==false,tokens:true},accent:'blue-900',plat:{web:{feed:'source',name:'kebab',out:null,patch:null}},log:null,dirty:false,steps:0};
    if(s.ios)st.plat.ios={feed:s.ios[0],name:s.ios[1],out:null,patch:null};
    /* what stood in the crates before the round began */
    if(s.built){build(st);st.log=null;if(s.patch&&st.plat[s.patch])st.plat[s.patch].patch=P['grey-700'];}
    /* the build stopped before the round began: the housing shows where, the message comes when it is run again */
    else st.log={key:'pipe.stopped',args:[],at:st.files.options?'merge':'resolve'};
    return st;
  },
  view:function(R,st,lock){
    var b=[],g=R.goal;
    b.push({k:'opts',box:'src',cls:'chips',label:T('pipe.src'),items:FILES.map(function(f){return {id:'f:'+f,t:T('pipe.f.'+f),on:st.files[f]};})});
    if(g==='source')b.push({k:'opts',box:'src',cls:'chips',label:T('pipe.accent'),items:['blue-900','grey-700'].map(function(p){return {id:'src:'+p,t:p,sw:P[p],on:st.accent===p,dis:st.accent===p};})});
    plats(st).forEach(function(pl){
      var p=st.plat[pl],sh=shown(st,pl),name=T('pipe.'+pl);
      if(pl==='ios'){
        b.push({k:'opts',box:pl,cls:'chips',label:T('pipe.feed',name),items:['source','copy'].map(function(f){return {id:'feed:'+pl+':'+f,t:T('pipe.feed.'+f),on:p.feed===f,dis:p.feed===f};})});
        if(p.feed==='source')b.push({k:'opts',box:pl,cls:'chips',label:T('pipe.name',name),items:NT.map(function(n){return {id:'name:'+pl+':'+n,t:T('pipe.nt.'+n),on:p.name===n,dis:p.name===n};})});
      }
      b.push({k:'tok',box:pl,dup:true,label:T('pipe.crate.'+pl),html:sh.line?'<code class="line">'+sh.line.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</code>':'<span class="dim">'+T('pipe.none')+'</span>',
        val:sh.from==='none'?null:T('pipe.'+(sh.from==='rejected'?'rejected':sh.from)),sw:sh.hex});
      if(g==='source'&&p.feed==='source'&&p.out&&p.out.ok&&!p.patch)b.push({k:'go',box:pl,id:'patch:'+pl,t:T('pipe.patch',pl==='web'?'tokens.css':'Tokens.swift'),ghost:true});
    });
    b.push({k:'go',id:'build',t:T('pipe.build')});
    /* what the build last said stands first, as the reader's note does in the other levels */
    if(st.dirty)b.unshift({k:'note',cls:'reader',t:T('pipe.log.dirty')});
    else if(st.log)b.unshift({k:'note',cls:'reader',t:T.apply(null,[st.log.key].concat(st.log.args))});
    return {blocks:b};
  },
  act:function(R,st,id){
    var m=id.split(':'),g=R.goal,p;
    if(m[0]==='f'&&FILES.indexOf(m[1])>-1){st.files[m[1]]=!st.files[m[1]];st.dirty=true;return {clear:true,fx:{files:st.files}};}
    if(m[0]==='feed'&&st.plat[m[1]]&&(m[2]==='source'||m[2]==='copy')){p=st.plat[m[1]];if(p.feed===m[2])return null;p.feed=m[2];if(m[2]==='copy'){p.out=null;p.patch=null;}st.dirty=true;return {clear:true,sfx:'place',fx:{feed:m[1]}};}
    if(m[0]==='name'&&st.plat[m[1]]&&NAMES[m[2]]){if(st.plat[m[1]].name===m[2])return null;st.plat[m[1]].name=m[2];st.dirty=true;return {clear:true,fx:{name:m[1]}};}
    if(m[0]==='src'&&(m[1]==='blue-900'||m[1]==='grey-700')){if(st.accent===m[1])return null;st.accent=m[1];st.dirty=true;return {clear:true,sfx:'place',fx:{src:m[1]}};}
    if(m[0]==='patch'&&st.plat[m[1]]&&st.plat[m[1]].out&&g==='source'){
      if(st.plat[m[1]].patch)return null;
      st.plat[m[1]].patch=P['grey-700'];st.steps++;
      var all=plats(st).every(function(pl){return st.plat[pl].patch;});
      return all?{miss:'pipe.h.patch2',args:[st.accent],fx:{patch:m[1]}}:{miss:'pipe.h.patch',args:[T('pipe.'+m[1]),st.accent],fx:{patch:m[1]}};
    }
    if(id!=='build')return null;
    st.steps++;
    var r=build(st),fx={build:r},web=shown(st,'web'),ios=shown(st,'ios');
    /* a build that stops says why in its own log, next to the key that started it */
    if(!r.ok)return {miss:true,fx:fx};
    if(g==='merge')return {solved:true,fx:fx};
    if(g==='ios'){
      if(st.plat.ios.feed!=='source')return {miss:'pipe.h.copy',fx:fx};
      return {solved:true,fx:fx};
    }
    if(st.accent==='grey-700'&&web.hex===P['grey-700']&&(!ios||ios.hex===P['grey-700']))return {solved:true,fx:fx};
    if(r.over.length)return {miss:'pipe.h.over',args:[st.accent],fx:fx};
    return st.plat.ios&&st.plat.ios.feed!=='source'?{miss:'pipe.h.copy',fx:fx}:{miss:'pipe.h.nochange',args:[st.accent],fx:fx};
  },
  solve:function(R){return (R.fix||[]).slice();}
};
})();

<script>/* levels/l6.js */

   The whole system on one wall: seven primitives, four semantic tokens with a Light and a Dark reference, five component tokens,
   and two platforms that are built from them. Four monitors show the result: web and iOS, Light and Dark.
   The healthy system is the one level 4 ended with. Every round starts from it with one fault put in.

   Inspecting is free, one link at a time: a part on a monitor names the component token it uses; the component token names its
   role; the role names its primitive in each mode; a platform says when it was built. A repair changes the system:
   move a semantic reference (in the mode of the monitor being looked at), move a component reference, run a platform's build,
   or hard-code a colour in the platform's own code. The last one is the tempting wrong fix: it changes one part on one platform.

/* what the tokens resolve to for a part in a mode: a hex, or null when a reference leads nowhere */
function resolve(sys,c,mode){var s=sys.comp[c];return sys.sem[s]?P[sys.sem[s][mode]]:null;}
function snapshot(sys){var o={};MODES.forEach(function(m){o[m]={};COMPS.forEach(function(c){o[m][c]=resolve(sys,c,m);});});return o;}
/* what a monitor shows: a hand change in the platform code wins, then what the platform was last built with */
function shown(st,plat,mode,c){
  var k=plat+':'+c;
  if(st.hard[k]!==undefined)return st.hard[k];
  if(st.stale[plat])return st.stale[plat][mode][c];
  return resolve(st,c,mode);
}
function expected(mode,c){return resolve(H,c,mode);}
function devs(st){
  var o=[];
  PLATS.forEach(function(p){MODES.forEach(function(m){COMPS.forEach(function(c){if(shown(st,p,m,c)!==expected(m,c))o.push(p+':'+m+':'+c);});});});
  return o;
}
/* the first thing in the system that is not as in the healthy one: a token name, or null */
function diff(st){
  var i,j;
  for(i=0;i<SEMS.length;i++)for(j=0;j<2;j++)if(st.sem[SEMS[i]][MODES[j]]!==H.sem[SEMS[i]][MODES[j]])return SEMS[i];
  for(i=0;i<COMPS.length;i++)if(st.comp[COMPS[i]]!==H.comp[COMPS[i]])return COMPS[i];
  return null;
}
function healthy(st){return !diff(st)&&!Object.keys(st.hard).length&&!st.stale.web&&!st.stale.ios;}
function monName(p,m){return T('diag.m.'+p)+' · '+T('diag.m.'+m);}
function partName(c){return T('diag.p.'+c);}
/* a planned change: ['s',role,mode,primitive] or ['c',component,role] */
function applyPlan(sys,pl){if(pl[0]==='s')sys.sem[pl[1]][pl[2]]=pl[3];else sys.comp[pl[1]]=pl[2];}

TB.ops.diag={
  PRIMS:PRIMS,SEMS:SEMS,COMPS:COMPS,PLATS:PLATS,MODES:MODES,H:H,P:P,shown:shown,expected:expected,devs:devs,resolve:resolve,
  init:function(R){
    var st={sem:clone(H.sem),comp:clone(H.comp),hard:{},stale:{web:null,ios:null},mon:'web:light',sel:null,repairs:0,pred:R.plan?{parts:{},mons:{}}:null};
    (R.fault||[]).forEach(function(f){
      if(f[0]==='sem')st.sem[f[1]][f[2]]=f[3];
      else if(f[0]==='comp')st.comp[f[1]]=f[2];
      /* a platform that was built while a reference was wrong, and not since */
      else if(f[0]==='stale'){var old=clone({sem:st.sem,comp:st.comp});old.sem[f[2]][f[3]]=f[4];st.stale[f[1]]=snapshot(old);}
    });
    if(R.mon)st.mon=R.mon;
    return st;
  },
  view:function(R,st,lock){
    var b=[],d=devs(st),mp=st.mon.split(':'),plat=mp[0],mode=mp[1],sel=st.sel,rows=[],x,k,insp=[];
    if(R.plan){
      b.push({k:'note',cls:'reader',t:R.plan[0]==='s'?T('diag.plan.s',R.plan[1],T('diag.k.'+R.plan[2]),R.plan[3]):T('diag.plan.c',R.plan[1],R.plan[2])});
      b.push({k:'opts',cls:'chips',label:T('diag.pred.parts'),items:COMPS.map(function(c){return {id:'pp:'+c,t:partName(c),on:!!st.pred.parts[c]};})});
      b.push({k:'opts',cls:'chips',label:T('diag.pred.mons'),items:PLATS.reduce(function(a,p){return a.concat(MODES.map(function(m){return {id:'pm:'+p+':'+m,t:monName(p,m),on:!!st.pred.mons[p+':'+m]};}));},[])});
      b.push({k:'go',id:'run',t:T('diag.run')});
      return {blocks:b};
    }
    b.push({k:'note',cls:'reader',t:d.length===0?T('diag.dev0'):d.length===1?T('diag.dev1'):T('diag.devN',d.length)});
    /* What is selected, and what can be changed there, stands first. It shows one link only: where that link leads is for the player to follow. */
    if(sel){
      k=sel.charAt(0);x=sel.slice(2);
      if(k==='m'){
        var hx=shown(st,plat,mode,x),ex=expected(mode,x);
        rows.push([monName(plat,mode)+' · '+partName(x),hx||T('diag.k.none'),hx||undefined]);
        if(hx!==ex)rows.push([T('diag.k.design'),ex,ex]);
        rows.push([T('diag.k.uses'),'`'+x+'`']);
        insp.push({k:'kv',label:T('diag.insp'),rows:rows});
        insp.push({k:'opts',label:T('diag.fix'),items:[st.hard[plat+':'+x]!==undefined?{id:'r:u:'+plat+':'+x,t:T('diag.f.unhard',T('diag.m.'+plat))}:{id:'r:x:'+plat+':'+x,t:T('diag.f.hard',T('diag.m.'+plat))}]});
      }else if(k==='c'){
        rows.push(['`'+x+'`','→ `'+st.comp[x]+'`'+(st.sem[st.comp[x]]?'':' · '+T('diag.k.missing'))]);
        insp.push({k:'kv',label:T('diag.insp'),rows:rows});
        insp.push({k:'opts',cls:'chips',label:T('diag.f.comp',x),items:SEMS.map(function(s){return {id:'r:c:'+x+':'+s,t:s,on:st.comp[x]===s,dis:st.comp[x]===s};})});
      }else if(k==='s'){
        MODES.forEach(function(m){rows.push(['`'+x+'` · '+T('diag.k.'+m),'→ `'+st.sem[x][m]+'`',P[st.sem[x][m]]]);});
        insp.push({k:'kv',label:T('diag.insp'),rows:rows});
        MODES.forEach(function(m){
          insp.push({k:'opts',cls:'chips',label:T('diag.f.sem',x,T('diag.k.'+m)),items:PRIMS.map(function(p){return {id:'r:s:'+x+':'+m+':'+p,t:p,sw:P[p],on:st.sem[x][m]===p,dis:st.sem[x][m]===p};})});
        });
      }else if(k==='o'){
        var hc=COMPS.filter(function(c){return st.hard[x+':'+c]!==undefined;});
        rows.push([T('diag.k.build')+' · '+T('diag.m.'+x),hc.length?T('diag.b.hard',hc.map(function(c){return '`'+c+'`';}).join(', ')):T(st.stale[x]?'diag.b.stale':'diag.b.live')]);
        insp.push({k:'kv',label:T('diag.insp'),rows:rows});
        /* a build writes the output again from the source. A colour fixed by hand in the platform's own code is not output: it stays until it is taken out. */
        insp.push({k:'opts',label:T('diag.fix'),items:[{id:'r:b:'+x,t:T('diag.f.build',T('diag.m.'+x)),dis:!st.stale[x]}].concat(hc.map(function(c){return {id:'r:u:'+x+':'+c,t:T('diag.f.unhard',T('diag.m.'+x))+' · '+partName(c)};}))});
      }
      insp.forEach(function(i){i.box='insp';b.push(i);});
    }else b.push({k:'note',t:T('diag.pick')});
    b.push({k:'opts',cls:'modes refs',label:T('diag.mon'),items:PLATS.reduce(function(a,p){return a.concat(MODES.map(function(m){return {id:'mon:'+p+':'+m,t:monName(p,m),on:st.mon===p+':'+m};}));},[])});
    b.push({k:'opts',cls:'chips',label:T('diag.parts'),items:COMPS.map(function(c){var h2=shown(st,plat,mode,c);return {id:'sel:m:'+c,t:partName(c)+(h2!==expected(mode,c)?' ≠':''),sw:h2||undefined,on:sel==='m:'+c};})});
    b.push({k:'opts',cls:'chips',label:T('diag.comp'),items:COMPS.map(function(c){return {id:'sel:c:'+c,t:c,on:sel==='c:'+c};})});
    b.push({k:'opts',cls:'chips',label:T('diag.sem'),items:SEMS.map(function(s2){return {id:'sel:s:'+s2,t:s2,on:sel==='s:'+s2};})});
    b.push({k:'opts',cls:'chips',label:T('diag.out'),items:PLATS.map(function(p){return {id:'sel:o:'+p,t:T('diag.m.'+p),on:sel==='o:'+p};})});
    if(st.repairs&&!lock)b.push({k:'go',id:'reset',t:T('diag.reset'),ghost:true});
    return {blocks:b};
  },
  act:function(R,st,id){
    var m=id.split(':'),x,before,after,want;
    if(R.plan){
      if(m[0]==='pp'&&COMPS.indexOf(id.slice(3))>-1){x=id.slice(3);if(st.pred.parts[x])delete st.pred.parts[x];else st.pred.parts[x]=true;return {fx:{pred:st.pred}};}
      if(m[0]==='pm'&&PLATS.indexOf(m[1])>-1&&MODES.indexOf(m[2])>-1){x=m[1]+':'+m[2];if(st.pred.mons[x])delete st.pred.mons[x];else st.pred.mons[x]=true;return {fx:{pred:st.pred}};}
      if(id!=='run')return null;
      before=clone({sem:st.sem,comp:st.comp});
      applyPlan(st,R.plan);st.repairs++;st.ran=true;
      /* what really changes: every part on every monitor whose colour is different after the change */
      want=[];var guess=[];
      PLATS.forEach(function(p){MODES.forEach(function(mo){COMPS.forEach(function(c){
        if(resolve(before,c,mo)!==resolve(st,c,mo))want.push(p+':'+mo+':'+c);
        if(st.pred.parts[c]&&st.pred.mons[p+':'+mo])guess.push(p+':'+mo+':'+c);
      });});});
      function say(a){
        if(!a.length)return T('diag.h.pred.none');
        var parts=[],mons=[];a.forEach(function(k){var q=k.split(':');if(mons.indexOf(monName(q[0],q[1]))<0)mons.push(monName(q[0],q[1]));if(parts.indexOf(partName(q[2]))<0)parts.push(partName(q[2]));});
        return parts.join(', ')+' ('+mons.join(', ')+')';
      }
      if(want.slice().sort().join()===guess.slice().sort().join())return {solved:true,fx:{changed:want}};
      return {solved:true,miss:'diag.h.pred',args:[say(want),say(guess)],fx:{changed:want}};
    }
    if(m[0]==='mon'&&PLATS.indexOf(m[1])>-1&&MODES.indexOf(m[2])>-1){st.mon=m[1]+':'+m[2];return {fx:{mon:st.mon}};}
    /* the round as it was handed out */
    if(id==='reset'){if(!st.repairs)return null;var fresh=this.init(R),kk;for(kk in st)delete st[kk];for(kk in fresh)st[kk]=fresh[kk];return {clear:true,sfx:'remove',fx:{reset:true}};}
    if(m[0]==='sel'){
      x=id.slice(4);
      var list={m:COMPS,c:COMPS,s:SEMS,o:PLATS}[x.charAt(0)];
      if(!list||x.charAt(1)!==':'||list.indexOf(x.slice(2))<0)return null;
      st.sel=st.sel===x?null:x;return {fx:{sel:st.sel}};
    }
    if(m[0]!=='r')return null;
    before=devs(st).length;
    var mp=st.mon.split(':'),hard=false;
    /* ids: r:s:<role>:<mode>:<primitive>, r:c:<component>:<role>, r:b:<platform>, r:x / r:u:<platform>:<component> */
    if(m[1]==='s'){
      if(!st.sem[m[2]]||MODES.indexOf(m[3])<0||PRIMS.indexOf(m[4])<0||st.sem[m[2]][m[3]]===m[4])return null;
      st.sem[m[2]][m[3]]=m[4];
    }
    else if(m[1]==='c'){if(st.comp[m[2]]===undefined||SEMS.indexOf(m[3])<0||st.comp[m[2]]===m[3])return null;st.comp[m[2]]=m[3];}
    else if(m[1]==='b'&&PLATS.indexOf(m[2])>-1){
      /* a build of a platform that is up to date changes nothing */
      if(!st.stale[m[2]])return null;
      st.stale[m[2]]=null;
    }
    else if(m[1]==='x'&&PLATS.indexOf(m[2])>-1&&COMPS.indexOf(m[3])>-1){if(st.hard[m[2]+':'+m[3]]!==undefined)return null;st.hard[m[2]+':'+m[3]]=expected(mp[1],m[3]);hard=true;}
    else if(m[1]==='u'&&PLATS.indexOf(m[2])>-1){
      if(st.hard[m[2]+':'+m[3]]===undefined)return null;
      delete st.hard[m[2]+':'+m[3]];
      return healthy(st)?{solved:true,fx:{repair:id}}:{clear:true,sfx:'remove',fx:{repair:id}};
    }
    else return null;
    st.repairs++;
    if(healthy(st))return {solved:true,fx:{repair:id}};
    after=devs(st).length;
    if(hard)return {miss:'diag.h.hard',args:[T('diag.m.'+m[2]),after],fx:{repair:id}};
    if(after===0)return {miss:'diag.h.mask',args:[diff(st)||''],fx:{repair:id}};
    return {miss:after>before?'diag.h.worse':'diag.h.still',args:[after],fx:{repair:id}};
  },
  /* what is left to do from here, in words: every reference that is not where the healthy system has it, then every platform
     whose output is old or has been changed by hand. This is the last tip, so it stays true whatever the player has changed. */
  todo:function(R,st){
    if(R.plan)return null;
    var out=[];
    SEMS.forEach(function(s){MODES.forEach(function(m){if(st.sem[s][m]!==H.sem[s][m])out.push(T('diag.t.sem',s,T('diag.k.'+m),H.sem[s][m]));});});
    COMPS.forEach(function(c){if(st.comp[c]!==H.comp[c])out.push(T('diag.t.comp',c,H.comp[c]));});
    PLATS.forEach(function(p){
      COMPS.forEach(function(c){if(st.hard[p+':'+c]!==undefined)out.push(T('diag.t.unhard',T('diag.m.'+p),partName(c)));});
      if(st.stale[p])out.push(T('diag.t.build',T('diag.m.'+p)));
    });
    return out;
  },
  /* at rest the control room shows the healthy system, whether the level has been played or not */
  rest:function(){var R={kind:'diag'};return {R:R,st:this.init(R)};},
  solve:function(R,st){
    if(R.plan){
      var ids=[],parts={},mons={};
      var after=clone({sem:st.sem,comp:st.comp});applyPlan(after,R.plan);
      PLATS.forEach(function(p){MODES.forEach(function(mo){COMPS.forEach(function(c){if(resolve(st,c,mo)!==resolve(after,c,mo)){parts[c]=1;mons[p+':'+mo]=1;}});});});
      Object.keys(parts).forEach(function(c){if(!st.pred.parts[c])ids.push('pp:'+c);});
      Object.keys(mons).forEach(function(k){if(!st.pred.mons[k])ids.push('pm:'+k);});
      return ids.concat(['run']);
    }
    return (R.fix||[]).slice();
  }
};
})();
