function sg(t,a,d){return d<=0?(t>=a?1:0):Math.max(0,Math.min(1,(t-a)/d));}
/* the middle of a cell of the board */
function cellX(s){return BL+RH+(s+0.5)*CW;}
function cellY(v){return YT-HH-(v+0.5)*CH;}

TB.i18n.add({
  da:{'s2.send':'Send'},
  en:{'s2.send':'Send'}
});

/* how many levels a name has; a name that mentions a state is the more precise of two names with the same number of levels */
function rank(seg){var n=0,s;for(s=0;s<4;s++)if(seg[s]!==null)n++;return n*2+(seg[3]!==null?1:0);}
/* The token a part uses: the one that describes it most precisely. Of two that are equally precise, the one that names the
   state wins, and after that the one created last (TB.ops.addr.partToken keeps the first, so `button.text.disabled` would
   never reach a button that also has `button.primary.text`). */
function tokenFor(list,id){
  var best=null,b=-1,i,r;
  for(i=0;i<list.length;i++){
    if(A.cover(list[i].seg).indexOf(id)<0)continue;
    r=rank(list[i].seg);if(r>=b){best=list[i];b=r;}
  }
  return best;
}
/* what a value is on a part. A value of the wrong kind is no decision at all: no fill, no colour, no stroke, a square corner. */
function onPart(prop,val){
  if(!val)return null;
  if(prop==='radius')return val.radius?{r:val.radius}:null;
  if(!val.hex||val.radius)return null;
  if(prop==='border')return {hex:val.hex,w:val.stroke||1};
  return val.stroke?null:{hex:val.hex};

/* the words of a name on the rail: the first and the last place that hold one, and where the name begins and ends */
function span(seg){
  var o={first:-1,last:-1,x0:0,x1:0},s;
  for(s=0;s<4;s++)if(seg[s]!==null){if(o.first<0)o.first=s;o.last=s;}
  if(o.first>=0){o.x0=SX[o.first]-SWD[o.first]/2;o.x1=SX[o.last]+SWD[o.last]/2;}
  return o;
}

TB.stations[1]=(function(){
  var group,ctx0,far=true,doneLit=false,round=null,cur=null,live=false,hov=null,keyDown=false;
  /* A commit under way. `run` is its timeline. What it has made of the picture so far:
     fz    how far the words have closed up into one token (0 to 1)
     ra    how far the token's pipe has reached towards the value (0 to 1)
     aK,bK how far the value has come through that pipe, and up the line to the board (0 to 1)
     hp    where the value is on its way (in the line, or in front of the board), or null
     cnt   how many parts have taken it; `over` holds those parts
     at    the part it is being carried to: its row and its column are the address in ink
     pending  the token that has been created but is still being delivered: the board is not drawn from it yet */
  var running=false,run=null,fz=0,ra=0,aK=0,bK=0,hp=null,cnt=0,at=-1,over=null,pending=null,HP=new THREE.Vector3();
  var blk=[[],[],[],[]],place=[],tab=[],dot=[],bar,barKey='',join,vblk,vlab,vstroke,vkey=null;
  var pipeA,pipeB,PA=[],PB=[],rule,head,hfig,headOf=null;
  var keyG,key,keyLab,keyHit,keyFoot,KW=1.8;
  var btex,bquad,marks,hdr=[],lblW=0.9,tones={};
  var HIT=new THREE.MeshBasicMaterial({visible:false}),DOT=[K.flat(pal.borderStrong),K.flat(pal.ink)];

  function tone3(h){var k='h'+h;if(!tones[k])tones[k]=[h,h,h];return tones[k];}
  function rackPt(s,i){return V(SX[s],YD-TABH-0.06-BH/2-i*PITCH,ZC);}
  function placePt(s){return V(SX[s],YD+BH/2,ZC);}
  function notify(e,d){if(ctx0&&ctx0.notify)ctx0.notify(e,d);}
  function click(n){try{TB.audio.play(n);}catch(e){}}
  /* the tokens the board is drawn from: all that exist, except one that is still being delivered */
  function toks(){var t=cur.st.tokens;return pending?t.filter(function(x){return x!==pending;}):t;}
  function nameNow(){return A.nameOf(cur.st.seg);}
  /* the name on the rail is a token that exists; and it is the token that holds the value at the end of the rail */
  function tokenNow(){var n=nameNow(),l=toks(),i;if(!n)return null;for(i=0;i<l.length;i++)if(l[i].name===n)return l[i];return null;}
  function madeNow(){var t=tokenNow(),v=cur.R.val;return !!(t&&v&&t.val&&t.val.t===v.t);}
  /* what kind of thing the value is: a colour has a colour, a length (a stroke, a radius) has none */
  function valKind(){var v=cur.R.val||{},h=v.hex?hexOf(v.hex):null;return {val:v,hex:h,col:h!==null&&!v.stroke&&!v.radius};}

  /* ---------- build ---------- */
  function build(ctx){
    ctx0=ctx;group=new THREE.Group();
    var s,i,m,o,segs,dw=DXR-DXL,dx=(DXL+DXR)/2;
    /* the frame: a base, a deck for the rail and the board, four posts */
    group.add(K.solid(dw,TH0,SD,{x:dx,y:TH0/2}));
    group.add(K.solid(dw,TD,SD,{x:dx,y:YD-TD/2}));
    segs=[];
    [[DXL,-1],[DXR,-1],[DXR,1],[DXL,1]].forEach(function(p){segs.push([p[0],TH0,p[1]*SD/2,p[0],YD-TD,p[1]*SD/2]);});
    group.add(K.lines(segs,{color:pal.borderStrong}));

    for(s=0;s<4;s++){
      /* the tab that names the level of a place: infrastructure, in slate */
      o={box:K.solid(SWD[s],TABH,0.06,{x:SX[s],y:YD-TABH/2,z:ZF+0.03}),lab:K.plate('',{size:0.23,weight:600,color:pal.slate})};
      group.add(o.box);group.add(o.lab);tab[s]=o;

      /* the words of this level. Where a word has been taken out of its rack, its outline is left. */
      for(i=0;i<A.SEG[s].length;i++){

        o.m=K.solid(SWD[s],BH,BD,{edge:pal.slate});o.m.position.copy(rackPt(s,i));
        o.lab=K.plate(A.SEG[s][i],{size:0.26,weight:600,w:SWD[s],h:BH,padX:0.14});o.lab.position.z=BD/2+0.004;o.m.add(o.lab);

    join=K.solid(1,BH-0.012,BD-0.012,{edge:null});join.position.set(0,YD+BH/2,ZC);group.add(join);
    bar=K.lines([],{color:pal.ink});bar.position.set(0,YD+BH/2,ZC);bar.visible=false;group.add(bar);

    vlab=K.plate('',{size:0.26,weight:600,w:VW,h:VH,padX:0.14});vlab.position.z=BD/2+0.004;vblk.add(vlab);
    vstroke=K.lines(rect(0,VH/2+0.004,0,VW-0.36,BD-0.3),{color:pal.slate});vblk.add(vstroke);

    pipeA=K.pipe(PR);pipeA.visible=false;group.add(pipeA);
    /* the line from the rail to the board: out of the end of the component, round the end of the deck, up beside the board,
       and open in front of it on the line between the two rows */
    PB=[V(X0,YA,ZC),V(XL,YA,ZC),V(XL,YA,ZQ),V(XL,YQ,ZQ),V(EX,YQ,ZQ)];
    pipeB=K.pipe(PR);pipeB.set(PB);group.add(pipeB);
    rule=K.lines([],{color:pal.ink});group.add(rule);
    /* the value on its way: a piece of it, in ink because it runs. A colour is that colour on every face. A length is paper,
       and what it is is drawn on its front: a stroke as that stroke, a radius as that curve. */
    head=K.solid(HS,HS,HS,{edge:pal.ink});head.visible=false;group.add(head);
    hfig=K.plate('',{w:HS,h:HS});hfig.position.z=HS/2+0.004;hfig.visible=false;head.add(hfig);

    /* the key that creates the token: a control on the front of the rail, under the value it sends */
    keyG=new THREE.Group();keyG.position.set(VX,YD-TABH/2,ZF+KD/2);group.add(keyG);
    key=K.solid(1,TABH,KD,{tone:TONE.dark,edge:pal.midnight});keyG.add(key);
    keyLab=K.plate('',{size:0.24,weight:600,color:pal.white});keyLab.position.z=KD/2+0.004;keyG.add(keyLab);
    keyHit=K.box(1,TABH+0.1,KD+0.1,HIT,0,0,0);keyHit.visible=false;keyG.add(keyHit);if(ctx.pickable)ctx.pickable(keyHit,'commit');
    keyFoot=K.lines([],{color:pal.borderStrong});keyFoot.position.set(0,YD-TABH/2,ZF);group.add(keyFoot);

    /* the board: a standing sheet. The names of its rows and columns are written on its frame. */

     name describes the value is pushed off that line against the button, up for the first row and down for the second, and
     drawn back: one push is one delivery. */

    var P=[V(EX,YQ,ZQ)],cum=[],wt=[],d=0,t,i,sum=0,all,back,hold;
    q.cells=q.ids.map(function(id){var p=id.split(':');return {v:A.VARIANTS.indexOf(p[0]),s:A.STATES.indexOf(p[1])};});
    q.n=q.conn?q.cells.length:0;

      if(Math.abs(p.y-YQ)>1e-6)leg.push(V(p.x,YQ,ZQ));

               a token that is not in the file has no place on it.

               no `$value`            not a token. Only an outline on the tray floor, the name standing at it.
               type cannot be found   a ghost. The edges of a block, no faces, no value.
               value in a wrong form  a block, but bare: no rule on it, no colour on it.
               a raw colour           the colour is its top face.      a raw length   the rule lies on its top.

               the token that points, to where the next reference leaves, in right-angled steps. One way from the raw
               value to the interface. A pipe is filled with the colour it carries, or carries the rule of a length.
               A reference that reaches nothing is a pipe that stands up from its block and ends in air. A reference whose
               chain is broken further down is a pipe that is there, and empty. Only a reference that has been pointed
               somewhere out of the ordinary leaves that height: it is led up and over, in a lane of its own.

      stop:rd.first?(rd.first.args&&rd.first.args[0]&&L.tok[rd.first.args[0]]?'k:'+rd.first.args[0]:'sheet'):null,hold:false};
    items.forEach(function(id,i){pass.idx[id]=i;});

    /* 1  the file, line by line */
    if(full)steps.push({d:WAIT});
    items.forEach(function(id,i){
      var x=id.slice(2),again=!!re[id];
      steps.push({d:!again?READ*(solve?1.5:1):(id.charAt(0)==='g'?TRAY:(tk[x].none?NAME:RISE)),
        on:function(){pass.i=i;pass.f=again?0:1;stand();edges();},
        fn:again?function(k){pass.f=K.ease(k);stand();}:null,
        off:function(){pass.f=1;stand();}});
    });
    steps.push({d:0,on:function(){pass.i=items.length;pass.f=1;stand();edges();}});
    /* 2  the references, pipe by pipe, each from the token that holds it */
    order.forEach(function(n){
      if(!re[n])return;
      var len=way(n).len;
      steps.push({d:Math.max(LAY[0],Math.min(LAY[1],len/LAY[2])),
        on:function(){pass.laying=n;pass.lay[n]=0;pipes();},
        fn:function(k){pass.lay[n]=len*K.ease(k);pipes();},
        off:function(){pass.lay[n]=1e9;pass.laying=null;pipes();}});
    });
    /* 3  the values. Where the reader stopped, the ink stays. */
    steps.push({d:0,on:function(){pass.hold=true;pipes();edges();}});
    if(any){
      steps.push({d:Math.max(RUN[0],Math.min(RUN[1],end/RUN[2]))*(solve?1.35:1),
        on:function(){pass.D=0;pipes();edges();},
        fn:function(k){
          var c,n,got=false;
          pass.D=end*K.ease(k);
          for(c=0;c<2;c++){n='f:'+c;if(part[n]&&!pass.arr[c]&&pass.D>=d0[n]+way(n).len-1e-4){pass.arr[c]=true;got=true;}}
          pipes();
          if(got){click('pick');sheet();}
        },
        off:function(){pass.D=end+1;pass.arr=[!!part['f:0'],!!part['f:1']];pipes();sheet();}});
      /* the length has arrived: the card grows around its content by it */
      if(part['f:1']&&rd.padding)steps.push({d:GROW*(solve?1.3:1),fn:function(k){pass.pad=K.ease(k);sheet();},off:function(){pass.pad=1;sheet();}});
      else steps.push({d:0,on:function(){pass.pad=1;}});
      if(!solve)steps.push({d:STAY});
    }else if(pass.stop&&!solve)steps.push({d:STOP});
    /* never longer than a pass may be */
    steps.forEach(function(s){total+=s.d||0;});
    k=Math.min(1,LIMIT[solve?'solve':(full?'full':'edit')]/Math.max(0.001,total));
    steps.forEach(function(s){if(s.d)s.d*=k;});
    pass.dur=total*k;

    stand();pipes();sheet();edges();
    play(steps,pass.dur,function(){
      if(!solve){over();return;}
      /* the file is repaired and the interface has its values: say so, and let the lines go back to rest a little later */
      K.after(TOLD,told,FL);K.after(REST,over,FL);
    },pass);
  }

  /* what the bench shows when no round is running: the first file as it is handed out, or the last one as it was left */
  function rest(){
    var r=null;
    try{r=TB.tw.restState(2,doneLit);}catch(e){}
    cur=r&&r.st?{R:r.R,st:r.st}:cur;live=false;
  }
  function onRound(data){
    var R=data&&data.R,r=data&&data.r||{},again=!!round&&round.r===r;
    stop();round=data;
    if(!R||R.type!=='op'||R.kind!=='file'||!r.st){round=null;rest();paint();return;}
    cur={R:R,st:r.st};live=!r.busy;
    paint();
    /* presented again while the pass that follows the repair was running (a change of language): the file stands
       repaired, say so */
    if(r.busy){pend=true;K.after(0.2,told,FL);return;}
    /* a new file: the reader builds the bench from it. The same round presented again (a change of language, or the
       state before an action that is about to be played once more) stands as it is. */
    if(!again)begin(null,false);
  }
  function onOp(data){
    if(!data||!data.st)return;
    var res=data.res||{},id=String(data.id||''),edit=id.indexOf('e:')===0||!!(res.fx&&res.fx.read),was=look;
    cur={R:data.R,st:data.st};
    /* a line was selected: the file is as it was, and a pass that is running goes on */
    if(!edit||!was){paint();return;}
    stop();
    if(res.solved){live=false;pend=true;}
    paint();
    begin(was,!!res.solved);
  }

  return {
    ops:true,noTargets:true,ownsChain:true,
    cam:{az:-24,el:40,margin:0.9},
    box:function(){var x0=L?L.x0:-5.2,x1=L?L.x1:5.2;return [[x0,0,BZ0],[x1,SY+SCH,BZ1]];},
    build:build,
    setLit:function(f){
      doneLit=f>=1;
      if(!group||round)return;
      stop();rest();paint();
    },
    update:function(){},
    /* for tests: is a pass running, how long is it, and how does every part stand at this moment */
    probe:function(){
      var o={pass:!!pass,dur:pass?pass.dur:0,full:!!(pass&&pass.full),at:pass&&pass.i>=0&&pass.i<pass.items.length?pass.items[pass.i]:null,pend:pend,live:live,s:[]},p,c;
      function n(v){return Math.round(v*1000)/1000;}
      TRAYS.forEach(function(g){var t=tr[g];o.s.push([g,t.plate.visible,t.tab.visible,n(t.tab.scale.y),t.label.visible,n(t.label.material.map.repeat.y),t.hit.visible].join(','));});
      ALL.forEach(function(p){var t=tk[p];o.s.push([p,t.box.visible,n(t.box.scale.y),t.foot.visible,t.label.visible,n(t.label.material.map.repeat.y),t.hit.visible,t.pipe?t.pipe.visible:'',t.pipe&&t.pipe.visible?n(t.pipe.len):'',t.rule?t.rule.visible:''].join(','));});
      for(c=0;c<2;c++)o.s.push(['feed'+c,feed[c].pipe.visible,feed[c].pipe.visible?n(feed[c].pipe.len):'',feed[c].rule.visible].join(','));
      o.s.push(['ticks',ticks.visible].join(','));
      o.s.push(['heads',hd.filter(function(h){return h.visible;}).length].join(','));
      o.s.push(['sheet',mon.btn,n(mon.pad),mon.band,valKey(mon.tr[0]),valKey(mon.tr[1])].join(','));
      return o;
    },
    on:function(evt,data){
      if(!group)return;
      if(evt==='enter'){far=false;stop();round=null;rest();paint();}
      else if(evt==='leave'){far=true;hov=null;stop();round=null;rest();paint();}
      else if(evt==='idle'){stop();round=null;rest();paint();}
      else if(evt==='round')onRound(data);
      else if(evt==='op')onOp(data);
      else if(evt==='result'){live=false;edges();}
      else if(evt==='complete'){stop();round=null;doneLit=true;rest();paint();}
      else if(evt==='hover'){var id=data&&data.id||null;if(id!==hov){hov=id;edges();}}
      else if(evt==='pick'){if(live&&data&&data.id&&/^ln:/.test(data.id)&&ctx0&&ctx0.notify)ctx0.notify('op',{id:data.id});}
      else if(evt==='lang')paint();
    }
  };
})();
})();

</script>
<script>/* stations/s4.js */
/* Station 4, "Temaet" / "The theme": a mode is a second foot.

   One tower, seen a little from the left (12 degrees) and read from the ground up:
   primitives   seven ingots. The colour is the top of the ingot; name and value are written on its front.
   roles        four tiles. A tile holds nothing: it stands on two feet, Light and Dark, and each foot is a pipe down to a
                primitive. The two feet stand side by side under their tile and each carries its name, so "one role, two
                references" is the shape of the thing. The foot of the mode in view carries its colour; the other foot is
                an empty tube.
   uses         seven component blocks, standing on the tile they point at, one short pipe each. The fan-out of a role is
                the row of pipes that rise from its tile. A component has one pipe and no feet: it has no modes.
   rooms        two sheets on one beam, Light and Dark: the same small interface, drawn twice from the same tokens.

   WHERE THINGS STAND IS THE ARGUMENT. Every tile stands straight above the primitive its Light foot points at, and both
   feet start on that primitive: Dark does not exist yet. Making Dark is moving one foot at a time. The colour leaves the
   parts in that room, draws back out of the pipes on the tile and down the foot; the empty foot is lifted, carried to
   another ingot and set down; that colour rises into the tile and out through every pipe that stands on it, and the parts
   in ONE room take it. The other room does not move.
   A component that is pointed straight at a primitive leaves its tile: its pipe is led round the tiles, down in front of
   them and onto the front of the ingot. It has no feet, so that one part changes in both rooms and nothing else follows.

   NOTHING MEETS. Every foot has a lane of its own (a depth and a height) between the ingots and the tiles and a place of
   its own on every ingot; every component has a lane between the tiles and the blocks; and the pipes that pass the tiles
   have the front of the ingots to themselves. Whatever is pointed at what, two pipes never run through each other.
   The plant is turned, so depth is seen as a step to the side: the roles to the left have the lanes furthest back, and on
   an ingot the feet of two roles stand further apart as they are seen than as they are placed.

   A ROOM SHOWS WHAT FAILS IN IT. A part whose contrast against its ground is below the plant's limit carries four corner
   marks and its ratio, for as long as it fails. A part that has just changed carries a whole frame for a moment; a part the
   player says will change carries a dashed frame. Three marks, three distances from the part: they never lie on each other.

   THE PLANT DOES THE CHANGE, ONE THING AFTER ANOTHER, so that its reach can be counted (`moveFoot`, `reroute`, `play`).
   A foot     The place it will stand on is outlined on the ingot. The old colour leaves the parts in that mode's room, the
              pipes on the tile and the foot. The empty foot is lifted out of its ingot, carried in its lane and set down.
              The new colour climbs the foot into the tile and goes on to the blocks that stand on the role, from left to
              right, one at a time. When it reaches a block, that block's part is painted in that room and framed: one,
              two, three. The other room is not touched, and nothing in it moves.
   A block    A component token has one pipe and no feet. Its pipe is emptied, drawn up into the block (for a moment it is
              a reference that reaches nothing), led out again to the other place and set down. What is there climbs it,
              and the part is painted in BOTH rooms in the same moment: one connection, two rooms.
   A check    is measured in the room, on the part, as soon as both its colours are there: the ratio is written by the
              part. A ratio that passes goes away again; one that fails gets its corner marks and stays.
   A forecast (the round with `plan`) is the dashed frames. When the change has been run, the parts it reached keep their
              whole frame for as long as the round stands, so the two kinds of frame can be read against each other.
   Every picture is drawn from the state. A change under way is one clock (`play`) on top of it: any event stops the
   clock and draws the state as it is.

   The value speaks itself: ingot tops, pipe fillings and the parts on the sheets are the token colours. Lines tell the
   state: ink is selected or running, slate is at rest, border strong is the foot of the mode that is not in view.
   The order of the roles and of the blue primitives is the plant's own (it differs from the panel's lists): it is what
   lets every Light foot stand straight. */
(function(){
'use strict';
var TB=window.TB,K=TB.kit,cfg=TB.cfg,pal=cfg.pal,TONE=cfg.tone,M=TB.ops&&TB.ops.mode;
if(!M||!TB.tw)return;
var P=M.P,I=3,MV='s4mv',FL='s4fl',MODES=['light','dark'],KEYHOT=[pal.dusk,pal.midnight2,pal.darkAccent];
/* Time. A change that does not end the round is over, marks and all, within MARK_S; what moves in it takes MOVE_S at most.
   The change that ends the round may take SOLVE_S; the plant reports half a second after it, and its marks go a second later.
   STUB: what is left of a component's pipe when it has been drawn up into its block. TOE: the end of a lifted foot. */
var MOVE_S=1.9,MARK_S=2.3,SOLVE_S=4.3,TELL_S=0.5,CALM_S=1.3,STUB=0.16,TOE=0.16;
function V(x,y,z){return new THREE.Vector3(x,y,z);}
function hx(h){return parseInt(String(h).slice(1),16);}
var flats={};function flat(h){return flats[h]||(flats[h]=[hx(h),hx(h),hx(h)]);}
function isDark(h){return !!h&&TB.tw.lum(h)<0.2;}
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ---------- the plan of the plant ---------- */
/* Every tile stands exactly above its primitive and every foot is a plumb line.
   primitives, as a ramp from left to right */
var PR=['white','grey-100','grey-800','grey-900','blue-700','blue-800','blue-900'],PITCH=1.6,IW=1.4,IH=0.8,ZF=1.25,ZB=-0.65,ID=ZF-ZB,PX={};
PR.forEach(function(p,i){PX[p]=(i-3)*PITCH;});
/* roles: each stands above the primitive its Light foot points at (`home`), and carries the components that point at it */
/* The blocks that point at one role stand shoulder to shoulder on its tile, and the tile is as wide as they are together:
   a gap in the row of blocks is the end of a role. */
var TY=2.85,TH=0.66,ZT=0.25,TD=ZT-ZB,FOOT=0.32,GAPC=0.04,PRAD=0.04,EL=26,TAN=Math.tan(EL*Math.PI/180);
var SM=[
  {n:'text-on-accent',home:'white',lab:['text-on-','accent'],size:0.25,x0:-5.6,min:1.3,cs:[['button.primary.text',1.14]]},
  {n:'surface',home:'grey-100',x0:-4.08,cs:[['card.background',1.56],['button.secondary.background',1.56]]},
  {n:'text',home:'grey-900',x0:-0.6,cs:[['card.title',0.78],['card.body',0.78],['button.secondary.text',1.46]]},
  {n:'accent',home:'blue-900',x0:PX['blue-900']-0.78,cs:[['button.primary.background',1.56]]}
];
var CY=4.75,CH=1.0,CD=0.75,COMP=[],SI={};
/* every foot has its own place on an ingot: Light to the left, Dark to the right, and a step per role */
function slot(r,mi){return (r-1.5)*0.11+(mi?FOOT:-FOOT);}
SM.forEach(function(s,r){
  var w=-GAPC,x;s.cs.forEach(function(c){w+=c[1]+GAPC;});
  s.w=Math.max(w,s.min||0);s.x1=s.x0+s.w;SI[s.n]=r;
  x=s.x0+(s.w-w)/2;
  s.cs.forEach(function(c){COMP.push({n:c[0],w:c[1],x:x+c[1]/2});x+=c[1]+GAPC;});
  /* where the two feet leave the tile: side by side, above the role's own primitive */
  s.fx=[PX[s.home]+slot(r,0),PX[s.home]+slot(r,1)];
});
/* Lanes. A foot: a depth and a height of its own between the ingots and the tiles. A component: the same between the tiles
   and the blocks, and a plane in front of the tiles for the pipe that passes them. Lanes further back lie higher, so each
   one is seen. The plant is seen from the left, where what is further back is drawn further to the left: the roles to the
   left have the lanes at the back, so two feet on one ingot are drawn apart and never on each other. */
var LZ0=0.15,LDZ=0.1,LY0=1.14,LDY=0.107,CZ0=0.15,CDZ=0.09,CLY0=TY+TH+0.14,CLDY=0.1,BZ0=0.45,BDZ=0.1,BY=1.02;
function lane(r,mi){return 2*(SM.length-1-r)+mi;}
function laneZ(r,mi){return LZ0-lane(r,mi)*LDZ;}
function laneY(r,mi){return LY0+lane(r,mi)*LDY;}
function landX(p,r,mi){return PX[p]+slot(r,mi);}
/* the beam and the two sheets on it */
var XL=SM[0].x0,XR=SM[3].x1,BMY=CY+CH,BMH=0.4,SW=5.2,SH=3.05,SGAP=0.4,SY=BMY+BMH,SZ=-0.1,RES=160,TGW=0.54,TGH=0.26;
/* the ways past the tiles: outside the row, and through the open bay between `text` and `accent`. The left one stands clear
   of the side of the first tile, which is in view. */
var WAYS=[XL-0.4,(SM[2].x1+SM[3].x0)/2-0.1,XR+0.12];
/* the name of a foot hangs on the foot, just below the edge of its tile as the drawing is seen */
function tagY(r,mi){return TY-0.045-TAN*(ZT-laneZ(r,mi))-TGH/2;}
/* the interface on a sheet, in sheet units from its top left corner */
var G={card:[0.24,0.24,4.72,2.57],title:[0.62,0.52,2.0,0.26],l1:[0.62,1.06,3.8,0.11],l2:[0.62,1.34,2.8,0.11],body:[0.62,1.06,3.8,0.39],bp:[0.62,1.73,1.75,0.62],bs:[2.66,1.73,1.8,0.62]};
/* Marks on a part stand at two distances from it. Close to it: the corners of a part that fails, and the dashed frame of a
   part the player says will change; the two are made to lie on each other (a dashed frame with whole corners). Further out:
   the frame of a part that did change. The ratio of a failing part is written beside it (the heading, the body) or under
   it (the buttons and their words). */
var OFF={part:[0.045,0.125],word:[0.03,0.09],card:[0.08,0.15]},MARK=0.03,KEYL=0.026,ARM=0.13,RSIZE=0.2,RPX=0.045,RH=0.24,DASHED=[0.07,0.05];
function txtRect(b,tw){return [b[0]+b[2]/2-tw/2-0.1,b[1]+b[3]/2-0.15,tw+0.2,0.3];}
var PARTS=['card.background','card.title','card.body','button.primary.background','button.secondary.background','button.primary.text','button.secondary.text'];

TB.i18n.add({
  da:{'s4.send':'Send','s4.cancel':'Annuller'},
  en:{'s4.send':'Send','s4.cancel':'Cancel'}
});

TB.stations[I]=(function(){
  var group,ctx0,far=true,doneLit=false;
  /* what is shown: the round's own state while a round is running, the rest state otherwise */
  var R=null,st=null,round=null,live=false,prev=null,hov=null,owed=false;
  var ing={},tile=[],leg=[],tag=[],room={},key,keyLab,keyHit,keyW=1,target,partHit={};
  /* The picture. It follows from the state (fromState); a foot on its way and a pipe being led somewhere else change it
     directly, on top of the state, and any event puts it back.
     leg[r][mi]  x: where the foot stands  lift: how far it is out of its ingot  col: the colour it carries, or null  d: how far the colour has come
     cp[i]       ref: what the component points at  col  k: how far the colour has come (0..1)
                 cut: how much of the pipe is out of the block (not set: all of it)  got: the colour has just reached the block
     mon[mode]   the colour of every part on that sheet; null is a part that has no colour at the moment
     wipe[mode]  how far a part has been painted (0..1), while it is being painted
     flash[mode] the parts that have just changed
     hold[mode]  the checks (by the part they are written at) that are not measured yet; meas[mode]: those just measured
     seq         the change under way: land [r,mi,primitive] where the foot will be set down */
  var pic={leg:[],cp:[]},mon={light:{},dark:{}},flash={light:{},dark:{}},wipe={light:{},dark:{}},hold={light:{},dark:{}},meas={light:{},dark:{}},seq=null;
  SM.forEach(function(s,r){pic.leg[r]=[{},{}];});
  COMP.forEach(function(c,i){pic.cp[i]={};});

  /* ---------- build ---------- */
  function build(ctx){
    ctx0=ctx;group=new THREE.Group();
    var hm=new THREE.MeshBasicMaterial({visible:false});
    function hit(w,h,d,x,y,z,id){var m=K.box(w,h,d,hm,x,y,z);m.visible=false;group.add(m);if(ctx.pickable)ctx.pickable(m,id);return m;}
    /* primitives: ingots. The colour is the top. */
    PR.forEach(function(p){
      var x=PX[p],o={n:p,x:x};
      o.box=K.solid(IW,IH,ID,{x:x,y:IH/2,z:(ZF+ZB)/2,edge:pal.slate,tone:[hx(P[p]),TONE.paper[1],TONE.paper[2]]});
      o.label=K.plate([[{t:p}],[{t:P[p],c:pal.slate,w:400,s:0.2}]],{size:0.25,weight:600,w:IW,h:IH,padX:0.12});
      o.label.position.set(x,IH/2,ZF+0.004);
      o.hit=hit(IW+0.12,IH+0.2,ID,x,(IH+0.2)/2,(ZF+ZB)/2,'i:'+p);
      group.add(o.box);group.add(o.label);ing[p]=o;
    });
    /* the place a foot is about to be moved to */
    target=K.lines([],{color:pal.ink});target.visible=false;group.add(target);
    /* roles: tiles on two feet */
    SM.forEach(function(s,r){
      var t={s:s,x:(s.x0+s.x1)/2};
      t.box=K.solid(s.w,TH,TD,{x:t.x,y:TY+TH/2,z:(ZT+ZB)/2,edge:pal.slate});
      t.label=K.plate(s.lab||[s.n],{size:s.size||0.28,weight:600,w:s.w,h:TH,padX:0.13});
      t.label.position.set(t.x,TY+TH/2,ZT+0.004);
      t.hit=hit(s.w,TH+0.1,TD,t.x,TY+TH/2,(ZT+ZB)/2,'t:'+s.n);
      group.add(t.box);group.add(t.label);tile[r]=t;
      leg[r]=[];tag[r]=[];
      MODES.forEach(function(md,mi){
        var p=K.pipe(PRAD);group.add(p);leg[r][mi]=p;
        /* the name of the foot, on the foot */
        var g=K.plate('',{size:0.2,weight:600,w:TGW,h:TGH,align:'center',bg:pal.surface});
        g.position.set(s.fx[mi],tagY(r,mi),laneZ(r,mi)+PRAD+0.016);
        group.add(g);tag[r][mi]=g;
      });
    });
    /* uses: component blocks, one pipe each */
    COMP.forEach(function(c,i){
      c.box=K.solid(c.w,CH,CD,{x:c.x,y:CY+CH/2,z:ZT-CD/2,edge:pal.slate});
      c.label=K.plate(c.n.match(/[^.]+\.?/g),{size:0.24,weight:600,w:c.w,h:CH,padX:0.08});
      c.label.position.set(c.x,CY+CH/2,ZT+0.004);
      c.hit=hit(c.w,CH,CD,c.x,CY+CH/2,ZT-CD/2,'c:'+c.n);
      c.pipe=K.pipe(PRAD);
      group.add(c.box);group.add(c.label);group.add(c.pipe);
    });
    /* rooms: one beam on the blocks, two sheets on the beam */
    group.add(K.solid(XR-XL,BMH,CD,{x:(XL+XR)/2,y:BMY+BMH/2,z:ZT-CD/2,edge:pal.slate}));
    MODES.forEach(function(md,mi){
      var x=(XL+XR)/2+(mi?1:-1)*(SW+SGAP)/2,y=SY+SH/2,o={x:x,y:y,x0:x-SW/2,y1:SY+SH};
      o.slab=K.solid(SW,SH,0.1,{x:x,y:y,z:SZ-0.05,tone:[pal.surface,pal.fog,pal.border],edge:pal.slate});
      o.tex=K.tex(Math.round(SW*RES),Math.round(SH*RES));
      o.quad=K.quad(SW,SH,new THREE.MeshBasicMaterial({map:o.tex,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-2}),x,y,SZ+0.002);

  /* The parts of a room that fail their contrast check: {part: check}. A check is asked for only while both its colours are

  /* A room: a card with a heading, two lines of text, a primary and a secondary button. Seven parts, each in the colour its
     component token resolves to in this room's mode. A part with no colour at the moment is its outline. */
  function drawRoom(md){
    var o=room[md],c=o.tex.image.getContext('2d'),m=mon[md],wp=wipe[md],css=K.css,LW=0.016;
    var bg=m['card.background'],on=bg||K.css(pal.surface);
    function soft(ground){return css(isDark(ground)?pal.white:pal.slate);}
    /* the part of the current path that has been painted: all of it, or as far as the colour has come, from the left */
    function coat(n,g,col){

      if(k<=0)return;

    }

      if(col)coat(n,g,col);

    c.setTransform(RES,0,0,RES,0,0);

    rr(c,G.card[0],G.card[1],G.card[2],G.card[3],0.1);c.fillStyle=css(pal.surface);c.fill();if(bg)coat('card.background',G.card,bg);
    c.lineWidth=LW;c.strokeStyle=css(bg&&wp['card.background']===undefined?pal.borderStrong:pal.slate);c.stroke();
    bar('card.title',G.title,m['card.title']);bar('card.body',G.l1,m['card.body']);bar('card.body',G.l2,m['card.body']);
    var bpb=m['button.primary.background'],bsb=m['button.secondary.background'],bpt=m['button.primary.text'],bst=m['button.secondary.text'];
    rr(c,G.bp[0],G.bp[1],G.bp[2],G.bp[3],0.07);part('button.primary.background',G.bp,bpb,on);
    rr(c,G.bs[0],G.bs[1],G.bs[2],G.bs[3],0.07);if(bsb)coat('button.secondary.background',G.bs,bsb);
    /* the secondary button has the colour of the surface: its outline is in the colour of its text */
    c.lineWidth=LW;c.strokeStyle=bst||soft(bsb||on);c.stroke();

      c.font='600 '+(0.27*RES)+'px '+K.FACE;c.textAlign='center';c.textBaseline='middle';
      var x=(g[0]+g[2]/2)*RES,y=(g[1]+g[3]/2+0.012)*RES,wd=c.measureText(s).width,k=wp[n];
      if(!col||k!==undefined){c.lineWidth=LW*0.8*RES;c.strokeStyle=soft(ground);c.strokeText(s,x,y);}
      if(col&&k===undefined){c.fillStyle=col;c.fillText(s,x,y);}
      else if(col&&k>0){c.save();c.beginPath();c.rect(x-wd/2-2,y-0.25*RES,(wd+4)*k,0.5*RES);c.clip();c.fillStyle=col;c.fillText(s,x,y);c.restore();}
      c.setTransform(RES,0,0,RES,0,0);

    /* Marks. All of them are Ink on a white keyline, so that they hold on a light part and on a dark one.
       corners and a ratio: the part fails its contrast check in this room, for as long as it does
       a ratio alone:       the check has just been measured here and passes; it goes away again
       a dashed frame:      the player says the part will change (a fine frame: the part under the pointer)
       a whole frame:       the part did change; it stands further out and goes away again (it stays when it answers a forecast) */
    function geo(n){

        n==='button.secondary.background'?[G.bs,OFF.part]:n==='button.primary.text'?[txtRect(G.bp,w1),OFF.word]:[txtRect(G.bs,w2),OFF.word];
    }
    function line(wd,dash){

      c.strokeStyle=css(pal.white);c.lineWidth=wd+KEYL;c.stroke();
      if(dash)c.setLineDash(dash);

    function corners(g,d,a){

    var bad=failing(md),ms=measured(md),got=md==='dark'?reached():null,notes=[];

      var under=G.bp[1]+G.bp[3]+OFF.part[1]+0.045,end={};
      notes.forEach(function(q){
        var n=q[0],g=q[1],w=c.measureText(q[2]).width/RES+2*RPX,x,y;

        else if(n==='card.body'){x=G.l2[0]+G.l2[2]+0.14;y=G.l1[1]+G.l1[3]+0.045;}

  }

  /* frame the parts whose colour is not what it was */

  }
  /* One clock for a whole change. `steps` are run one after another: {d seconds, s() as it begins, f(k) while it runs with k
     from 0 to 1, e() as it ends}. The steps are given at an easy pace and are all shortened alike when together they are
     longer than the change may take, so the end comes when it must, whatever the frame rate. */
  function play(steps,limit,done){

        if(last||t>=t0+d-1e-6){if(q.f)q.f(1);if(q.e)q.e();t0+=d;i++;on=false;}
        else{if(q.f)q.f((t-t0)/d);return;}
      }
    }
    K.run(total,function(k){try{at(k*total,k>=1);}catch(e){i=steps.length;if(window.console)console.warn('[TB.s4]',e);}},function(){done(total);},MV);
    return total;
  }
  /* The checks that cannot be measured while the parts in `pend` have no colour are held back in the rooms `mds`: they are
     measured as their parts get their colours (`now`). `all`: the room has shown no check until now, so the others are held
     back too, and are measured when the change is over (`late`). */
  function holdBack(mds,pend,all){
    var todo={now:{light:{},dark:{}},late:{light:{},dark:{}}};
    mds.forEach(function(md){M.CHECKS.forEach(function(row){
      var own=pend[row[1]]||pend[row[2]];
      if(own||all){hold[md][row[1]]=true;todo[own?'now':'late'][md][row[1]]=true;}
    });});
    return todo;
  }
  /* Every check that now has both its colours is measured, one after another: its ratio is written by its part. */
  function measure(steps,mds,todo,pend){
    M.CHECKS.forEach(function(row){
      if(pend[row[1]]||pend[row[2]])return;
      var due=mds.filter(function(md){return todo[md][row[1]];});
      if(!due.length)return;
      due.forEach(function(md){delete todo[md][row[1]];});
      steps.push({d:0.16,s:function(){due.forEach(function(md){delete hold[md][row[1]];meas[md][row[1]]=true;drawRoom(md);});}});
    });
  }
  /* The colour has reached block i: its part is painted in the rooms `mds`, from the left, and framed where it is not what it was. */
  function arrive(steps,mds,i,before,after){
    var n=COMP[i].n;
    steps.push({d:0.2,
      s:function(){
        pic.cp[i].got=true;
        mds.forEach(function(md){mon[md][n]=after[md][n];wipe[md][n]=0;if(before[md][n]!==after[md][n])flash[md][n]=true;});
        click('pick');paint();
      },
      f:function(k){mds.forEach(function(md){wipe[md][n]=K.ease(k);drawRoom(md);});},
      e:function(){mds.forEach(function(md){delete wipe[md][n];drawRoom(md);});}});
  }
  /* One foot is moved. The colour leaves the parts in this mode's room, draws back out of the pipes that stand on the tile
     and down the foot into its ingot. The empty foot is lifted, carried in its lane and set down on the other ingot, and
     that colour rises the same way up. From the tile it goes on to one block after another, and each part takes it as it
     arrives. `all`: the room has shown no check until now, so all of them are measured. */
  function moveFoot(r,mi,from,before,limit,all,done){
    var L=pic.leg[r][mi],md=MODES[mi],s=SM[r],to=st.sem[s.n][md],users=[],x0=landX(from,r,mi),x1=landX(to,r,mi),after=mon,pend={},todo,steps=[],len,len2;
    COMP.forEach(function(c,i){if(st.comp[c.n]==='s:'+s.n)users.push(i);});
    L.x=x0;L.col=P[from];L.d=1e3;L.run=true;
    mon=clone(after);
    users.forEach(function(i){var q=pic.cp[i];q.col=P[from];q.k=1;q.run=true;mon[md][COMP[i].n]=null;pend[COMP[i].n]=true;});
    seq={land:[r,mi,to]};
    todo=holdBack([md],pend,all);
    show();len=leg[r][mi].len;len2=legLen(r,mi,x1);
    if(users.length)steps.push({d:0.3,f:function(k){users.forEach(function(i){pic.cp[i].k=1-K.ease(k);layComp(i);});},e:function(){users.forEach(function(i){pic.cp[i].col=null;layComp(i);});}});
    steps.push({d:0.22+Math.min(0.3,len*0.06),f:function(k){L.d=len*(1-K.ease(k));layLeg(r,mi);},e:function(){L.col=null;layLeg(r,mi);}});
    steps.push({d:0.26,f:function(k){L.lift=K.ease(k);layLeg(r,mi);}});
    steps.push({d:Math.min(0.7,0.3+Math.abs(x1-x0)*0.08),f:function(k){L.x=x0+(x1-x0)*K.ease(k);layLeg(r,mi);}});
    steps.push({d:0.26,f:function(k){L.lift=1-K.ease(k);layLeg(r,mi);},e:function(){L.lift=0;L.x=x1;L.col=P[to];L.d=0;seq.land=null;click('place');layLeg(r,mi);paint();}});
    steps.push({d:0.2+Math.min(0.35,len2*0.07),f:function(k){L.d=len2*K.ease(k);layLeg(r,mi);},e:function(){L.d=1e3;layLeg(r,mi);}});
    users.forEach(function(i){
      var q=pic.cp[i];
      steps.push({d:0.3,s:function(){q.col=P[to];q.k=0;},f:function(k){q.k=K.ease(k);layComp(i);}});
      arrive(steps,[md],i,before,after);
      delete pend[COMP[i].n];
      measure(steps,[md],todo.now,pend);
    });
    measure(steps,[md],todo.late,{});
    return play(steps,limit,done);
  }
  /* One component is pointed somewhere else. It has one pipe and no feet: the colour draws back out of it, the pipe is drawn
     up into its block, led out again to the new place and set down, and what is there rises. The part answers in both rooms
     in the same moment. */
  function reroute(i,from,was,before,limit,done){
    var q=pic.cp[i],c=COMP[i],n=c.n,to=st.comp[n],col=M.hex(st,n,st.view),after=mon,pend={},todo,steps=[],len,len2;
    q.ref=to;len2=K.length(compPts(i));
    q.ref=from;q.col=M.hex(was,n,st.view);q.k=1;q.run=true;q.cut=undefined;
    mon=clone(after);MODES.forEach(function(md){mon[md][n]=null;});pend[n]=true;
    seq={land:null};
    todo=holdBack(MODES,pend,false);
    show();len=c.pipe.len;
    steps.push({d:0.25,f:function(k){q.k=1-K.ease(k);layComp(i);},e:function(){q.col=null;layComp(i);}});
    steps.push({d:0.2+Math.min(0.25,len*0.05),f:function(k){q.cut=len+(STUB-len)*K.ease(k);layComp(i);},e:function(){q.ref=to;q.cut=STUB;layComp(i);}});
    steps.push({d:0.25+Math.min(0.4,len2*0.06),f:function(k){q.cut=STUB+(len2-STUB)*K.ease(k);layComp(i);},e:function(){q.cut=undefined;q.col=col;q.k=0;click('place');layComp(i);}});
    steps.push({d:0.22+Math.min(0.35,len2*0.05),f:function(k){q.k=K.ease(k);layComp(i);}});
    arrive(steps,MODES,i,before,after);
    measure(steps,MODES,todo.now,{});
    return play(steps,limit,done);
  }
  /* the round has been solved and the plant has shown it: said once, however often the round is presented again */
  function tellDone(){if(!owed)return;owed=false;if(ctx0&&ctx0.notify)ctx0.notify('opDone');}
  function onOp(data){
    if(!round||!data||!data.st)return;
    var res=data.res||{},was=prev,feet=[],cs=[],before,solved=!!res.solved,limit=solved?SOLVE_S:MOVE_S,all;
    st=data.st;R=data.R||R;prev=clone(st);
    K.clear(MV);K.clear(FL);still();
    owed=solved;
    if(solved)live=false;
    if(was){
      SM.forEach(function(s,r){MODES.forEach(function(md,mi){if(was.sem[s.n][md]!==st.sem[s.n][md])feet.push([r,mi,was.sem[s.n][md]]);});});
      COMP.forEach(function(c,i){if(was.comp[c.n]!==st.comp[c.n])cs.push([i,was.comp[c.n]]);});
    }
    /* a forecast is run: the rooms have said nothing about what fails until now */
    all=!!(R&&R.plan&&was&&!was.ran&&st.ran);
    before=hexes(was||st);
    fromState();
    /* The change has been carried out: what stands now is the state. The plant reports a solved round once; the marks of
       the change stay a little longer, and a change that did not end the round is over, marks and all, within MARK_S. */
    function end(t){
      seq=null;fromState();show();
      if(solved)K.after(TELL_S,tellDone,MV);
      K.after(solved?CALM_S:Math.max(0.3,MARK_S-(t||0)),calm,FL);
    }
    if(far)end(0);
    else if(feet.length===1&&!cs.length&&MODES[feet[0][1]]===st.view)moveFoot(feet[0][0],feet[0][1],feet[0][2],before,limit,all,end);
    else if(cs.length===1&&!feet.length)reroute(cs[0][0],cs[0][1],was,before,limit,end);
    else{mark(before);end(MARK_S-1.4);}
  }

  /* ---------- rounds ---------- */
  function reset(){K.clear(MV);K.clear(FL);still();hov=null;}
  /* what stands here when no task is waiting: the first task as it begins, or the last one as it ended */
  function rest(){
    var o=TB.tw.restState(I,doneLit);
    round=null;live=false;prev=null;owed=false;
    if(o&&o.st){R=o.R;st=o.st;}else{R={};st=M.init({});}
    fromState();
  }
  function onRound(data){
    reset();
    if(!data||!data.R||data.R.type!=='op'||data.R.kind!=='mode'||!data.r||!data.r.st){rest();show();return;}
    round=data;R=data.R;st=data.r.st;live=!data.r.busy;prev=clone(st);
    fromState();show();
    /* presented again while its change was under way (a change of language): it is shown as done, and that is said if it
       has not been said yet */
    owed=!!data.r.busy&&(owed||!(TB.state&&TB.state.ans));
    if(owed)K.after(0.2,tellDone,MV);
  }
  function onPick(id){
    /* when no task is waiting, the two sheets still show the references of their mode */
    if(!round&&st&&id&&id.charAt(0)==='v'&&!far){if(st.view!==id.slice(2)){st.view=id.slice(2);click('ui');fromState();show();}return;}
    if(!live||!id||!st)return;
    var k=id.charAt(0),x=id.slice(2),s=st.sel,op=null;
    if(id==='run')op='run';
    else if(k==='q')op='pp:'+x;
    else if(k==='v'){if(st.view!==x)op='v:'+x;}
    else if(k==='c')op='sel:c:'+x;
    else if(k==='t'){
      if(s&&s.charAt(0)==='c'){if(st.comp[s.slice(2)]!=='s:'+x)op='to:s:'+x;}
      else op='sel:s:'+x;
    }
    else if(k==='i'&&s){
      if(s.charAt(0)==='s'?st.sem[s.slice(2)][st.view]!==x:st.comp[s.slice(2)]!=='p:'+x)op='to:p:'+x;
    }
    if(op&&ctx0&&ctx0.notify)ctx0.notify('op',{id:op});
  }

  return {
    ops:true,noTargets:true,ownsChain:true,
    cam:{az:-12,el:EL,margin:0.7},
    box:function(){return [[XL-0.3,0,ZB],[XR+0.3,SY+SH,ZF]];},
    build:build,
    setLit:function(f){
      doneLit=f>=1;
      if(!group||round)return;
      reset();rest();show();
    },
    update:function(){},
    /* what is drawn at this moment, for the tests: the change under way, and the picture that lies on top of the state */
    picture:function(){
      function n(v){return Math.round(v*100)/100;}
      return JSON.stringify({busy:!!seq,land:seq&&seq.land?seq.land[2]:null,
        leg:pic.leg.map(function(a){return a.map(function(L){return [n(L.x),n(L.lift),L.col||null,L.d>=100];});}),
        cp:pic.cp.map(function(q){return [q.ref,q.col||null,n(q.k),q.cut===undefined?null:n(q.cut),!!q.got];}),
        mon:mon,flash:flash,meas:meas,hold:hold,wipe:wipe});
    },
    on:function(evt,data){
      if(!group)return;
      if(evt==='enter'){far=false;reset();rest();show();}
      else if(evt==='leave'){far=true;reset();rest();show();}
      else if(evt==='idle'){reset();rest();show();}
      else if(evt==='round')onRound(data);
      else if(evt==='op')onOp(data);
      else if(evt==='result'){live=false;hov=null;paint();drawRoom('dark');}
      else if(evt==='complete'){reset();rest();show();}
      else if(evt==='hover'){var id=data&&data.id||null;if(id===hov)return;var q=(hov&&hov.charAt(0)==='q')||(id&&id.charAt(0)==='q');hov=id;paint();if(q)drawRoom('dark');}
      else if(evt==='pick'){if(data)onPick(data.id);}
      else if(evt==='lang'){relabel();show();}
    }
  };
})();
})();

</script>
<script>/* stations/s5.js */
/* Station 5, "Pipelinen" / "The pipeline": the source is one place, the output is generated.

   One line from left to right, and everything that stands in it has a job:
   Source    two files in a rack, the intake of the build. `options.json` holds the two colours as ingots. `tokens.json` holds the
             role `accent` as a tile and the token that is built, `button.primary.background`, as a block. The references are one
             pipe, as in level 1: up out of the colour, through the tile, across its top and into the block. A file that is in the
             build stands in the rack. A file that is not is drawn out in front of it, and its place in the rack is an outline.
             When `options.json` is out, the pipe under `accent` ends in air: that is the reference the build cannot follow.
   Build     one housing. Its four steps are written on its front in the order they run. A parcel leaves the token that is built
             and stands at the step that is running. When the build stops, the parcel stays at that step and the step stays in
             ink, until the build is run again: `st.log` says where. The dark key runs it.
   Output    one crate of code per platform, standing where the line ends. The code is text: the name of the file and the line the
             build wrote. Web is on the floor, iOS on the deck above it, so the two lines of code can be read against each other.
   Devices   a browser and a phone, each fed by a pipe from its crate. The button has the colour the file gives it. A file the
             platform cannot read has stopped short of its place, in ink, and the device's pipe reaches nothing.

   THE STRUCTURE SPEAKS MOTH. THE VALUE SPEAKS ITSELF. The colour is one colour from the ingot to the two buttons; the code that
   carries it is different text in the two crates.

   Generated output is replaced by every build. A fresh crate comes out of the housing for every platform that is fed from the
   source, and the crate that stood there is pushed off the line, slowly enough to be read as it goes. A change made by hand in
   a crate (the value underlined by a freehand line) leaves with it.
   A hand-made copy is not on the line. It stands behind the place where the generated file would stand, every line of it
   underlined by the same freehand line, and the phone's pipe goes to it. The rails from the build to that place are loose. Nothing a build does reaches it.

   State lives in the logic (`TB.ops.line`). Everything here is drawn from it; a run of the build is an overlay that can be cut at
   any moment. */
(function(){
'use strict';
var TB=window.TB,K=TB.kit,cfg=TB.cfg,pal=cfg.pal,TONE=cfg.tone;

/* source: the rack, its two files, and what stands in them */
var XL=-5.45,RW=2.6,RX=XL+RW/2,RD=1.3,RZF=RD/2,SLH=0.36,UY=1.8,INW=1.22,INH=0.72,TLH=0.46,BD=0.8,ZC=RZF-BD/2,DZ=1.0,PR=0.08;
var FILES=['options','tokens'],PRIM=['blue-900','grey-700'],INX=[RX-0.64,RX+0.64];

/* the parcel: what the build is working on. It stands out of the front of the housing, at the head of the step it is at, far

TB.i18n.add({
  da:{'s5.st.0':'Flet','s5.st.1':'Transformér','s5.st.2':'Følg referencer','s5.st.3':'Formatér','s5.send':'Send'},
  en:{'s5.st.0':'Merge','s5.st.1':'Transform','s5.st.2':'Resolve references','s5.st.3':'Format','s5.send':'Send'}

function ingotText(name,val){return [[{t:name}],[{t:val,c:pal.slate,w:400,s:0.2}]];}
/* a line of code, wrapped between words. A short `key: value` is kept together; a name is never broken. */

    else u.push(w[i]);

  for(i=0;i<u.length;i++){

  for(i=0;i<lines.length;i++){
    var a=lines[i].split(' '),b=base[i].split(' '),x=0;
    for(j=0;j<a.length;j++){
      if(a[j]!==b[j]){var core=a[j].replace(/[,;)]+$/,'');out.push({l:i,a:x,b:x+core.length});}

TB.stations[4]=(function(){
  var group,ctx0,round=null,cur=null,last=null,doneLit=false,far=true,hov=null,live=false,busy=false,keyDown=false,flash=null;
  var src={tray:{},place:{}},parcel,hous,steps,key,keyLabel,keyHit,nkey=[],line={},VT=[];
  /* the build as it runs: the step the parcel stands at (-1: none yet, 4: through), and whether it is on its way to the housing */
  var stepAt=-1,transit=false;

  /* ---------- a crate: a box of code. Its front is the file: its name, and the line that was written ---------- */
  function makeCrate(w,h){

    o.box=K.solid(w,h,CD,{edge:pal.slate});

  }

      c.font='600 '+(0.24*R)+'px '+K.FACE;c.fillStyle=K.css(pal.slate);c.fillText(ct.name,PADX*R,0.36*R);
      c.font='400 '+(CODE*R)+'px '+MONO;c.fillStyle=K.css(pal.ink);

      /* what a hand wrote is underlined by hand */

      (ct.marks||[]).forEach(function(m){

        c.beginPath();

  }
  function setCrate(o,ct){
    var k=ct?JSON.stringify(ct):'';
    if(k===o.key)return;
    o.key=k;o.c=ct;drawCrate(o);
  }
  /* how much of a crate is out of the housing: f of its length, the leading end first; p is where the leading end is */
  function setLead(o,p){
    var f=Math.max(0,Math.min(1,(p-OUT)/CW));
    o.g.position.x=p-CW/2;
    o.box.scale.x=Math.max(0.0005,f);o.box.position.x=(1-f)*CW/2;

  /* ---------- a device: the rendered interface on a sheet, standing on a foot ---------- */

  /* A browser window and a phone, with the same small interface: a heading, two lines, and the Send button. The button is the
     colour its file gives it. When no file gives it one, the button is not there: an outline. */
  function drawDevice(o){
    var c=o.tex.image.getContext('2d'),R=DRES,w=o.w,h=o.h,px=1/R,css=K.css,web=o.pl==='web',bx,by,bw,bh=0.27,top;

  function setDevice(o,hex){var k=(hex||'')+'/'+TB.i18n.lang;if(o.key===k)return;o.key=k;o.hex=hex||null;drawDevice(o);}

  /* ---------- a platform: rails from the build, the place of its crate, the pipe to its device ---------- */
  function makeLine(pl,hit){
    var y=LY[pl],h=CH[pl],L={pl:pl,y:y,g:new THREE.Group()},yp=y+BSH/2;
    L.rails=K.lines([[OUT,y+0.003,-CD/2,CX0,y+0.003,-CD/2],[OUT,y+0.003,CD/2,CX0,y+0.003,CD/2]],{color:pal.slate});

  /* ---------- build ---------- */

      var y=fi?UY:0,t={g:new THREE.Group(),y:y,tok:[]};

    });

    PRIM.forEach(function(p,j){

      o.label=K.plate(ingotText(p,P[p]),{size:0.24,weight:600,w:INW,h:INH,padX:0.07});
      o.label.position.set(INX[j],SLH+INH/2,RZF+0.004);

       one pipe, up out of the ingot, through the tile, across its top and into the block (level 1, small). */
    (function(){

      o.box=K.solid(AW,TLH,BD,{x:AX,y:TKY+TLH/2,z:ZC,edge:pal.slate});
      o.label=K.plate('accent',{size:0.24,weight:600,w:AW,h:TLH,padX:0.08});
      o.label.position.set(AX,TKY+TLH/2,RZF+0.004);
      o.fileHit=hit(t.g,AW,TLH,BD,AX,TKY+TLH/2,ZC,'f:tokens');
      c.box=K.solid(CMW,CMH,BD,{x:CMX,y:TKY+CMH/2,z:ZC,edge:pal.slate});
      c.label=K.plate(String(c.name).match(/[^.]+\.?/g),{size:0.2,weight:600,w:CMW,h:CMH,padX:0.07});
      c.label.position.set(CMX,TKY+CMH/2,RZF+0.004);
      c.fileHit=hit(t.g,CMW,CMH,BD,CMX,TKY+CMH/2,ZC,'f:tokens');

    keyLabel=K.plate('',{size:0.24,weight:600,color:pal.white,w:1.9,h:0.42,align:'center'});keyLabel.position.z=0.074;key.add(keyLabel);
    group.add(key);

    NT.forEach(function(n,i){

  /* ---------- state -> what is to be drawn ---------- */
  /* Where a build stopped, as its log says: with nothing to build at the first step, with a reference that leads nowhere at
     the third. A round can begin with a build that had already stopped (`pipe.stopped`, with the step in `at`).
     -1: it did not stop in the housing. */
  function stopAt(log){
    var k=log&&log.key;
    if(k==='pipe.e.empty')return 0;
    if(k==='pipe.e.ref')return 2;
    if(k==='pipe.stopped')return log.at==='merge'?0:(log.at==='resolve'?2:-1);
    return -1;
  }
  function derive(c){
    var st=c.st,R=c.R,L=TB.ops.line,f=st.files||{},pp=st.plat||{};
    var v={goal:R?R.goal:null,files:{options:!!f.options,tokens:!!f.tokens},accent:st.accent==='grey-700'?1:0,stop:stopAt(st.log),plat:{}};
    ['web','ios'].forEach(function(pl){
      var p=pp[pl],sh,b=null,cl;if(!p)return;
      sh=L.shown(st,pl);
      /* a patched crate: what the build had written is needed to see what the hand changed */
      if(sh.from==='patched'){cl=TB.tw.clone(st);cl.plat[pl].patch=null;b=L.shown(cl,pl).line;}
      v.plat[pl]={feed:p.feed,name:p.name,line:sh.line,hex:sh.hex,from:sh.from,ok:sh.ok,base:b};
    });
    return v;
  }
  function onLine(pv){return !!(pv&&pv.feed==='source'&&pv.line);}

  /* ---------- the picture at rest ---------- */
  /* the way of the colour through the source: up out of ingot i, under the tile `accent`, up through it, across its top and into
     the block of the token that is built. lift: how far the foot is drawn out of the ingot. */
  function refPath(i,lift){
    var x=INX[i],y0=SLH+INH,yM=y0+(UY-y0)/2,yS=TKY+TLH+PR;
    return [V(x,y0+lift*(yM-y0),ZC),V(x,yM,ZC),V(AX,yM,ZC),V(AX,yS,ZC),V(CMX-CMW/2+0.02,yS,ZC)];
  }
  /* The references. `button.primary.background` points at `accent`: that pipe is always there, both stand in the same file.
     `accent` points at a colour: with both files in the build the pipe reaches it, and the whole way is filled with the colour.
     With a file out it reaches nothing: a pipe that ends in air under the tile, and nothing in it. */
  function layRef(v){
    var whole=v.files.options&&v.files.tokens,q=refPath(v.accent,0),p;
    if(whole){
      /* straight above the ingot there is no step sideways */

      src.pipe.set(q);src.pipe.tone(VT[v.accent],pal.slate).fill(1e3);
    }else{

  function paintSource(v){

      t.label.setText(TB.t('pipe.f.'+f));
      t.label.position.x=RX-RW/2+0.16+t.label.w/2;

    });

  }
  /* The steps of the build. At rest they are in slate. While the build runs, the parcel stands at the step that is running, that
     step is in ink, and the steps it has not reached are pale. A build that stopped has left all of that as it was when it
     stopped: the parcel at the step, the step in ink, the rest not reached. It stays so until the build is run again. */

    var at=busy?stepAt:v.stop,on=at>=0&&at<=3,rows=[],i;
    for(i=0;i<4;i++)rows.push([{t:TB.t('s5.st.'+i),c:!on||i<at?pal.slate:(i===at?pal.ink:pal.mist)}]);
    steps.visible=!far;
    steps.setText(rows);
    if(!transit){parcel.visible=on;if(on)parcel.position.set(PXC,rowY(at),PZ);}
  }
  function paintBuild(v){
    var tall=!!v.plat.ios,H=tall?HT:HS,ios=v.plat.ios,sel=!!(ios&&ios.feed==='source');
    hous.scale.y=H;hous.position.y=H/2;
    paintSteps(v);
    keyLabel.visible=!far;keyLabel.setText(TB.t('pipe.build'));
    nkey.forEach(function(o){
      var on=sel&&ios.name===o.name,t=TB.t('pipe.nt.'+o.name);
      o.box.visible=sel;o.on=on;
      if(!sel)return;
      o.box.setTone(on?TONE.dark:TONE.paper);
      o.label.visible=!far;o.label.setText(t,{color:on?pal.white:pal.ink});
    });
  }
  /* the pipe between a file and its device. It is whole only when the device can read the file, and then it carries the colour.
     Otherwise it is a pipe out of the device that reaches nothing. */
  function layPipe(L,pv,d){
    var hand=pv.feed==='copy',ok=hand||(pv.feed==='source'&&pv.ok&&!!pv.hex),n;
    L.pipe.show(0,ok).show(1,ok&&hand).show(2,true);
    L.pipe.set(hand?L.pts.hand:L.pts.line);
    if(ok){n=hexN(pv.hex);L.pipe.tone([n,n,n],pal.slate).fill(d===undefined?1e3:d);}
    else L.pipe.fill(-1);
  }
  function paintLine(pl,pv){
    var L=line[pl];

    var srcFed=pv.feed==='source',has=onLine(pv);
    L.rails.setDash(srcFed?0:DASH[0],srcFed?0:DASH[1]);

  /* what can be pressed, and what the pointer is on. Selection is told by the lines: ink. */
  function mark(){

    ios=v.plat.ios;src0=live&&v.goal==='source';
    FILES.forEach(function(f){
      var t=src.tray[f],h=hov==='f:'+f;
      t.hit.visible=live;
      t.slab.setEdge(h?pal.ink:pal.borderStrong);
      src.place[f].setColor(h?pal.ink:pal.mist);
      t.tok.forEach(function(o,j){
        var sh=f==='options'&&src0;
        o.fileHit.visible=live&&!sh;
        if(o.srcHit){o.srcHit.visible=sh&&v.accent!==j;o.block.visible=sh&&v.accent===j;}
        o.box.setEdge(h&&!sh||(sh&&hov==='src:'+o.name)?pal.ink:pal.slate);
      });
    });
    keyHit.visible=live;
    key.setTone(hov==='build'&&!keyDown?[pal.dusk,pal.midnight2,pal.darkAccent]:TONE.dark);
    key.position.z=HZF+0.07-(keyDown?0.05:0);
    nkey.forEach(function(o){
      var sel=!!(ios&&ios.feed==='source');
      o.hit.visible=live&&sel&&!o.on;
      o.box.setEdge(o.on?pal.midnight:(hov==='name:ios:'+o.name?pal.ink:pal.slate));
    });
    ['web','ios'].forEach(function(pl){
      var L=line[pl],pv=v.plat[pl],can=!!(pv&&src0&&pv.feed==='source'&&pv.from==='gen');
      L.patchHit.visible=can;

      var srcFed=pv.feed==='source',toSrc=hov==='feed:ios:source'&&pl==='ios';
      /* a crate the platform cannot read is where this line stopped: in ink, like the step of a build that stopped */
      if(!busy)L.crate.box.setEdge((hov==='patch:'+pl&&can)||flash===pl||pv.from==='rejected'?pal.ink:pal.slate);
      L.rails.setColor(toSrc?pal.ink:(srcFed?pal.slate:pal.borderStrong));
      L.place.setColor(toSrc?pal.ink:(srcFed?pal.mist:pal.borderStrong));
      if(pl==='ios'){
        L.srcHit.visible=live&&!srcFed;
        L.copyHit.visible=live&&srcFed&&!onLine(pv);
        L.handPlace.setColor(hov==='feed:ios:copy'?pal.ink:pal.mist);
      }
    });
    if(!v.plat.ios){line.ios.srcHit.visible=false;line.ios.copyHit.visible=false;line.ios.patchHit.visible=false;}
  }
  function paint(){
    var v=derive(cur);last=v;

    mark();
  }

  /* ---------- what an action looks like ---------- */
  function still(){
    K.clear(BL);K.clear(TR);K.clear(RP);K.clear(KY);K.clear(FLH);
    busy=false;stepAt=-1;transit=false;keyDown=false;flash=null;
  }
  /* a file is drawn out of the rack, or put back */
  function moveTray(f,from,to){
    var t=src.tray[f];
    t.g.position.z=from;
    K.run(0.45,function(k){t.g.position.z=from+(to-from)*K.ease(k);},function(){t.g.position.z=to;},TR);
  }
  /* `accent` is pointed at the other colour: the colour draws back out of the whole way into its ingot, the foot of the empty pipe
     is carried over, and the other colour rises through `accent` into the token that is built (level 1, small) */
  function moveRef(from,to){
    var p=src.pipe,len=K.length(refPath(from,0)),len2=K.length(refPath(to,0));

  function told(res){if(res&&res.solved&&ctx0&&ctx0.notify)ctx0.notify('opDone');}
  /* The build runs. A parcel leaves the token that is built and goes down the steps on the housing. For every platform that is
     fed from the source a fresh crate then comes out, and the crate that stood there is pushed off the line: first the old one
     goes, with what a hand wrote in it still to be read, then the fresh one takes its place. A build that cannot finish leaves
     the parcel at the step where it stopped, and nothing comes out. A platform on a hand-made copy is not touched. */

    var b=res.fx.build||{},stop=b.ok?-1:stopAt(b.err);
    var pls=stop>=0?[]:['web','ios'].filter(function(pl){return now.plat[pl]&&now.plat[pl].feed==='source';});
    var t=0.1,ST=0.24,PUSH=0.9,had=false,i;
    busy=true;stepAt=-1;transit=false;
    /* until the fresh crates are there, the line shows what stood on it */
    pls.forEach(function(pl){
      var L=line[pl],bv=before.plat[pl],nv=now.plat[pl],was=onLine(bv);
      if(was){setCrate(L.old,crateText(pl,bv));seat(L.old,bv.from==='rejected');L.old.g.visible=true;L.old.box.setEdge(pal.slate);had=true;}
      L.place.visible=!was;
      setLead(L.crate,OUT);L.crate.box.setEdge(pal.ink);
      if(bv&&bv.feed==='source'){layPipe(L,bv);setDevice(L.dev,bv.ok?bv.hex:null);}

      transit=true;parcel.visible=true;parcel.position.set(CMX+CMW/2-PS/2,PY,PZ);

      K.after(t+stop*ST+0.5,function(){still();paint();told(res);},BL);

      stepAt=4;paintSteps(now);

      K.run(0.2,function(k){pls.forEach(function(pl){if(line[pl].fresh)setLead(line[pl].crate,OUT+(CX0-OUT)*K.ease(k));});},null,BL);

      K.after(t,function(){

        K.run(PUSH,function(k){pls.forEach(function(pl){var L=line[pl];if(L.old.g.visible)L.old.g.position.z=EJ*K.ease(k);});},function(){
          /* off the line it is no longer a thing: an outline on the floor, then nothing */
          pls.forEach(function(pl){var L=line[pl];if(L.old.g.visible)flat(L.old,true);});
        },BL);
      },BL);
      t+=PUSH;
    }

      K.run(0.7,function(k){pls.forEach(function(pl){if(line[pl].fresh)setLead(line[pl].crate,CX0+(CW-(now.plat[pl].from==='rejected'?SHORT:0))*K.ease(k));});},function(){
        /* in place: the device reads the file, if it can */
        pls.forEach(function(pl){
          var L=line[pl],nv=now.plat[pl];
          if(L.fresh){seat(L.crate,nv.from==='rejected');L.place.visible=nv.from==='rejected';}
          L.old.g.visible=false;
          layPipe(L,nv,0);
        });
        K.run(0.25,function(k){pls.forEach(function(pl){var nv=now.plat[pl];if(nv.ok&&nv.hex)line[pl].pipe.fill((DVX-CX0-CW)*K.ease(k));});},function(){
          /* the build is over: what it wrote is at rest, what could not be read stays where it stopped */
          pls.forEach(function(pl){var L=line[pl],nv=now.plat[pl];layPipe(L,nv);setDevice(L.dev,nv.ok?nv.hex:null);L.crate.box.setEdge(nv.from==='rejected'?pal.ink:pal.slate);});
          told(res);
          K.after(0.6,function(){still();paint();},BL);
        },BL);
      },BL);
    },BL);
  }
  function okState(st){return !!(st&&st.files&&st.plat);}

    if(fx.build){runBuild(before,now,res);return;}
    if(fx.files)FILES.forEach(function(f){if(before.files[f]!==now.files[f])moveTray(f,before.files[f]?0:DZ,now.files[f]?0:DZ);});
    if(fx.src&&before.accent!==now.accent&&now.files.options&&now.files.tokens)moveRef(before.accent,now.accent);
    if(fx.patch&&line[fx.patch]){

    }

  }

  function rest(){cur=TB.tw.restState(4,doneLit)||cur||{R:{},st:TB.ops.line.init({})};round=null;live=false;}
  function onRound(data){
    still();

    if(!data||!data.r||!okState(data.r.st)){rest();paint();return;}
    round=data;cur={R:data.R||{},st:data.r.st};

    if(data.r.busy)K.after(0.3,function(){if(ctx0&&ctx0.notify)ctx0.notify('opDone');},BL);
  }

  return {
    ops:true,noTargets:true,ownsChain:true,
    cam:{az:-24,el:26,margin:0.6},
    /* what must be in view: the line from the rack to the devices. The box is the plane of the line; what is drawn out in front of
       it and what stands behind it is let in by its height. */
    box:function(){return last&&last.plat.ios?[[XL,-0.5,-RZF],[XR,4.3,DKZ1]]:[[XL,-0.55,-RZF],[XR,3.1,HZF]];},
    build:build,
    slots:function(){return null;},
    anchor:function(){return null;},
    setLit:function(f){
      doneLit=f>=1;
      if(!group||round)return;
      still();rest();paint();
    },
    update:function(){},
    on:function(evt,data){
      if(!group)return;
      if(evt==='enter'){far=false;still();rest();paint();}
      else if(evt==='leave'){far=true;hov=null;still();rest();paint();}
      else if(evt==='idle'){still();rest();paint();}
      else if(evt==='round')onRound(data);
      else if(evt==='op')onOp(data);
      else if(evt==='result'){live=false;mark();}
      else if(evt==='complete'){live=false;mark();}
      else if(evt==='hover'){var id=data&&data.id||null;if(id!==hov){hov=id;mark();}}
      else if(evt==='pick'){if(live&&data&&data.id&&ctx0&&ctx0.notify)ctx0.notify('op',{id:data.id});}
      else if(evt==='press'){if(data&&data.id==='build'&&live){keyDown=true;mark();}}
      else if(evt==='release'){if(keyDown&&!busy){keyDown=false;mark();}}
      else if(evt==='lang'){if(busy)return;paint();}
    }
  };
})();
})();

<script>/* stations/s6.js */
/* Station 6, "Systemet" / "The system": the control room. Symptoms are on the monitors, causes are in the system.

   One rack, read from the bottom up, in the grammar of station 1:
   primitives   seven ingots. The top of an ingot is its colour, the name and the value are written on its front.
   roles        four tiles. A role has one reference per mode: a Light foot and a Dark foot, named on the tile above the foot.
   components   five blocks: the uses. A component has one reference, to a role, and knows nothing about modes.
   platforms    two build units, web and iOS: level 5's build housing, small. Each one stands on the rack and carries its two
                monitors, Light and Dark: what the platform was built with is what its monitors show.
   monitors     four sheets with the same small interface: card, title, link, the Send button and its label, each drawn in
                the colour the monitor really shows. A part that differs from the design carries four corner marks.

   A CHANGE IN THE SOURCE REACHES THE MONITORS ONLY THROUGH THE BUILDS. The rack is the source. A build unit is read from the
   left, like the line of level 5:
   the port     an outline on its top, at the left end: where the source comes up out of the rack. A parcel that stands on it
                is a change in the source that this unit has not built: its output is older than the rack.
   the steps    Merge, Transform, Resolve references, Format, written on its front in the order they run. While the build
                runs the parcel stands over the step that is running and that step is in Ink.
   the output   a crate of code, `tokens.css` or `Tokens.swift`, under the last step. Every build sets a fresh one, and the
                fresh one pushes the crate that stood there off the unit: output is generated, as in level 5.
   by hand      a colour fixed by hand in the platform's own code (the button's CSS, the app's Swift) is a slip that stands
                on top of the unit at the foot of its two monitors, its value underlined by hand. It is after the output
                and before the monitors: not in the rack, not in the crate. Both monitors take it as it is, in Light and
                in Dark. A build does not touch it: the parcel goes past in front of it, the crate under it is replaced,
                the monitors are redrawn, and the slip stands, until someone takes it out.
   After a reference has been moved in the rack, a parcel comes up through the port of every unit that follows the source.
   Web runs, then iOS: the parcel goes along the steps, the crate is replaced, and the two monitors are redrawn from below,
   Light first, then Dark. Until its own monitor has been redrawn, a part still shows what the old crate said.
   "Run the build" is the same for one unit, and nothing in the rack moves.

   NOTHING IS CONNECTED UNTIL SOMETHING IS SELECTED, AND A SELECTION SHOWS ONE LINK ONLY. Tracing is an act, link by link:
   a part on a monitor   the way from the part down to its platform's build unit, filled with the colour the monitor shows
                         (no colour: an empty tube), and an empty tube from the unit to the component block: it only says
                         which token the part uses. Nothing below the block.
   a component           its one pipe to the role it points at, filled with what that role resolves to in the mode of the
                         monitor in view. A reference to a role that does not exist is a pipe that ends in air.
   a role                both feet, each filled with the colour of the primitive it stands on, and an empty tube up to every
                         component that points at the role, each with its own place on the tile and its own lane. The Light
                         references run in front of the Dark ones, so two feet never run through each other. The foot of
                         the mode in view is in Ink: it is the one an ingot moves.
   a build unit          the key that runs it, and on the monitors the value a hand fixed, on the part it was fixed for.
   So the monitor can say grey while the tokens say blue, and the break has to be looked for in between.

   The value speaks itself: a pipe, a trace on a monitor and a part are the hex they carry. Selected and running are told by
   Ink lines, at rest by Slate. No colour says right or wrong: the marks on the monitors are Ink.

   The last round is a prediction: the planned reference is a dashed line beside the one that is there, the parts and
   monitors the player marks carry a dashed frame. When the change is carried out the builds run, and as each monitor is
   redrawn the parts that changed there get their corner marks: a dashed frame with corner marks in it was right.

   State lives in the logic (`TB.ops.diag`). Everything here is drawn from it; a sequence is an overlay on that picture, run

  /* the front of a tile: the role, and under it the two feet. While the role is selected a foot is a plate that can be

  /* The steps of a build, in a row, in the order they run. At rest they are in Slate. While the build runs the step that
     is running is in Ink and the ones it has not reached are pale. o.sx: where the parcel stands for each step, from the
     left end of the unit: over the middle of its name. */
  function stepFace(c,W,o){
    var n=[0,1,2,3].map(function(i){return TB.t('s6.st.'+i);}),w,sum,i,x=ST0,gap,size=0.2;
    c.setTransform(1,0,0,1,0,0);c.textBaseline='middle';c.textAlign='left';
    /* the four names with air between them: where they would not have it, the row is set one size smaller */
    for(;;){
      c.font='600 '+(size*RES)+'px '+K.FACE;w=[];sum=0;
      n.forEach(function(t){var m=c.measureText(t).width/RES;w.push(m);sum+=m;});
      gap=Math.min(0.36,(W-ST0-STR-sum)/3);

    for(i=0;i<4;i++){

      c.fillText(n[i],x*RES,0.16*RES);

    c.fillStyle=K.css(pal.ink);c.strokeStyle=K.css(pal.ink);c.lineWidth=0.016*RES;c.lineCap='round';c.lineJoin='round';c.setLineDash([]);

  /* ---------- state -> the one link that is drawn ---------- */
  function chainOf(st,R){
    var S={items:[],trace:null,inC:{},selC:null,selS:null,selO:null,foot:null,hand:null,plan:null};
    var pl=R.plan,mp=st.mon.split(':'),plat=mp[0],mode=mp[1],sel=pl?null:st.sel,k=sel?sel.charAt(0):'',x=sel?sel.slice(2):'',ci,si;
    /* a role's reference in a mode: it carries the colour of the primitive it stands on. view: this is the mode in view. */
    function foot(sem,m,view){
      var pn=st.sem[sem][m];
      S.items.push({kind:'foot',sem:sem,mode:m,pts:P1(D.SEMS.indexOf(sem),m,footX(D.PRIMS.indexOf(pn),m),0),hex:num(D.P[pn]),edge:view?pal.ink:pal.slate});
    }

    function ref(c,kind,hex,edge){
      var i=D.COMPS.indexOf(c),s=D.SEMS.indexOf(st.comp[c]);
      S.items.push({kind:kind,comp:c,pts:s<0?P2(i,CX(i),1):P2(i,SX(s),0),hex:s<0?null:hex,edge:edge});
    }
    /* The references of every component that points at a role. Each has its own place on the tile, in the order of the
       blocks, and its own lane: of two that go the same way, the one that turns first runs under the other. No two meet. */
    function fan(sem){
      var us=D.COMPS.filter(function(c){return st.comp[c]===sem;}),n=us.length,gl=[],gr=[];
      us.forEach(function(c,j){var i=D.COMPS.indexOf(c),u={c:c,i:i,x:SX(D.SEMS.indexOf(sem))+(j-(n-1)/2)*0.36};(CX(i)<u.x?gl:gr).push(u);});
      gl.forEach(function(u,r){u.y=YB+(r-(gl.length-1)/2)*0.13;});
      gr.forEach(function(u,r){u.y=YB+((gr.length-1)/2-r)*0.13;});
      gl.concat(gr).sort(function(a,b){return a.i-b.i;}).forEach(function(u){S.items.push({kind:'up',comp:u.c,pts:P2(u.i,u.x,0,u.y),hex:null,edge:pal.slate});});
    }

        S.selC=pl[1];ref(pl[1],'ref',null,pal.ink);si=D.SEMS.indexOf(pl[2]);
        if(!st.ran&&si>=0)S.plan=P2(D.COMPS.indexOf(pl[1]),SX(si),0).slice(0,3);
      }else if(pl[0]==='s'&&st.sem[pl[1]]){

        if(!st.ran&&D.PRIMS.indexOf(pl[3])>=0)S.plan=P1(D.SEMS.indexOf(pl[1]),pl[2],footX(D.PRIMS.indexOf(pl[3]),pl[2]),0).slice(0,3);
      }

      /* a part: what its monitor shows runs down to the build unit; from there an empty tube names the token it uses */
      ci=D.COMPS.indexOf(x);

      S.items.push({kind:'out',pts:P3(ci,MX(D.PLATS.indexOf(plat),D.MODES.indexOf(mode))+TRX[ci]),hex:null,edge:pal.ink});
      S.inC[x]=1;

  /* it.d: how far the value has come in a pipe that is being changed; without it a pipe that carries a value is full */
  function layChain(){

      var p=pipes[i],it=scene.items[i];
      if(!it){p.visible=false;continue;}
      p.visible=true;
      for(j=0;j<3;j++)p.show(j,it.pts[j].distanceTo(it.pts[j+1])>0.001);
      p.set(it.pts);
      for(j=0;j<3;j++)p.setEdge(j,it.edge);
      if(it.hex!==null)p.tone(tone3(it.hex),it.edge);
      var d=it.hex===null?-1:(it.d===undefined?p.len:it.d);

    }
